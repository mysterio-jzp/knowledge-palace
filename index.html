阵运算", "summary": "第一周：向量空间与矩阵运算 > 目标：把向量、矩阵的几何直觉建立起来，重新理解线性相关、秩、子空间这三个核心概念。 --- Day 1：向量的几何意义 学什么 核心概念： - 向量不只是数字串，它是空间中的一个箭头（或一个点） - 向量的两种基本运算：加法（平移 +…", "content": "# 第一周：向量空间与矩阵运算\n\n> 目标：把向量、矩阵的几何直觉建立起来，重新理解线性相关、秩、子空间这三个核心概念。\n\n---\n\n## Day 1：向量的几何意义\n\n### 学什么\n\n**核心概念：**\n- 向量不只是数字串，它是空间中的一个箭头（或一个点）\n- 向量的两种基本运算：加法（平移 + 首尾相接）、数乘（拉伸 / 压缩 / 翻转）\n- 向量的模（长度）$||\\mathbf{v}|| = \\sqrt{v_1^2 + v_2^2 + \\dots}$\n\n**关键直觉：** $\\mathbb{R}^2$ 中的向量 $(3, 2)$，想象从原点出发，向右走 3，向上走 2。所有运算都可以用这种几何方式理解。\n\n### 看什么\n\n🎬 3Blue1Brown《线性代数的本质》第 1 集：向量究竟是什么\n📖 Strang §1.1 ~ §1.2\n\n### 代码实践\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# === 两个向量 ===\nv = np.array([3, 2])\nw = np.array([1, 3])\n\n# === 画箭头 ===\ndef plot_vector(ax, vec, origin=[0,0], color='b', label=''):\n    ax.quiver(*origin, *vec, angles='xy', scale_units='xy', \n              scale=1, color=color, width=0.02, label=label)\n\nfig, axes = plt.subplots(1, 3, figsize=(14, 4))\n\n# 左：单独两个向量\nplot_vector(axes[0], v, color='steelblue', label='v')\nplot_vector(axes[0], w, color='coral', label='w')\naxes[0].set_title('向量 v 和 w')\naxes[0].legend()\n\n# 中：加法 v+w（平行四边形法则）\nplot_vector(axes[1], v, color='steelblue', label='v')\nplot_vector(axes[1], w, color='coral', label='w')\nplot_vector(axes[1], v + w, color='darkgreen', label='v+w')\naxes[1].set_title('v + w (平行四边形法则)')\naxes[1].legend()\n\n# 右：数乘 0.5v, 2v, -v\nfor scale, c, lbl in [(0.5, 'lightblue', '0.5v'), (2, 'darkblue', '2v'), (-1, 'red', '-v')]:\n    plot_vector(axes[2], scale * v, color=c, label=lbl)\naxes[2].set_title('数乘：缩放与翻转')\naxes[2].legend()\n\nfor ax in axes:\n    ax.set_xlim(-4, 6); ax.set_ylim(-4, 6)\n    ax.axhline(y=0, color='gray', lw=0.5)\n    ax.axvline(x=0, color='gray', lw=0.5)\n    ax.set_aspect('equal'); ax.grid(True, alpha=0.3)\n\nplt.tight_layout()\nplt.show()\n```\n\n### 自测\n\n1. 画向量 $\\mathbf{a}=(4,1)$，$\\mathbf{b}=(-2,3)$，计算并画出 $\\mathbf{a}+\\mathbf{b}$、$2\\mathbf{a}$、$-\\mathbf{b}$\n2. 给定两点 $P(1,2)$ 和 $Q(5,8)$，向量 $\\overrightarrow{PQ}$ 是什么？\n\n---\n\n## Day 2：向量的内积与投影\n\n### 学什么\n\n**核心概念：**\n- 内积（点积）$\\mathbf{v}\\cdot\\mathbf{w} = v_1w_1 + v_2w_2 + \\dots$\n- 几何意义：$\\mathbf{v}\\cdot\\mathbf{w} = ||\\mathbf{v}||\\cdot||\\mathbf{w}||\\cdot\\cos\\theta$\n- 内积 = 0 → 两向量正交（垂直）\n- 投影：把 $\\mathbf{v}$ 投到 $\\mathbf{w}$ 方向上的影子\n\n**关键直觉：** 内积衡量\"两个向量有多对齐\"。在 ML 中，内积就是注意力机制 $\\text{softmax}(QK^T)$ 的底层运算。\n\n### 代码实践\n\n```python\nv = np.array([3, 0])\nw = np.array([1, 2])\n\n# 内积\ndot = np.dot(v, w)  # = 3*1 + 0*2 = 3\n\n# 夹角的余弦\ncos_theta = dot / (np.linalg.norm(v) * np.linalg.norm(w))\ntheta = np.arccos(cos_theta)  # 弧度\nprint(f\"内积: {dot}, 夹角: {np.degrees(theta):.1f}°\")\n\n# v 在 w 上的投影\nproj = (dot / np.dot(w, w)) * w\nprint(f\"v 在 w 上的投影向量: {proj}\")\n\n# 画图\nfig, ax = plt.subplots(figsize=(6,6))\nax.quiver(0,0,*v, angles='xy',scale_units='xy',scale=1,color='steelblue',label='v')\nax.quiver(0,0,*w, angles='xy',scale_units='xy',scale=1,color='coral',label='w')\nax.quiver(0,0,*proj,angles='xy',scale_units='xy',scale=1,color='darkgreen',label='投影')\n# 虚线垂线\nax.plot([v[0], proj[0]], [v[1], proj[1]], 'k--', lw=0.8)\nax.set_xlim(-0.5, 4); ax.set_ylim(-0.5, 3.5)\nax.set_aspect('equal'); ax.grid(True, alpha=0.3); ax.legend()\nplt.show()\n```\n\n### 在 ML 中怎么用\n\n两个向量的内积就是它们在特征空间中的\"相似度\"。余弦相似度 = 归一化后的内积，是推荐系统、语义搜索的基础。\n\n---\n\n## Day 3：线性组合与张成空间\n\n### 学什么\n\n**核心概念：**\n- 线性组合：$\\mathbf{w} = a\\mathbf{v}_1 + b\\mathbf{v}_2$，$a,b$ 遍历所有实数\n- 张成空间 (span)：所有线性组合构成的集合\n- $\\mathbb{R}^2$ 中：两个不共线的向量张成整个平面；两个共线的向量只张成一条线\n\n**关键直觉：** span 就是\"用这几个向量作为基础砖块，能搭出多大空间\"。这直接影响——数据矩阵的 features 能表示多少信息。\n\n### 代码实践\n\n```python\nv1 = np.array([2, 0.5])\nv2 = np.array([0.5, 1.5])\n\nfig, ax = plt.subplots(figsize=(7, 7))\n# 画张成空间（密集采样）\nfor a in np.linspace(-3, 3, 30):\n    for b in np.linspace(-3, 3, 30):\n        p = a*v1 + b*v2\n        ax.scatter(p[0], p[1], s=0.5, c='royalblue', alpha=0.15)\n\nax.quiver(0,0,*v1, angles='xy',scale_units='xy',scale=1,color='red',width=0.015)\nax.quiver(0,0,*v2, angles='xy',scale_units='xy',scale=1,color='darkgreen',width=0.015)\nax.text(*v1, 'v1', fontsize=12, color='red')\nax.text(*v2, 'v2', fontsize=12, color='darkgreen')\nax.set_xlim(-8,8); ax.set_ylim(-8,8)\nax.set_aspect('equal'); ax.grid(True,alpha=0.2)\nax.set_title('v1 和 v2 张成的空间 = 整个平面')\nplt.show()\n```\n\n### 与线性相关的联系（为 Day 4 铺垫）\n\n思考：如果 $\\mathbf{v}_2 = 2\\mathbf{v}_1$（比如 $\\mathbf{v}_1=(1,1),\\ \\mathbf{v}_2=(2,2)$），张成的是什么？只张成一条线！这就是**线性相关**的几何版本。\n\n---\n\n## Day 4：线性相关 vs 线性无关（重点）\n\n### 学什么\n\n**核心概念（严格定义）：**\n\n向量组 $\\mathbf{v}_1, \\mathbf{v}_2, \\dots, \\mathbf{v}_n$ **线性相关**的充要条件：\n> 存在不全为零的标量 $c_1, c_2, \\dots, c_n$ 使得 $c_1\\mathbf{v}_1 + c_2\\mathbf{v}_2 + \\cdots + c_n\\mathbf{v}_n = \\mathbf{0}$\n\n否则线性无关。\n\n**等价直觉：**\n- 线性相关 = 至少有一个向量是其余向量的线性组合（\"多余的砖\"）\n- 线性无关 = 每个向量都给空间增加一个\"新方向\"\n\n**结合诊断测试题 2：** $\\mathbf{v}_1=(1,2,3)$，$\\mathbf{v}_2=(2,4,6)$，$\\mathbf{v}_3=(1,0,1)$\n- $\\mathbf{v}_2 = 2\\mathbf{v}_1$，取 $c_1 = -2, c_2 = 1, c_3 = 0$ （不全为零），满足 $-2\\mathbf{v}_1 + 1\\mathbf{v}_2 + 0\\mathbf{v}_3 = \\mathbf{0}$\n- 所以向量组线性相关 ✅\n\n### 代码实践\n\n```python\ndef check_independence(vectors, tol=1e-10):\n    \"\"\"通过解齐次方程组判断线性相关性\"\"\"\n    A = np.column_stack(vectors)\n    # 解 Ac = 0\n    # 如果零空间非平凡（有非零解），则线性相关\n    _, s, _ = np.linalg.svd(A)\n    rank = np.sum(s > tol)\n    is_independent = (rank == len(vectors))\n    print(f\"向量组:\\n{A}\")\n    print(f\"秩 = {rank}, 向量数 = {len(vectors)}\")\n    print(\"→ 线性无关\" if is_independent else \"→ 线性相关\")\n    return is_independent\n\n# 测试题2的数据\nv1 = np.array([1,2,3])\nv2 = np.array([2,4,6])\nv3 = np.array([1,0,1])\ncheck_independence([v1, v3])        # v1,v3 → 无关\ncheck_independence([v1, v2, v3])    # 三个一起 → 相关\n```\n\n### 自测\n\n判断以下向量组是否线性相关（能写出 $c_1,c_2,\\dots$ 才算真的懂）：\n1. $(1,0,0),\\ (0,1,0),\\ (0,0,1)$ — 标准基\n2. $(1,1),\\ (2,2),\\ (3,3)$ — 共线\n3. $(1,2,3),\\ (4,5,6),\\ (7,8,9)$ — 看看秩是多少\n\n---\n\n## Day 5：基与维数、子空间\n\n### 学什么\n\n**核心概念：**\n- **基**：一组能张成整个空间且线性无关的向量。$\\mathbb{R}^n$ 需要恰好 n 个向量。\n- **维数**：基中的向量个数\n- **子空间**：大空间里满足「含零、加法封闭、数乘封闭」的子集\n- 判定子空间的三条：① 零向量在不在？② 任意两个相加还在不在？③ 任意数乘还在不在？\n\n**结合诊断测试题 8：** $S = \\{(x,y,z) \\mid x+y+z=0\\}$\n- ① $\\mathbf{0}=(0,0,0)$ 满足 $0+0+0=0$ ✅\n- ② 若 $\\mathbf{u},\\mathbf{v}\\in S$，则 $u_1+u_2+u_3=0,\\ v_1+v_2+v_3=0$，相加得 $(u_1+v_1)+(u_2+v_2)+(u_3+v_3)=0+0=0$ ✅\n- ③ 若 $\\mathbf{u}\\in S$，则 $cu_1+cu_2+cu_3 = c(u_1+u_2+u_3) = c\\cdot 0 = 0$ ✅\n- 所以 S 是子空间，它的几何意义是穿过原点的一个平面。维数是 2。\n\n### 代码实践\n\n```python\n# 验证子空间：取 S = { (x,y,z) | x+y+z=0 } 中的两个向量\nu = np.array([1, -1, 0])    # 1 + (-1) + 0 = 0\nv = np.array([2, 0, -2])    # 2 + 0 + (-2) = 0\n\nprint(\"u + v =\", u+v, \"sum =\", (u+v).sum())  # 和是否还在 S 中\nprint(\"3*u =\", 3*u, \"sum =\", (3*u).sum())    # 数乘是否还在 S 中\n\n# 找 S 的一组基：两个线性无关的向量即可\n# 任取 S 中两个不共线的向量\nb1 = np.array([1, -1, 0])\nb2 = np.array([1, 0, -1])\nprint(\"\\nS 的基：\")\nprint(f\"b1 = {b1}\")\nprint(f\"b2 = {b2}\")\nprint(f\"S 的维数 = 2 (是 R³ 中的一张平面)\")\n```\n\n---\n\n## Day 6：矩阵作为线性变换（⭐ 本周核心）\n\n### 学什么\n\n**核心思想：** 矩阵不是方方的数字表格——它是**对空间的一套操作**。\n\n$$\n\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix} \n\\begin{pmatrix} x \\\\ y \\end{pmatrix} \n= x\\begin{pmatrix} a \\\\ c \\end{pmatrix} + y\\begin{pmatrix} b \\\\ d \\end{pmatrix}\n$$\n\n乘法的含义：**原来的基向量 $(1,0)$ 和 $(0,1)$ 被映射到了矩阵的两列。**\n\n**常见变换的矩阵形式：**\n\n| 变换 | 矩阵 | 效果 |\n|---|---|---|\n| 拉伸 | $\\begin{pmatrix} k & 0 \\\\ 0 & k \\end{pmatrix}$ | 均匀缩放 |\n| 水平拉伸 | $\\begin{pmatrix} k & 0 \\\\ 0 & 1 \\end{pmatrix}$ | 只拉 x 方向 |\n| 旋转 θ | $\\begin{pmatrix} \\cos\\theta & -\\sin\\theta \\\\ \\sin\\theta & \\cos\\theta \\end{pmatrix}$ | 逆时针旋转 |\n| 剪切 | $\\begin{pmatrix} 1 & k \\\\ 0 & 1 \\end{pmatrix}$ | 平行四边形变形 |\n\n### 🎬 必看\n\n3Blue1Brown 第 3 集：矩阵与线性变换。**这集看完，矩阵的全部直觉就立住了。**\n\n### 代码实践\n\n```python\ndef apply_matrix_to_grid(A, ax, title=''):\n    \"\"\"把矩阵 A 作用在单位方格网上，可视化变换\"\"\"\n    # 原始网格点\n    points = []\n    for x in np.linspace(-2, 2, 9):\n        for y in np.linspace(-2, 2, 9):\n            points.append([x, y])\n    points = np.array(points).T  # 2 x N\n    transformed = A @ points\n    \n    ax.scatter(points[0], points[1], s=5, c='gray', alpha=0.5, label='原空间')\n    ax.scatter(transformed[0], transformed[1], s=5, c='red', alpha=0.5, label='变换后')\n    \n    # 画基向量的变换\n    for orig, color in [([1,0],'steelblue'), ([0,1],'coral')]:\n        t = A @ np.array(orig)\n        ax.quiver(0,0,*t, angles='xy',scale_units='xy',scale=1,color=color,width=0.02)\n    ax.set_xlim(-6,6); ax.set_ylim(-6,6)\n    ax.set_aspect('equal'); ax.grid(True,alpha=0.3); ax.legend(fontsize=8)\n    ax.set_title(title)\n\nfig, axes = plt.subplots(1, 3, figsize=(15, 5))\napply_matrix_to_grid(np.array([[2,0],[0,1]]), axes[0], '水平拉伸')\napply_matrix_to_grid(np.array([[0,-1],[1,0]]), axes[1], '旋转 90°')\napply_matrix_to_grid(np.array([[1,1],[0,1]]), axes[2], '剪切')\nplt.tight_layout()\nplt.show()\n```\n\n### 自测\n\n把一个正方形按矩阵 $\\begin{pmatrix} 1 & 2 \\\\ 0 & 1 \\end{pmatrix}$ 变换后是什么形状？画出来或者描述。\n\n---\n\n## Day 7：矩阵的秩（承上启下）\n\n### 学什么\n\n**核心定义：**\n- **列秩** = 矩阵列向量中线性无关的个数\n- **行秩** = 矩阵行向量中线性无关的个数\n- 一个重要定理：行秩 = 列秩，我们统称**秩**\n\n**几何意义：** 秩就是矩阵作为线性变换后，输出空间的维数。\n\n- $\\text{rank}=2$ 的 2×2 矩阵：把平面映射成平面（满秩，可逆）\n- $\\text{rank}=1$ 的 2×2 矩阵：把平面压成一条线（秩亏，不可逆）\n- $\\text{rank}=0$ 的矩阵：把所有东西压到原点（零矩阵）\n\n**结合诊断测试题 9：** $A = \\begin{pmatrix} 1&2&3 \\\\ 4&5&6 \\end{pmatrix}$\n- 两行，所以秩最大为 2\n- 第二行是不是第一行的倍数？$\\frac{4}{1}=4,\\ \\frac{5}{2}=2.5,\\ \\frac{6}{3}=2$，不成比例\n- 两行线性无关 → $\\text{rank}(A) = 2$\n\n### 代码实践\n\n```python\n# 秩降维的视觉效果\nA_full  = np.array([[2, 0], [0, 2]])    # rank=2 → 保持平面\nA_rank1 = np.array([[1, 2], [2, 4]])    # rank=1 → 压成线\nA_zero  = np.array([[0, 0], [0, 0]])    # rank=0 → 压成点\n\nfig, axes = plt.subplots(1, 3, figsize=(15, 5))\napply_matrix_to_grid(A_full,  axes[0], f'rank=2 (满秩)')\napply_matrix_to_grid(A_rank1, axes[1], f'rank=1 (降一维)')\napply_matrix_to_grid(A_zero,  axes[2], f'rank=0 (全压原点)')\nplt.tight_layout()\nplt.show()\n\n# 题9 手算验证\nA = np.array([[1,2,3],[4,5,6]])\nprint(f\"题9 矩阵的秩: {np.linalg.matrix_rank(A)}\")  # → 2\n```\n\n### 一周收尾：诊断题重新攻克\n\n回到 `诊断测试.md`，独立完成题 2 和题 9，这次不仅做对，而且能用几何直觉解释：\n\n- 题 2：$\\mathbf{v}_2=2\\mathbf{v}_1$ 意味着什么？画出三个向量验证。\n- 题 9：秩 = 2 意味着这个 2×3 矩阵把 $\\mathbb{R}^3$ 映射成了 $\\mathbb{R}^2$ 中的一个什么？\n\n---\n\n## 每日节奏速查\n\n| 时间 | 内容 |\n|---|---|\n| 20-30 min | 看视频（3B1B 或 Strang），建立直觉 |\n| 20 min | 仔细阅读当日概念，搞懂定义 |\n| 20-30 min | 跑代码、改参数、画图看效果 |\n| 10-15 min | 做自测题，写在笔记里 |\n\n---\n\n## 本周产出物（放在 `线性代数/` 目录下）\n\n- `Day1-向量几何.md` — 向量运算笔记 + 截图\n- `Day3-张成空间.md` — 线性组合可视化心得\n- `Day4-线性相关.md` — 定义 + 诊断题2的严密解答\n- `Day6-线性变换.md` — 矩阵 = 变换的心得\n- `Day7-秩.md` — 秩的直觉 + 诊断题9的严密解答"}, {"id": 38, "room": "shulizhai", "date": "2026-07-07", "title": "线性代数诊断测试", "tags": [], "from": "诊断测试", "summary": "线性代数 · 诊断测试 下面有 10 道题目，覆盖线性代数的核心模块。请根据你的现有水平作答——能做多少做多少，写不出完整答案也可以写思路。目的是摸清你的起点，不是考试。 --- 模块一：矩阵与向量基础 > 1. 已知矩阵 $A = \\begin{pmatrix} 1 & 2…", "content": "# 线性代数 · 诊断测试\n\n下面有 **10 道题目**，覆盖线性代数的核心模块。请根据你的现有水平作答——**能做多少做多少**，写不出完整答案也可以写思路。目的是摸清你的起点，不是考试。\n\n---\n\n## 模块一：矩阵与向量基础\n\n> **1.** 已知矩阵 $A = \\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}$，$B = \\begin{pmatrix} 2 & 0 \\\\ 1 & -1 \\end{pmatrix}$。\n> 计算 $AB$ 和 $BA$。两者相等吗？这说明了什么？\n\n答： 计 AB = C, BA = D, c11 = 1 x 2 + 2 x 1 = 4, d11 = 2x1+0x3 = 2, 所以， AB != BA。 综上可得，矩阵乘法不满足交换律。\n\n> **2.** 判断以下三个向量是否线性相关：\n> $\\mathbf{v}_1 = (1, 2, 3)$，$\\mathbf{v}_2 = (2, 4, 6)$，$\\mathbf{v}_3 = (1, 0, 1)$\n\n答： v2 = 2v1, v1 与 v2 线性相关。 线性相关定义模糊！\n\n---\n\n## 模块二：线性方程组与高斯消元\n\n> **3.** 用高斯消元法求解：\n> $$\n> \\begin{cases}\n> x + 2y + z = 4 \\\\\n> 2x + 5y + 3z = 9 \\\\\n> x + y + 4z = 5\n> \\end{cases}\n> $$\n\n答：\n$$\n\\begin{pmatrix}\n1 & 2 & 1 \\\\\n2 & 5 & 3 \\\\\n1 & 1 & 4\n\\end{pmatrix}\n\\begin{pmatrix}\nx \\\\\ny \\\\\nz\n\\end{pmatrix}\n=\n\\begin{pmatrix}\n4 \\\\\n9 \\\\\n5\n\\end{pmatrix}\n$$\n高斯消元方法未接触过。\n\n\n\n> **4.** 讨论以下方程组解的情况（唯一解 / 无穷多解 / 无解）：\n> $$\n> \\begin{cases}\n> x + y = 3 \\\\\n> 2x + 2y = 7\n> \\end{cases}\n> $$\n\n答： 无解。 由1式 x2 可得 $2x+2y=6$ ，与2式相减得$0=-1$，错误，由此无解\n\n---\n\n## 模块三：行列式与逆矩阵\n\n> **5.** 计算行列式：\n> $$\n> \\begin{vmatrix}\n> 2 & 1 & 0 \\\\\n> 1 & 3 & 1 \\\\\n> 0 & 1 & 2\n> \\end{vmatrix}\n> $$\n\n答： 行列式计算方法遗忘\n\n> **6.** 矩阵 $A = \\begin{pmatrix} 1 & 2 \\\\ 3 & 5 \\end{pmatrix}$ 是否可逆？如果可逆，求 $A^{-1}$。\n\n答： 逆矩阵计算方法遗忘\n\n---\n\n## 模块四：特征值与特征向量\n\n> **7.** 求矩阵 $A = \\begin{pmatrix} 3 & 1 \\\\ 0 & 2 \\end{pmatrix}$ 的特征值和特征向量。\n\n答： 特征值计算方法遗忘\n\n---\n\n## 模块五：向量空间与线性变换\n\n> **8.** 判断以下集合是否构成 $\\mathbb{R}^3$ 的子空间：\n> $S = \\{ (x, y, z) \\in \\mathbb{R}^3 \\mid x + y + z = 0 \\}$\n\n答：构成\n\n> **9.** 求矩阵 $A = \\begin{pmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\end{pmatrix}$ 的秩。\n\n答：秩概念与计算方法遗忘\n\n---\n\n## 模块六：正交性与二次型（进阶）\n\n> **10.** 用施密特正交化方法将以下向量组标准正交化：\n> $\\mathbf{v}_1 = (1, 1, 0), \\quad \\mathbf{v}_2 = (1, 0, 1), \\quad \\mathbf{v}_3 = (0, 1, 1)$\n\n答： 施密特正交化方法遗忘\n\n---\n\n## 💬 额外参考信息（选填）\n\n为帮你定制更精准的复习路线，请告诉我：\n\n- 你的学习目标是什么？（考研 / 机器学习前置 / 期末备考 / 纯兴趣 / 其他）\n- A: 机器学习前置\n- 之前学过线性代数的程度？（零基础 / 学过但忘了 / 学过但没学懂 / 比较扎实）\n- A: 学过但忘了\n- 偏好的学习方式？（手推公式 / 看视频 + 做题 / 需要直观几何直觉 / 结合编程实现）\n- A: 结合编程实现\n\n---\n\n**请回复你的答案（标明题号），我会根据你的回答分析薄弱点，构建个性化复习路线。**"}, {"id": 39, "room": "shiyi", "date": "2026-06-12", "title": "Linux 网络接口基础：eth0、lo、veth pair", "tags": [], "from": "Linux 网络接口基础：eth0、lo、veth pair", "summary": "> 理解沙箱网络隔离的前置知识。这些是 Linux 中最常见的网络接口类型，你的 netns + nftables 方案全程依赖它们。 1. eth0 — 物理网卡 eth0 是你电脑对外通信的物理出口。…", "content": "> 理解沙箱网络隔离的前置知识。这些是 Linux 中最常见的网络接口类型，你的 netns + nftables 方案全程依赖它们。\n\n## 1. eth0 — 物理网卡\n\n```\n┌─────────────────────────────────────┐\n│              你的电脑                  │\n│                                     │\n│  ┌───────┐                          │\n│  │ eth0  │──── 网线 / WiFi ──── 路由器 ── 互联网\n│  └───────┘                          │\n│                                     │\n└─────────────────────────────────────┘\n```\n\n**eth0 是你电脑对外通信的物理出口。** 就像你家的门牌号——别人要寄快递给你，得写这个地址；你要出去，也得从这个门走。\n\n| 属性 | 说明 |\n|------|------|\n| **全称** | Ethernet Interface 0（第一个以太网接口） |\n| **本质** | 物理网卡的内核抽象 |\n| **IP 地址** | 如 `192.168.1.10`，由 DHCP 分配或静态配置 |\n| **MAC 地址** | 硬件出厂自带，如 `aa:bb:cc:dd:ee:ff` |\n| **对应设备** | 实体网线口 / WiFi 芯片 |\n\n```bash\n# 查看你机器上的 eth0\nip addr show eth0\n# 2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500\n#     inet 192.168.1.10/24 brd 192.168.1.255 scope global eth0\n\n# Docker 容器里的 eth0 是虚拟的，但角色一样——都是容器对外的\"门\"\n```\n\n> **macOS 例外**：苹果设备不用 `eth0` 命名，无线网卡叫 `en0`。但概念完全一样。\n\n---\n\n## 2. lo — 本地回环接口\n\n```\n┌─────────────────────────────────────┐\n│              你的电脑                  │\n│                                     │\n│  ┌──────┐                           │\n│  │  lo  │ ← 127.0.0.1               │\n│  └──────┘    （自己连自己）            │\n│                                     │\n│  进程 A ──→ 127.0.0.1:8080 ──→ 进程 B │\n│  （都是本机的进程）                     │\n└─────────────────────────────────────┘\n```\n\n**lo 是进程和自己这台机器上的其他进程通信用的。** 数据不出网卡，不走网络协议栈的下半段（不需要 ARP、不需要路由），纯内存拷贝，极快。\n\n| 属性 | 说明 |\n|------|------|\n| **全称** | Loopback Interface |\n| **IP** | 固定 `127.0.0.1`（IPv4）和 `::1`（IPv6） |\n| **流量** | 只在本机内部流转，永远不经过物理网卡 |\n| **速度** | 极快（纯内存操作，无网络延迟） |\n| **用途** | 本机进程间通信：数据库连接 `localhost:3306`、本地 Web 开发 `localhost:3000` |\n\n```bash\n# 每台机器都有 lo，无需配置，系统自带\nip addr show lo\n# 1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536\n#     inet 127.0.0.1/8 scope host lo\n\n# ping 自己，永远通\nping 127.0.0.1   # 0.02ms — 比真正网络快几百倍\n```\n\n**和沙箱的关系**：每个新创建的 netns 默认也只有 lo——意味着盒子里的进程可以自己和自己通信，但和外界完全隔绝。\n\n---\n\n## 3. veth pair — 虚拟网线\n\n```\n            veth pair（一对）\n    ┌─────────────────────────────┐\n    │                             │\n    ▼                             ▼\n┌───────┐                     ┌───────┐\n│veth_h │◄───────────────────►│veth_j │\n│ .1    │    像一根网线的两端     │ .2    │\n└───────┘                     └───────┘\n    │                             │\n    ▼                             ▼\n 宿主机 netns               sandbox netns\n```\n\n**veth pair 是一对虚拟以太网设备，成对出现，像一根网线的两端。** 一端插在 namespace A，另一端插在 namespace B，数据从一端进、另一端出。\n\n| 属性 | 说明 |\n|------|------|\n| **全称** | Virtual Ethernet Pair |\n| **本质** | 内核中的一对虚拟网卡，数据在它们之间直接转发 |\n| **关键特性** | **成对创建**，不能单独存在；一端收到数据，另一端立刻收到 |\n| **用途** | 连接两个 network namespace |\n\n### 3.1 为什么需要 veth pair\n\nnetns 创建后默认只有 lo，和外界完全不通。要让盒子里能上网，需要在宿主机 netns 和沙箱 netns 之间搭一座桥——veth pair 就是这座桥：\n\n```bash\n# 1. 创建一根\"虚拟网线\"\nip link add veth_h type veth peer name veth_j\n#    ┌──────┐      ┌──────┐\n#    │veth_h│◄────►│veth_j│   一对，同时出生\n#    └──────┘      └──────┘\n\n# 2. 把 veth_j 端移入沙箱 netns\nip link set veth_j netns sandbox\n#    宿主机 netns              sandbox netns\n#    ┌──────┐                ┌──────┐\n#    │veth_h│◄── veth pair ──►│veth_j│\n#    └──────┘                └──────┘\n\n# 3. 分别给两端配 IP 并启用\nip addr add 10.200.0.1/30 dev veth_h\nip netns exec sandbox ip addr add 10.200.0.2/30 dev veth_j\nip link set veth_h up\nip netns exec sandbox ip link set veth_j up\n\n# 4. 盒子里加默认路由 — 所有流量走 veth_j 出去\nip netns exec sandbox ip route add default via 10.200.0.1\n```\n\n### 3.2 数据怎么流\n\n```\n沙箱内 ping 8.8.8.8\n    │\n    ▼\n查路由表: default via 10.200.0.1 → 走 veth_j\n    │\n    ▼\nveth_j 发出 → 经过 veth pair → veth_h 收到（出现在宿主机 netns）\n    │\n    ▼\n宿主机路由: 8.8.8.8 → 走 eth0 → 互联网\n    │\n    ▼\n回包: eth0 → 宿主机 netns → veth_h → veth pair → veth_j → 沙箱内进程\n```\n\n**一句话：veth pair 就是 namespace 之间的\"网线\"。**\n\n### 3.3 在你的项目里\n\n```\n宿主机 netns               starmerx_jail netns\n┌────────────┐            ┌──────────────┐\n│            │            │              │\n│  veth_j_h  │◄─ pair ──►│  veth_j_j    │\n│  10.200.0.1│            │  10.200.0.2  │\n│            │            │              │\n│  代理 :8888│            │  nftables:   │\n│            │            │  只允许 →     │\n│            │            │  :53 + :8888 │\n└────────────┘            └──────────────┘\n```\n\n---\n\n## 4. 三者关系一张图\n\n```\n物理机 / 宿主机 netns\n┌──────────────────────────────────────────────────────────┐\n│                                                          │\n│  eth0 (192.168.1.10)                                      │\n│    │                                                     │\n│    ├── 互联网 ← 真正的物理出口                              │\n│    │                                                     │\n│  lo (127.0.0.1)                                          │\n│    ├── 本机进程间通信，不出网卡                              │\n│    │                                                     │\n│  veth_j_h (10.200.0.1)                                   │\n│    │                                                     │\n│    └── veth pair ──────────────────────────────┐         │\n│                                                 │         │\n└─────────────────────────────────────────────────│─────────┘\n                                                  │\n                    ┌─────────────────────────────┘\n                    ▼\n          sandbox netns\n          ┌──────────────────────────────┐\n          │                              │\n          │  lo (127.0.0.1)               │\n          │    ├── sandbox 内进程间通信     │\n          │                              │\n          │  veth_j_j (10.200.0.2)        │\n          │    ├── 唯一对外通道            │\n          │    └── 经 veth pair → 宿主机   │\n          │                              │\n          │  路由: default via 10.200.0.1  │\n          │  nftables: DROP all except     │\n          │    :53 + :8888                │\n          └──────────────────────────────┘\n```\n\n---\n\n## 5. 速查对比\n\n| | eth0 | lo | veth pair |\n|---|------|-----|-----------|\n| **是什么** | 物理网卡/主出口 | 本机回环，自己连自己 | 一对虚拟网卡，成对出现 |\n| **流量去哪** | 出机器，经路由器到互联网 | 不出机器，纯内存 | 从一端进、另一端出 |\n| **在 sandbox 中存在吗** | ❌ 默认没有 | ✅ 默认有 | ✅ 手动创建后才有 |\n| **典型 IP** | `192.168.1.10` | `127.0.0.1` | `10.200.0.x`（自定义） |\n| **你的项目中** | 宿主机用它出外网 | sandbox 内进程间通信 | 连接宿主机和 sandbox netns |\n\n---\n\n## 6. 延伸阅读\n\n- [[网络隔离三层架构：netns + nftables + HTTP 代理]] — veth pair 在三层架构中的实际位置\n- [[内网沙箱网络隔离技术文档]] — setup_netns.sh 中 veth 的完整配置\n- [[nsjail 技术详解：Linux Namespace 与进程隔离原理]] — Network Namespace 章节"}]
</script>
<script>
/* ================== DATA LOADING ================== */
var ITEMS = JSON.parse(document.getElementById('notes-data').textContent);

var ROOMS = [
  {id:'all',  zh:'全殿总览', en:'All'},
  {id:'wenyuan', zh:'文渊阁', en:'Agent Engineering'},
  {id:'tongdian', zh:'通典阁', en:'Protocols & Architecture'},
  {id:'guanxing', zh:'观星台', en:'AI Theory'},
  {id:'shulizhai', zh:'数理斋', en:'Mathematics'},
  {id:'shiyi', zh:'拾遗廊', en:'Overview & Misc'},
];

/* ================== MARKDOWN RENDERER ================== */
function md2html(md) {
  if (!md) return '';
  if (md.startsWith('---')) {
    var end = md.indexOf('---', 3);
    if (end !== -1) md = md.substring(end + 3).trim();
  }
  var html = md;
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    return '<pre><code>' + esc(code.trim()) + '</code></pre>';
  });
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>');
  html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^\|(.+)\|$/gm, function(line) {
    var cells = line.split('|').filter(function(c) { return c.trim(); });
    if (cells.every(function(c) { return /^[-:]+$/.test(c.trim()); })) return '<!--sep-->';
    return '<tr>' + cells.map(function(c) { return '<td>' + c.trim() + '</td>'; }).join('') + '</tr>';
  });
  var lines = html.split('\n');
  var out = [], inList = false, inTable = false;
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (!t) {
      if (inList) { out.push('</ul>'); inList = false; }
      if (inTable) { out.push('</table>'); inTable = false; }
      out.push(''); continue;
    }
    if (t.startsWith('<h') || t.startsWith('<pre') || t.startsWith('<blockquote') || t.startsWith('<hr') || t.startsWith('<table') || t.startsWith('<tr') || t === '<!--sep-->') {
      if (inList) { out.push('</ul>'); inList = false; }
      out.push(t); continue;
    }
    if (t.startsWith('<li>')) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(t); continue;
    }
    if (t.startsWith('<td>')) {
      if (!inTable) { out.push('<table>'); inTable = true; }
      out.push(t); continue;
    }
    out.push('<p>' + t + '</p>');
  }
  if (inList) out.push('</ul>');
  if (inTable) out.push('</table>');
  html = out.join('\n');
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ================== APP LOGIC ================== */
var activeRoom='all', query='';

function roomName(id){ var r=ROOMS.find(function(x){ return x.id===id; }); return r ? r.zh : id; }
function roomEn(id){ var r=ROOMS.find(function(x){ return x.id===id; }); return r ? r.en : id; }

function renderTabs(){
  document.getElementById('tabs').innerHTML = ROOMS.map(function(r){
    var n = r.id==='all' ? ITEMS.length : ITEMS.filter(function(i){ return i.room===r.id; }).length;
    return '<button class="tab'+(activeRoom===r.id?' active':'')+'" data-room="'+r.id+'">'+r.zh+'<em>'+r.en+'</em><span class="n">'+n+'</span></button>';
  }).join('');
}

function currentItems(){
  return ITEMS.filter(function(i){
    if(activeRoom!=='all' && i.room!==activeRoom) return false;
    if(!query) return true;
    var q = query.toLowerCase();
    return (i.title + i.summary + i.tags.join('') + roomName(i.room)).toLowerCase().includes(q);
  });
}

function renderSpotlight(){
  var list = currentItems();
  var pick = list.find(function(i){ return i.featured; }) || list[0];
  var sp = document.getElementById('spotlight');
  if(!pick){ sp.style.display='none'; return; }
  sp.style.display='block';
  sp.innerHTML = '<p class="k">镇馆之宝 · SPOTLIGHT</p><h3>'+esc(pick.title)+'</h3><p>'+esc(pick.summary)+'</p><p class="from">— '+esc(pick.from)+' · '+esc(roomName(pick.room))+'</p>';
  sp.onclick = function(){ openArticle(pick.id); };
}

function renderGrid(){
  var list = currentItems();
  var grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML='<div class="empty">此殿空空如也，换个殿室看看——</div>'; }
  else {
    grid.innerHTML = list.map(function(i, idx){
      return '<article class="card" data-id="'+i.id+'" style="transition-delay:'+Math.min(idx*45,400)+'ms">'+
        '<span class="date">'+esc(i.date)+'</span>'+
        '<span class="room-tag">'+esc(roomEn(i.room))+' · '+esc(roomName(i.room))+'</span>'+
        '<h4>'+esc(i.title)+'</h4>'+
        '<p>'+esc(i.summary||'')+'</p>'+
        '<div class="tags">'+i.tags.map(function(t){ return '<i>'+esc(t)+'</i>'; }).join('')+'</div>'+
      '</article>';
    }).join('');
  }
  document.getElementById('countLine').textContent = '· 共 '+list.length+' 件藏品 ·';
}

function render(){ renderTabs(); renderSpotlight(); renderGrid(); observe(); }

/* ================== ARTICLE VIEW ================== */
function openArticle(id){
  var item = ITEMS.find(function(i){ return i.id===id; });
  if(!item) return;
  document.getElementById('homePage').style.display='none';
  var ap = document.getElementById('articlePage');
  ap.classList.add('active');
  document.getElementById('aRoom').textContent = roomEn(item.room)+' · '+roomName(item.room);
  document.getElementById('aTitle').textContent = item.title;
  document.getElementById('aMeta').textContent = '收藏于 '+item.date+' · '+item.from;
  document.getElementById('aTags').innerHTML = item.tags.map(function(t){ return '<i>'+esc(t)+'</i>'; }).join('');
  document.getElementById('aBody').innerHTML = md2html(item.content);
  document.getElementById('articlePage').scrollIntoView({ behavior: 'smooth', block: 'start' });
  window.location.hash = 'article/'+id;
}

function goHome(){
  document.getElementById('articlePage').classList.remove('active');
  document.getElementById('homePage').style.display='';
  window.location.hash = '';
  window.scrollTo(0,0);
  observe();
}

/* ================== ROUTER ================== */
function handleRoute(){
  var hash = window.location.hash;
  if(hash.startsWith('#article/')){
    var id = parseInt(hash.split('/')[1]);
    if(!isNaN(id)) openArticle(id);
  } else {
    document.getElementById('articlePage').classList.remove('active');
    document.getElementById('homePage').style.display='';
  }
}
window.addEventListener('hashchange', handleRoute);

/* ================== EVENT LISTENERS ================== */
document.getElementById('tabs').addEventListener('click', function(e){
  var btn = e.target.closest('.tab'); if(!btn) return;
  activeRoom = btn.dataset.room; render();
});
document.getElementById('search').addEventListener('input', function(e){ query=e.target.value.trim(); renderSpotlight(); renderGrid(); });
document.getElementById('randomBtn').addEventListener('click', function(){
  var pool = activeRoom==='all' ? ITEMS : ITEMS.filter(function(i){ return i.room===activeRoom; });
  if(pool.length) openArticle(pool[Math.floor(Math.random()*pool.length)].id);
});
document.getElementById('grid').addEventListener('click', function(e){
  var card = e.target.closest('.card'); if(!card) return;
  openArticle(parseInt(card.dataset.id));
});

/* ================== STATS ================== */
function countUp(el, target, ms){
  ms = ms || 1200;
  var t0 = performance.now();
  (function tick(t){
    var p = Math.min((t-t0)/ms, 1);
    el.textContent = Math.round(target*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(tick);
  })(t0);
}
var start = new Date('2025-06-01');
countUp(document.getElementById('statItems'), ITEMS.length);
countUp(document.getElementById('statRooms'), ROOMS.length-1);
countUp(document.getElementById('statDays'), Math.floor((Date.now()-start)/864e5), 1600);

/* ================== SCROLL REVEAL ================== */
var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }}); }, {threshold:.12});
function observe(){ document.querySelectorAll('.reveal:not(.in)').forEach(function(el){ io.observe(el); }); }

/* ================== FIREFLIES ================== */
var ff = document.getElementById('fireflies');
for(var i=0; i<16; i++){
  var s = document.createElement('i');
  s.style.left = Math.random()*100+'%';
  s.style.top = (20+Math.random()*75)+'%';
  s.style.setProperty('--dx', (Math.random()*160-80)+'px');
  s.style.setProperty('--dy', (-60-Math.random()*120)+'px');
  s.style.animationDelay = (Math.random()*11)+'s';
  s.style.animationDuration = (8+Math.random()*8)+'s';
  ff.appendChild(s);
}

render();
if(window.location.hash) handleRoute();
observe();
</script>
</body>
</html>
