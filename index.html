                                 │\n│       │                                                        │\n│       ├── LiteTopic \"session_001\" ──→ 线程 T1（串行处理）        │\n│       ├── LiteTopic \"session_002\" ──→ 线程 T2（串行处理）        │\n│       ├── LiteTopic \"session_003\" ──→ 线程 T3（串行处理）        │\n│       └── LiteTopic \"session_004\" ──→ 线程 T4（串行处理）        │\n│                                                                 │\n│  队列间完全并行，互不影响                                         │\n│  单队列内严格串行，保证顺序                                       │\n│                                                                 │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 5. 代码实现 \n> [!WARNING]\n> rocketMQ未完全适配python， 以下代码当作伪代码看即可\n\n### 5.1 生产者实现（Python）\n\n```python\nimport json\nimport time\nfrom rocketmq.client import Producer, Message\n\nclass LiteTopicProducer:\n    \"\"\"LiteTopic 生产者（单例复用）\"\"\"\n    \n    def __init__(self, name_server: str, parent_topic: str, producer_group: str):\n        self.parent_topic = parent_topic\n        self.producer = Producer(producer_group)\n        self.producer.set_name_server_address(name_server)\n        self.producer.set_use_grpc(True)  # 启用 gRPC\n        self.producer.start()\n        print(f\"LiteTopic producer started, parent topic: {parent_topic}\")\n    \n    def send_to_session(self, session_id: str, chat_id: str, content: str, **kwargs):\n        \"\"\"\n        发送消息到指定 Session 的 LiteTopic\n        LiteTopic 会在首次发送时自动创建\n        \"\"\"\n        message_body = {\n            \"chatId\": chat_id,\n            \"sessionId\": session_id,\n            \"content\": content,\n            \"timestamp\": int(time.time() * 1000),\n            **kwargs\n        }\n        \n        msg = Message(self.parent_topic)\n        msg.set_keys(chat_id)\n        msg.set_tags(\"dialogue\")\n        msg.set_body(json.dumps(message_body))\n        # 关键：LiteTopic 名称直接使用 session_id\n        msg.set_lite_topic(session_id)\n        \n        ret = self.producer.send(msg)\n        print(f\"Sent - sessionId: {session_id}, chatId: {chat_id}, msgId: {ret.msg_id}\")\n        return ret\n    \n    def shutdown(self):\n        self.producer.shutdown()\n\n\n# 全局单例生产者\n_producer_instance = None\n\ndef get_producer(name_server: str, parent_topic: str, producer_group: str) -> LiteTopicProducer:\n    \"\"\"获取生产者单例\"\"\"\n    global _producer_instance\n    if _producer_instance is None:\n        _producer_instance = LiteTopicProducer(name_server, parent_topic, producer_group)\n    return _producer_instance\n```\n\n### 5.2 消费者实现（Python）- 单例 + 动态订阅\n\n```python\nimport json\nimport threading\nfrom typing import Dict, Callable, Optional\nfrom rocketmq.client import LitePushConsumer, ConsumeStatus\n\nclass LiteTopicConsumer:\n    \"\"\"\n    LiteTopic 消费者（单例 + 动态订阅）\n    \n    核心设计：\n    - 单个 Consumer 实例\n    - 动态订阅/退订多个 LiteTopic（每个 session 一个）\n    - 队列间并行处理，队列内串行处理\n    \"\"\"\n    \n    def __init__(self, name_server: str, parent_topic: str, consumer_group: str):\n        self.parent_topic = parent_topic\n        self.consumer = LitePushConsumer(consumer_group)\n        self.consumer.set_name_server_address(name_server)\n        self.consumer.set_use_grpc(True)\n        # 关键：设置 LITE_SELECTIVE 模式，支持动态差异化订阅\n        self.consumer.set_consumer_mode(\"LITE_SELECTIVE\")\n        \n        # 记录已订阅的 session 及其 handler（用于幂等和状态管理）\n        self._handlers: Dict[str, Callable] = {}\n        self._lock = threading.RLock()\n        \n        # 启动消费者\n        self.consumer.start()\n        print(f\"LiteTopic consumer started, group: {consumer_group}\")\n    \n    def subscribe_session(self, session_id: str, message_handler: Callable):\n        \"\"\"\n        动态订阅 Session 的 LiteTopic\n        \n        会话建立时调用，运行时动态增加订阅，无需重启\n        \"\"\"\n        with self._lock:\n            # 幂等检查：避免重复订阅\n            if session_id in self._handlers:\n                return\n            \n            # 动态订阅\n            self.consumer.subscribe_lite_topic(\n                self.parent_topic,\n                session_id,  # LiteTopic 名称 = session_id\n                lambda msg: self._callback_wrapper(session_id, msg)\n            )\n            self._handlers[session_id] = message_handler\n            print(f\"Subscribed to session: {session_id}, total: {len(self._handlers)}\")\n    \n    def unsubscribe_session(self, session_id: str):\n        \"\"\"\n        动态退订 Session 的 LiteTopic\n        \n        会话结束时调用，释放订阅配额\n        注意：退订不会删除 LiteTopic，只取消订阅关系\n        \"\"\"\n        with self._lock:\n            if session_id not in self._handlers:\n                return\n            \n            self.consumer.unsubscribe_lite_topic(self.parent_topic, session_id)\n            del self._handlers[session_id]\n            print(f\"Unsubscribed from session: {session_id}, remaining: {len(self._handlers)}\")\n    \n    def _callback_wrapper(self, session_id: str, msg):\n        \"\"\"回调包装器，处理消息并确保顺序\"\"\"\n        try:\n            body = json.loads(msg.body)\n            chat_id = body.get(\"chatId\")\n            content = body.get(\"content\")\n            \n            print(f\"Processing - sessionId: {session_id}, chatId: {chat_id}\")\n            \n            # 调用业务处理函数\n            handler = self._handlers.get(session_id)\n            if handler:\n                handler(session_id, body)\n            else:\n                print(f\"Warning: no handler for session {session_id}\")\n            \n            return ConsumeStatus.CONSUME_SUCCESS\n        except Exception as e:\n            print(f\"Error processing message for session {session_id}: {e}\")\n            # 返回 SUSPEND 触发重试，但不阻塞其他 LiteTopic\n            return ConsumeStatus.RECONSUME_LATER\n    \n    def get_active_session_count(self) -> int:\n        \"\"\"获取当前活跃的 Session 数量\"\"\"\n        return len(self._handlers)\n    \n    def shutdown(self):\n        \"\"\"关闭消费者，同时退订所有会话\"\"\"\n        with self._lock:\n            for session_id in list(self._handlers.keys()):\n                self.consumer.unsubscribe_lite_topic(self.parent_topic, session_id)\n            self._handlers.clear()\n        self.consumer.shutdown()\n        print(\"LiteTopic consumer shutdown\")\n\n\n# 全局单例消费者\n_consumer_instance = None\n\ndef get_consumer(name_server: str, parent_topic: str, consumer_group: str) -> LiteTopicConsumer:\n    \"\"\"获取消费者单例\"\"\"\n    global _consumer_instance\n    if _consumer_instance is None:\n        _consumer_instance = LiteTopicConsumer(name_server, parent_topic, consumer_group)\n    return _consumer_instance\n```\n\n### 5.3 业务集成示例\n\n```python\n# ========== 业务处理函数 ==========\n\ndef handle_session_message(session_id: str, message: dict):\n    \"\"\"\n    业务处理函数\n    \n    注意：此函数可能被多个线程并发调用（不同 session），需要保证线程安全\n    但同一 session 的消息是串行处理的，不会并发\n    \"\"\"\n    chat_id = message.get(\"chatId\")\n    content = message.get(\"content\")\n    \n    # TODO: 业务逻辑\n    # 1. 存储消息到数据库\n    # 2. 更新会话状态\n    # 3. 调用对话模型\n    # 4. 通过 WebSocket 推送给客户端\n    \n    print(f\"Handling - session: {session_id}, chat: {chat_id}, content: {content}\")\n\n\n# ========== 应用初始化 ==========\n\n# 配置参数（应用启动时加载）\nNAME_SERVER = \"192.168.0.1:8081\"\nPARENT_TOPIC = \"dialogue_parent_topic\"\nPRODUCER_GROUP = \"dialogue_producer\"\nCONSUMER_GROUP = \"dialogue_consumer\"\n\n# 初始化生产者和消费者（各一个单例）\nproducer = get_producer(NAME_SERVER, PARENT_TOPIC, PRODUCER_GROUP)\nconsumer = get_consumer(NAME_SERVER, PARENT_TOPIC, CONSUMER_GROUP)\n\n\n# ========== WebSocket 集成 ==========\n\ndef on_websocket_connect(session_id: str):\n    \"\"\"WebSocket 连接建立时\"\"\"\n    # 动态订阅该 Session 的消息\n    consumer.subscribe_session(session_id, handle_session_message)\n\n\ndef on_websocket_disconnect(session_id: str):\n    \"\"\"WebSocket 连接断开时\"\"\"\n    # 动态退订，释放订阅配额\n    consumer.unsubscribe_session(session_id)\n\n\ndef on_user_message(session_id: str, chat_id: str, content: str):\n    \"\"\"用户发送消息时\"\"\"\n    # 发送消息到 MQ\n    producer.send_to_session(session_id, chat_id, content)\n```\n\n---\n\n## 6. 断点续传支持\n\n### 6.1 实现代码\n\n```python\nclass ResumableLiteTopicConsumer(LiteTopicConsumer):\n    \"\"\"支持断点续传的消费者\"\"\"\n    \n    def get_consumer_offset(self, session_id: str) -> Optional[int]:\n        \"\"\"获取指定 Session 的当前消费位点\"\"\"\n        with self._lock:\n            if session_id not in self._handlers:\n                return None\n            return self.consumer.get_offset(self.parent_topic, session_id)\n    \n    def resume_from_offset(self, session_id: str, offset: int):\n        \"\"\"从指定 Offset 恢复消费\"\"\"\n        with self._lock:\n            if session_id not in self._handlers:\n                return\n            self.consumer.seek(self.parent_topic, session_id, offset)\n            print(f\"Resumed session {session_id} from offset {offset}\")\n    \n    def subscribe_session_with_resume(self, session_id: str, \n                                       message_handler: Callable,\n                                       last_offset: Optional[int] = None):\n        \"\"\"订阅并支持断点续传\"\"\"\n        self.subscribe_session(session_id, message_handler)\n        if last_offset is not None:\n            self.resume_from_offset(session_id, last_offset)\n```\n\n### 6.2 应用场景\n\n**WebSocket 重连场景**：\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                    断点续传流程                                  │\n├─────────────────────────────────────────────────────────────────┤\n│                                                                 │\n│  1. 客户端 WebSocket 断开                                       │\n│  2. 服务端记录该 Session 的最后消费位点（存储到 Redis/DB）       │\n│  3. 客户端重连，携带 session_id 和 last_offset                  │\n│  4. 新节点调用 subscribe_session_with_resume()                  │\n│  5. 从 last_offset 继续消费，消息不丢、不重复                    │\n│                                                                 │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 7. LiteTopic 自动生命周期管理\n\n### 7.1 生命周期流程图\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                    LiteTopic 自动生命周期                         │\n├─────────────────────────────────────────────────────────────────┤\n│                                                                 │\n│  ① 自动创建              ② 活跃期                ③ 自动删除      │\n│                                                                 │\n│  首次发送或订阅时    ──→   持续收发消息      ──→   超过 TTL 后    │\n│  系统自动创建资源          正常使用             释放存储和配额    │\n│                                                                 │\n│  耗时：毫秒级            时长：业务决定         无需人工干预      │\n│  对业务透明              按需使用              自动清理          │\n│                                                                 │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n### 7.2 自动创建机制\n\n| 属性 | 说明 |\n|------|------|\n| **触发条件** | 首次发送消息（`set_lite_topic`）或首次订阅（`subscribe_lite_topic`） |\n| **创建耗时** | 毫秒级，对业务透明 |\n| **是否需要预创建** | 不需要 |\n| **队列数量** | 每个 LiteTopic 默认 1 个队列，天然保证顺序 |\n\n### 7.3 自动删除机制（TTL）\n\n| 配置项 | 说明 |\n|--------|------|\n| **触发条件** | 距离最后一次消息写入超过 `expiration` 时间 |\n| **删除粒度** | 整个 LiteTopic 被删除 |\n| **配额释放** | 释放占用的订阅配额计数 |\n| **建议 TTL** | 短会话 5-10 分钟，长会话 1-24 小时 |\n\n### 7.4 重要提示\n\n> **注意**：即使 LiteTopic 已从系统中删除，但若仍有消费者客户端保持对其的订阅关系，该订阅关系依然会被计入订阅总数，直至消费者停止订阅。\n\n因此，**会话结束时必须主动调用 `unsubscribe_session()`**，释放订阅配额。\n\n---\n\n## 8. 订阅与退订机制详解\n\n### 8.1 为什么需要动态退订？\n\n**核心原因：释放订阅配额**\n\nRocketMQ 实例对 LiteTopic 订阅数量有**硬性配额限制**。如果不退订，即使会话已结束，订阅关系仍被占用，会导致新会话无法建立订阅。\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                    订阅配额示例                                  │\n├─────────────────────────────────────────────────────────────────┤\n│                                                                 │\n│  假设实例限制：总订阅关系数 ≤ 10,000                            │\n│                                                                 │\n│  如果不退订：                                                   │\n│  ├── Session 1 建立连接 → 订阅关系 +1                          │\n│  ├── Session 2 建立连接 → 订阅关系 +1                          │\n│  ├── ...                                                        │\n│  └── Session 10,000 建立连接 → 订阅关系满，新会话失败 ❌        │\n│                                                                 │\n│  如果及时退订：                                                 │\n│  ├── Session 结束 → 订阅关系 -1（释放配额）                     │\n│  └── 新会话可以继续建立，形成良性循环 ✅                         │\n│                                                                 │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n### 8.2 退订 vs 删除的区别\n\n| 操作 | 作用范围 | 是否删除 LiteTopic | 是否释放订阅配额 |\n|------|---------|-------------------|-----------------|\n| `unsubscribe_session()` | 消费者侧：取消订阅关系 | ❌ **不会** | ✅ **会** |\n| TTL 过期自动删除 | 服务端侧：删除 LiteTopic 资源 | ✅ **会** | ✅ **会**（删除后） |\n\n**两者配合使用**：\n- `unsubscribe` 主动释放订阅配额（会话结束时立即执行）\n- TTL 自动清理数据存储（无消息后自动执行）\n\n---\n\n## 9. 线程模型与并发说明\n\n### 9.1 核心结论\n\n**单 Consumer 实例支持并发处理多个 LiteTopic 的消息**：\n\n| 问题 | 答案 |\n|------|------|\n| 一个线程会处理多个队列吗？ | **不会**，一个线程固定绑定一个队列 |\n| 多个线程会调用同一个回调函数吗？ | **会**，回调函数会被多个线程并发调用 |\n| 回调函数需要线程安全吗？ | **需要**，因为可能被多个线程同时执行 |\n| 同一队列的消息会并发执行吗？ | **不会**，同一队列串行执行 |\n| 不同 Session 的消息会互相阻塞吗？ | **不会**，不同队列并行处理 |\n\n### 9.2 线程安全注意事项\n\n由于回调函数会被多个线程并发调用，需要注意：\n\n**✅ 线程安全的写法**\n\n```python\n# 好的做法：使用局部变量\ndef message_callback(session_id: str, message: dict):\n    # 局部变量，线程安全\n    chat_id = message.get(\"chatId\")\n    content = message.get(\"content\")\n    return process(chat_id, content)\n\n# 或者：使用线程局部存储\nimport threading\nthread_local = threading.local()\n\ndef message_callback(session_id: str, message: dict):\n    if not hasattr(thread_local, 'cache'):\n        thread_local.cache = {}  # 每个线程有自己的缓存\n    # 这样是安全的\n```\n\n**❌ 不安全的写法**\n\n```python\n# 危险：共享全局变量\nglobal_counter = 0\n\ndef message_callback(session_id: str, message: dict):\n    global global_counter\n    global_counter += 1  # 多线程同时修改，数据会错乱！\n    \n    # 危险：共享对象\n    shared_dict[session_id] = value  # 可能被其他线程同时修改\n```\n\n### 9.3 简化记忆\n\n> **一个线程 = 一个队列 = 串行处理**\n> **多个线程 = 多个队列 = 并行处理**\n> **回调函数 = 被多个线程调用 = 需要线程安全**\n\n---\n\n## 10. 资源配额与限制\n\n### 10.1 资源限制\n\n| 限制项 | 默认值 | 说明 |\n|--------|--------|------|\n| 单消费者订阅上限 | 2000 个 LiteTopic | 可提工单调整 |\n| 单 LiteTopic 吞吐 | 约 200 TPS | 单队列限制 |\n| 实例总 LiteTopic 数 | 取决于实例规格 | 高性能实例支持数百万 |\n| 总订阅关系数 | 取决于实例规格 | 所有消费者订阅数总和 |\n\n### 10.2 性能评估\n\n| 并发会话数 | 所需订阅数 | 消费者实例数 | 预估总 TPS |\n|-----------|-----------|-------------|-----------|\n| 1,000 | 1,000 | 1 | 200,000 |\n| 10,000 | 10,000 | 1（需提高配额） | 2,000,000 |\n| 100,000 | 100,000 | 多个节点分摊 | 20,000,000 |\n\n---\n\n## 11. 最佳实践总结\n\n### 11.1 配置建议\n\n| 配置项 | 建议值 | 说明 |\n|--------|--------|------|\n| `expiration`（TTL） | 1-24 小时 | 根据业务会话时长设置 |\n| `consumer_count` | 1 个 | 单消费者即可，通过动态订阅管理 |\n| `消费线程池大小` | SDK 自动管理 | 无需手动配置 |\n| `幂等存储` | Redis + chatId | 防止重复消费 |\n\n### 11.2 开发规范\n\n1. **生产者**：使用单例，`sessionId` 作为 LiteTopic 名称\n2. **消费者**：使用单例 + `LITE_SELECTIVE` 模式\n3. **会话建立**：调用 `subscribe_session()` 动态订阅\n4. **会话结束**：**必须**调用 `unsubscribe_session()` 释放配额\n5. **幂等处理**：使用 `chatId` 做幂等，防止重复消费\n6. **线程安全**：回调函数需考虑多线程并发调用场景\n\n### 11.3 架构简化价值\n\n采用 LiteTopic + 单 Consumer 动态订阅方案后：\n\n| 传统方案问题 | LiteTopic 解决方案 |\n|-------------|-------------------|\n| 需维护 Session→Node 路由表 | **无需路由表**，消息精准投递 |\n| 广播消费浪费资源 | **按需订阅**，精准消费 |\n| 节点故障消息丢失 | **断点续传**，从 Offset 恢复 |\n| 状态同步复杂 | **无状态扩容**，新节点动态订阅 |\n| 顺序消息需分区键 | **天然有序**（1 LiteTopic = 1 队列） |\n\n---\n\n## 12. 关键要点速记\n\n| 问题 | 答案 |\n|------|------|\n| LiteTopic 如何创建？ | **自动创建**：首次发送或订阅时自动创建 |\n| LiteTopic 如何删除？ | **自动删除**：超过 TTL 无消息写入后自动删除 |\n| 需要为每个 Session 创建独立 Consumer 吗？ | **不需要**：单 Consumer，动态订阅数千个 LiteTopic |\n| 如何实现动态订阅？ | 使用 `LITE_SELECTIVE` 模式，运行时调用 `subscribe_lite_topic()` |\n| 会话结束时必须退订吗？ | **必须**：释放订阅配额，防止新会话无法订阅 |\n| 退订会删除 LiteTopic 吗？ | **不会**：只取消订阅关系，LiteTopic 由 TTL 自动删除 |\n| 节点宕机后如何恢复？ | 新节点动态订阅原 LiteTopic，从 Offset 继续消费 |\n| 回调函数需要注意什么？ | **线程安全**：会被多个线程并发调用 |\n| 单 Consumer 支持并发吗？ | **支持**：队列间并行处理，互不影响 |\n\n---\n\n## 13. 总结\n\n| 场景 | 推荐方案 |\n|------|----------|\n| 会话量 < 10万，团队熟悉 RocketMQ 4.x | 传统分区顺序方案（备选） |\n| 会话量百万级，需要物理隔离和断点续传 | **LiteTopic + 单 Consumer 动态订阅** |\n| 云原生环境，需要极致弹性 | LiteTopic + 单 Consumer 动态订阅 |\n\n**最终建议**：对于对话消息场景，优先采用 **LiteTopic + 单 Consumer 动态订阅方案**，为每个会话创建独立的轻量主题，实现物理隔离、天然顺序和断点续传，同时具备极低的动态创建开销和百万级规模支撑能力。\n\n---\n\n*文档版本：2.0 | 更新日期：2026-01-23*"}, {"id": 13, "room": "wenyuan", "date": "2026-06-08", "title": "主流异步任务框架选型对比分析", "tags": [], "from": "主流异步任务框架选型对比分析", "summary": "主流异步任务框架选型对比分析  内容 |  :--- |  3.0 |  2026 年 6 月 8 日 |  Temporal 依赖信息已更正；Prefect 数据库支持已补充 |  架构师、技术负责人、后端开发工程师 | --- 1. 摘要…", "content": "# 主流异步任务框架选型对比分析\n\n| 字段 | 内容 |\n| :--- | :--- |\n| **文档版本** | 3.0 |\n| **更新日期** | 2026 年 6 月 8 日 |\n| **主要修正** | Temporal 依赖信息已更正；Prefect 数据库支持已补充 |\n| **目标受众** | 架构师、技术负责人、后端开发工程师 |\n\n---\n\n## 1. 摘要\n\n本文档对比分析四个分布式异步任务处理框架：**Celery**（经典任务队列）、**Prefect**（数据工作流编排）、**Temporal**（持久化工作流引擎）、**DBOS**（嵌入式持久执行库）。\n\n各框架核心定位：\n\n| 框架 | 核心定位 | 一句话总结 |\n| :--- | :--- | :--- |\n| **Celery** | 经典任务队列 | 老兵不死，适合简单异步任务 |\n| **Prefect** | 数据工作流编排 | Python 原生，数据工程师的最爱 |\n| **Temporal** | 持久化工作流引擎 | 企业级可靠性，支持多语言 |\n| **DBOS** | 嵌入式持久执行 | 轻量级方案，依赖仅 Postgres |\n\n---\n\n## 2. 框架详细分析\n\n### 2.1 Celery\n\n- **优点**：成熟稳定、生态丰富、部署简单、学习曲线平缓\n- **缺点**：可靠性较弱（需业务幂等）、复杂流程表达力差、可观测性弱\n- **适用场景**：邮件发送、图片处理等简单独立后台任务\n\n### 2.2 Prefect\n\n> **数据库支持说明**：Prefect Server 后端仅支持 **SQLite**（开发）和 **PostgreSQL**（生产推荐），**不支持 MySQL**。但任务层可以正常读写 MySQL 业务数据。\n\n- **优点**：Python 原生语法定义流程、丰富重试策略、强大 UI 监控\n- **缺点**：运维组件较多、任务延迟较高（秒级）、资源开销大、生产必须 PostgreSQL\n- **适用场景**：数据 ETL 管道、复杂依赖的数据工程任务\n\n### 2.3 Temporal\n\n> **重要更正**：Temporal **不强制依赖 Cassandra 或 Elasticsearch**。从 v1.20 版本开始，**单 MySQL 或 PostgreSQL 即可完整支持生产级集群**。\n\n- **核心架构**：客户端-服务器模式，需部署独立的 Temporal Cluster\n- **状态持久化**：事件溯源，每个工作流实例的完整历史被持久化\n- **外部依赖**（生产环境）：\n  - **必选**：MySQL **或** PostgreSQL（一个数据库解决主存储 + Visibility）\n  - **可选**：Elasticsearch（仅当 SQL 无法满足大规模搜索性能需求时）\n  - **注意**：Cassandra 只是历史可选方案之一，**非必须**\n- **优点**：\n  - 极致的可靠性（持久化执行）\n  - 支持多语言 SDK（Go、Java、TypeScript、Python 等）\n  - 强大的信号（Signal）、查询（Query）、子工作流等高级语义\n  - 可水平扩展\n- **缺点**：\n  - 需要独立维护 Temporal Server 集群\n  - 学习曲线较陡（需理解确定性约束）\n  - 工作流代码与 Activity 需分离，有一定开发开销\n- **适用场景**：金融交易、订单履约、保险理赔等关键长流程，及生产级 AI Agent\n\n### 2.4 DBOS Transact\n\n- **核心架构**：嵌入式库，直接作为 Python 依赖引入，无需独立服务\n- **状态持久化**：基于 PostgreSQL 的 Checkpoint，每个 step 完成后自动保存状态\n- **外部依赖**：**仅 PostgreSQL**（无其他组件）\n- **优点**：\n  - 极低运维负担（无独立集群）\n  - 低延迟（1-2ms，比 Temporal 快一个数量级）\n  - 对现有应用侵入小（装饰器即可）\n  - SQL 原生可观测性\n- **缺点**：\n  - 强依赖 PostgreSQL\n  - 生态较新，社区规模较小\n  - 目前仅支持 Python\n  - 功能相比 Temporal 较精简\n- **适用场景**：已有 PostgreSQL 的 Python 应用、延迟敏感的持久化需求、轻量级 AI Agent\n\n---\n\n## 3. 四框架完整对比表\n\n| 特性维度 | Celery | Prefect | Temporal | DBOS |\n| :--- | :--- | :--- | :--- | :--- |\n| **核心模型** | 分布式任务队列 | 工作流即代码 (DAG) | 持久化工作流引擎 | 嵌入式持久执行库 |\n| **架构模式** | Broker + Worker | 客户端-服务器 | 客户端-服务器 | 嵌入式库 |\n| **状态持久化** | 无状态 | 服务端管理 | 事件溯源 | Postgres Checkpoint |\n| **生产环境依赖** | Redis/RabbitMQ + Backend | PostgreSQL（不支持 MySQL） | MySQL 或 PostgreSQL | 仅 PostgreSQL |\n| **是否需要独立服务集群** | 否（仅需 Broker） | 是 | 是 | 否 |\n| **运维复杂度** | 低 | 中 | 中 | 极低 |\n| **任务延迟** | 毫秒级 | 秒级 | 数十毫秒 | 1-2ms |\n| **多语言支持** | 多语言 | Python | 多语言 | Python |\n| **学习曲线** | 低 | 低 | 中 | 低 |\n| **可靠性** | 基础（需幂等） | 中等 | 极高 | 高 |\n| **可观测性** | 弱 | 强（UI） | 强（UI） | 中等（SQL） |\n| **社区成熟度** | 非常成熟 | 成熟 | 成熟 | 新兴 |\n\n---\n\n## 4. 框架依赖速查表\n\n| 框架 | 后端/数据库依赖 | 可选组件 |\n| :--- | :--- | :--- |\n| **Celery** | Broker（Redis/RabbitMQ）+ Result Backend | Flower（监控） |\n| **Prefect** | PostgreSQL（生产）+ Prefect Server | Prefect Cloud |\n| **Temporal** | MySQL 或 PostgreSQL + Temporal Cluster | Elasticsearch |\n| **DBOS** | PostgreSQL | 无 |\n\n---\n\n## 5. 选型决策指南\n\n### 5.1 决策流程图\n\n```text\n开始\n  │\n  ▼\n需要崩溃后可恢复的持久化执行？\n  │\n  ├── 否 ──▶ 任务简单、量大、可幂等？\n  │             ├── 是 ──▶ Celery\n  │             └── 否 ──▶ Prefect（数据管道 / 复杂 DAG）\n  │\n  └── 是 ──▶ 技术栈和运维偏好？\n                │\n                ├── Python 为主 + 已有 PostgreSQL，不想引入独立集群\n                │   └──▶ DBOS\n                │\n                ├── 多语言 / 需要极致企业级可靠性，可接受部署独立 Server 集群\n                │   └──▶ Temporal\n                │\n                └── 数据工程场景 / 需要强大 UI + 复杂 DAG + 丰富重试策略\n                    └──▶ Prefect\n```\n\n### 5.2 场景对照表\n\n| 典型场景 | 推荐框架 | 核心理由 |\n| :--- | :--- | :--- |\n| 发邮件、图片处理等简单异步任务 | **Celery** | 成熟稳定，运维简单，延迟低 |\n| 复杂依赖的数据 ETL 管道 | **Prefect** | Python 原生，UI 强大，重试策略丰富 |\n| 金融交易、订单履约等关键长流程 | **Temporal** | 持久化执行，多语言支持，企业级可靠性 |\n| 已有 PostgreSQL，希望轻量级持久化 | **DBOS** | 零额外组件，低延迟，易上手 |\n| 生产级 AI Agent（轻量） | **DBOS** | 直接包装 Agent，状态可恢复 |\n| 生产级 AI Agent（大规模） | **Temporal** | 多 Agent 协调，企业级特性 |\n\n---\n\n## 6. 深入对比：Temporal vs DBOS\n\n由于两者都提供持久化执行能力且依赖数据库，最容易混淆，特此展开：\n\n| 对比维度 | Temporal | DBOS |\n| :--- | :--- | :--- |\n| **部署模式** | 独立集群（需要运维 Temporal Server） | 嵌入式（作为库引入应用） |\n| **依赖组件** | MySQL 或 PostgreSQL | 仅 PostgreSQL |\n| **是否需要独立服务进程** | 是（server 进程） | 否（随应用启动） |\n| **水平扩展** | 原生支持，Worker 无状态 | 需应用层自行处理 |\n| **工作流可见性** | Web UI / CLI | SQL 查询 |\n| **多语言** | Go / Java / TS / Python 等 | 仅 Python |\n| **典型规模** | 大规模生产 | 中小规模 |\n| **学习成本** | 较高（确定性约束、Activity 概念） | 较低（纯装饰器） |\n\n**结论**：Temporal 适合需要大规模、多语言、企业级特性的场景；DBOS 适合 Python 技术栈、希望最小运维负担的场景。\n\n---\n\n## 7. 数据库支持速查表\n\n| 框架 | SQLite | PostgreSQL | MySQL | 说明 |\n| :--- | :---: | :---: | :---: | :--- |\n| **Prefect Server** | ✅（开发） | ✅（生产） | ❌ | 服务端状态存储 |\n| **Prefect Task** | N/A | N/A | ✅ | 业务数据读写 |\n| **Temporal** | ❌ | ✅ | ✅ | 主存储 + Visibility |\n| **DBOS** | ❌ | ✅（必须） | ❌ | 强依赖 |\n| **Celery** | N/A | N/A | N/A | 使用 Broker，非关系型 |\n\n---\n\n## 8. 总结与建议\n\n| 场景 | 推荐 | 理由 |\n| :--- | :--- | :--- |\n| 简单异步任务 | **Celery** | 久经考验，方案成熟 |\n| 数据工程管道 | **Prefect** | 开发体验最佳 |\n| 关键业务长流程 | **Temporal** | 可靠性最高，支持多语言 |\n| 轻量级持久化 | **DBOS** | 运维极简，延迟最低 |\n\n### 最终建议\n\n- **没有最好的框架，只有最合适的框架**。根据团队的运维能力、技术栈、可靠性要求综合评估。\n- 对于**新项目**，如果团队熟悉 Python 且已有 PostgreSQL，**DBOS** 值得尝试。\n- 对于**跨语言微服务架构**或**对可靠性有极致要求**的系统，**Temporal** 是经过验证的选择。\n- **Celery** 依然有效，但需要业务代码保证幂等性，适用于对可靠性要求不高的场景。\n- **Prefect** 适合数据工程团队，但需注意其生产环境**必须使用 PostgreSQL**，不支持 MySQL。"}, {"id": 14, "room": "wenyuan", "date": "2026-03-20", "title": "工作流引擎Temporal学习笔记", "tags": [], "from": "工作流引擎Temporal学习笔记", "summary": "- 来源: https://code2life.top/blog/0070-temporal-notes - 抓取时间: 2026-03-20 目录 - 目录 - Temporal简介 - 5分钟上手Temporal - 实践与思考 Temporal简介…", "content": "- 来源: https://code2life.top/blog/0070-temporal-notes\n- 抓取时间: 2026-03-20\n\n## 目录\n\n- [目录](#目录)\n- [Temporal简介](#temporal简介)\n- [5分钟上手Temporal](#5分钟上手temporal)\n- [实践与思考](#实践与思考)\n\n## Temporal简介\n\nTemporal是一个新兴的分布式工作流引擎。如果你在工作中遇到过以下这些场景，都可以来了解一下Temporal这个底层引擎：\n\n1. 跨服务、跨时间周期的复杂业务流程\n2. 业务工作流建模（BPM）\n3. DevOps工作流\n4. Saga分布式事务\n5. BigData数据处理和分析Pipeline\n6. Serverless函数编排\n\n这些场景看上去互相没有太大关联，但有一个共同点：需要**编排**（Orchestration）。\n\nTemporal解决的关键痛点，就是**分布式系统中的编排问题**。\n\n### 编排的本质是什么\n\n要理解编排，可以借助和 Orchestration 对应的另一个概念：Choreography。\n\n举个例子，我们开发微服务时，经常借助消息队列（MQ）做事件驱动的业务逻辑，实现最终一致的、跨多个服务的数据流，这属于 Choreography。而一旦引入 MQ，可能会遇到下面一系列问题：\n\n- 消息时序问题\n- 重试幂等问题\n- 事件和消息链路追踪问题\n- 业务逻辑过于分散的问题\n- 数据已经不一致的校正对账问题\n\n在复杂微服务系统中，MQ 是一个很有用的组件，但 MQ 不是银弹。如果过度依赖类似 MQ 的方案事件驱动，但又没有足够强大的消息治理方案，整个分布式系统将嘈杂不堪，难以维护。\n\n如果转换思路，找一个“调度主体”，让所有消息的流转，都由这个“指挥家”来控制，这就是 Orchestration。\n\n- **Choreography**：无界上下文，去中心化，每个组件只关注和发布自己的事件，完全异步，注重的是解耦。\n- **Orchestration**：有界上下文，存在全局编排者，从全局建模成状态机，注重的是内聚。\n\n**Temporal 的所有应用场景，都是有全局上下文、高内聚的“编排”场景**。比如 BPM 有明确的流程图，DevOps 和 BigData Pipeline 有明确的 DAG，长活事务有明确的执行和补偿流程。\n\nTemporal 让我们像写正常代码一样写工作流代码，但并不一定在本机执行，哪一行在什么时间 yield，由服务端信令统一控制。很多分布式系统韧性问题也被封装掉了，比如分布式锁、宕机重试、过期重试导致的数据错误、并发消息处理时间差问题等。\n\n### Temporal关键概念\n\n1. **Workflow**\n   - Workflow 是编排层关键概念。\n   - 每种类型是注册到服务端的 WorkflowType。\n   - 每个 WorkflowType 可创建任意多运行实例（WorkflowExecution）。\n   - 每个 Execution 有唯一 WorkflowID；如果是 Cron / Continue-as-New，每次执行还会有唯一 RunID。\n   - Workflow 可以有环，也可以嵌套子工作流（ChildWorkflow）。\n\n2. **Activity**\n   - Workflow 编排的对象主要是 Activity。\n   - 编排 Activity 就像正常写代码一样，可用 if / for / while(true) 等逻辑结构调用 Activity 方法。\n   - 要求具备确定性。\n\n3. **Signal**\n   - 对运行中的 WorkflowExecution 可发送带参数信号。\n   - Workflow 中可等待或按条件处理信号，动态控制工作流执行逻辑。\n\n## 5分钟上手Temporal\n\n### 搭环境\n\n#### 方法1：本地运行 Temporalite\n\n本地调试一般没有性能和稳定性要求，建议下载 all-in-one Binary：Temporalite。\n\n```bash\ntemporalite start --namespace default\n```\n\n下载 Binary 放到 PATH 后，一行命令启动即可连接 localhost:7233，也可以打开 Dashboard 查看运行状态：\n\n- http://127.0.0.1:8233\n\n#### 方法2：开发或产线环境 Helm 部署分布式 Temporal\n\nDev/Prod 环境建议用 Helm + Kubernetes 部署，存储层准备独立运维的 MySQL 或 PostgreSQL。\n\n提前创建数据库 `temporal` 与 `temporal_visibility`，Helm install 完成后通过 admintools 初始化数据库 Schema。\n\n```bash\nhelm dependency build  # optional\n\nhelm install -f values/values.mysql.yaml my-temporal . \\\n  --namespace temporal --create-namespace=true \\\n  --kube-context *** \\\n  --set elasticsearch.enabled=false \\\n  --set server.config.persistence.default.sql.user=*** \\\n  --set server.config.persistence.default.sql.password=\"***\" \\\n  --set server.config.persistence.visibility.sql.user=*** \\\n  --set server.config.persistence.visibility.sql.password=\"***\" \\\n  --set server.config.persistence.default.sql.host=*** \\\n  --set server.config.persistence.visibility.sql.host=***\n```\n\n如果连接 AWS Aurora，需要在 `values.mysql.yaml` 中补充：\n\n```yaml\nserver:\n  config:\n    persistence:\n      default:\n        sql:\n          connectAttributes:\n            tx_isolation: 'READ-COMMITTED'\n```\n\n第一次 Install 后，admintools Pod 会正常运行，其他 Pod 可能因缺少数据库表失败。进入 admintools Pod 执行 Schema 初始化：\n\n```bash\nexport SQL_PLUGIN=mysql\nexport SQL_HOST=mysql_host\nexport SQL_PORT=3306\nexport SQL_USER=mysql_user\nexport SQL_PASSWORD=mysql_password\n\ncd /etc/temporal/schema/mysql/v57/temporal\ntemporal-sql-tool --connect-attributes \"tx_isolation=READ-COMMITTED\" --ep mysql-endpoint -u *** --password \"***\" --db temporal setup-schema -o -v 0.0 -f ./schema.sql\n\ncd /etc/temporal/schema/mysql/v57/visibility\ntemporal-sql-tool --connect-attributes \"tx_isolation=READ-COMMITTED\" --ep mysql-endpoint -u *** --password \"***\" --db temporal_visibility setup-schema -o -v 0.0 -f ./schema.sql\n```\n\n之后等待其他 Pod 自动重启或手动删除，所有组件即可正常运行。Forward `temporal-web` 的 8080 端口后检查 UI。\n\n### 写代码（Java示例）\n\n先添加 SDK 依赖（Gradle）：\n\n```groovy\ndependencies {\n    implementation('io.temporal:temporal-sdk:1.17.0')\n}\n```\n\n#### 第1步：定义 Workflow 接口\n\n```java\n@WorkflowInterface\npublic interface MyWorkflow {\n    @WorkflowMethod\n    String execute(Object param);\n\n    @QueryMethod\n    List<String> getSomeStatus();\n\n    @SignalMethod\n    void manualComplete();\n}\n```\n\n#### 第2步：定义 Activity 接口\n\n```java\n@ActivityInterface\npublic interface MyActivities {\n    String doSometing(Object param);\n}\n```\n\n#### 第3步：实现 Workflow 编排逻辑\n\n```java\npublic class MyWorkflowImpl implements MyWorkflow {\n    private final MyActivities activities;\n    private boolean someSignal = false;\n\n    public MyWorkflowImpl() {\n        activities = Workflow.newActivityStub(MyActivities.class, ActivityOptions.newBuilder()\n            .setStartToCloseTimeout(Duration.ofHours(1))\n            .build());\n    }\n\n    @Override\n    public String execute(Object param) {\n        Workflow.sleep(Duration.ofSeconds(25));\n        activities.doSomething();\n        Workflow.await(() -> this.someSignal);\n\n        Promise<String> promise = Async.function(() -> {\n            log.info(\"do something async\");\n            return \"Cancelled\";\n        });\n\n        promise.get();\n        return \"Workflow Done!\";\n    }\n\n    @Override\n    public void manualComplete() {\n        this.someSignal = true;\n    }\n}\n```\n\n#### 第4步：实现 Activity\n\n```java\n@Slf4j\n@Service\npublic class MyActivitiesImpl implements MyActivities {\n    @Override\n    public String doSomething(Object param) {\n        try {\n            log.info(\"Activity: {}, {}\",\n                Activity.getExecutionContext().getInfo().getRunId(),\n                Activity.getExecutionContext().getInfo().getActivityId());\n        } catch (Exception e) {\n            throw Activity.wrap(e);\n        }\n\n        Activity.getExecutionContext().heartbeat(\"I'm still running\");\n        return \"Activity Done !\";\n    }\n}\n```\n\n#### 第5步：初始化 Client / Worker 并注册\n\n```java\n@Slf4j\n@Component\n@RequiredArgsConstructor\npublic class WorkflowManager {\n    @Resource\n    private DeployActivities myActivities;\n\n    @Getter\n    private WorkflowClient client;\n\n    @PostConstruct\n    public void initWorkflowFactory() {\n        WorkflowServiceStubs service = WorkflowServiceStubs.newConnectedServiceStubs(\n            WorkflowServiceStubsOptions.newBuilder()\n                .setTarget(\"127.0.0.1:7233\")\n                .validateAndBuildWithDefaults(),\n            Duration.ofSeconds(5));\n\n        this.client = WorkflowClient.newInstance(service);\n        WorkerFactory factory = WorkerFactory.newInstance(client);\n\n        Worker worker = factory.newWorker(\"MyTaskQueue\");\n        worker.registerWorkflowImplementationTypes(MyWorkflow.class);\n        worker.registerActivitiesImplementations(deployActivities);\n\n        factory.start();\n    }\n\n    public <T> Stub<T> startWorkflow(Class<T> workflowType, Object... params) {\n        String workflowId = UUID.randomUUID().toString();\n        WorkflowOptions workflowOptions = WorkflowOptions.newBuilder()\n            .setWorkflowId(workflowId)\n            .setTaskQueue(\"MyTaskQueue\")\n            .build();\n\n        T workflowStub = this.client.newWorkflowStub(workflowType, workflowOptions);\n        return new Stub<>(workflowId, workflowStub);\n    }\n\n    @Data\n    @AllArgsConstructor\n    public static class Stub<T> {\n        private String workflowId;\n        private T stub;\n    }\n}\n```\n\n#### 第6步：启动一次 WorkflowExecution\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class WorkflowExecutor {\n\n    @Resource\n    private WorkflowManager workflowManager;\n\n    public String startMyWorkflow(Object param) {\n        String workflowId = UUID.randomUUID().toString();\n        WorkflowOptions workflowOptions = WorkflowOptions.newBuilder()\n            .setWorkflowId(workflowId)\n            .setTaskQueue(\"MyTaskQueue\")\n            .build();\n\n        WorkflowManager.Stub<MyWorkflow> myWorkflowStub =\n            workflowManager.startWorkflow(MyWorkflow.class, param);\n        myWorkflowStub.getStub().execute(\"Hello\");\n        return workflowId;\n    }\n}\n```\n\n#### 第7步：测试与调试\n\n- 文档：<https://docs.temporal.io/java/testing-and-debugging>\n- 断点调试时需设置环境变量：`TEMPORAL_DEBUG=true`（否则可能出现 `PotentialDeadlockException`）\n\n## 实践与思考\n\n### 实践历程\n\n作者在 2022 年基于 Temporal 开发 DevOps 工作流引擎，覆盖 CI/CD/CV 与系统集成。前端使用 x6 做 DSL 和执行过程可视化，后端使用 Temporal SDK 处理编排逻辑。核心编排代码较少，更多精力可聚焦在业务开发。\n\n在工作流引擎选型中，作者比较了 Jira Workflow、Temporal、Argo、Prefect、ConcourseCI、Petri Nets 等，结论偏向 Temporal 在动态编排、性能与通用性上的优势。\n\n### 使用关键注意点\n\n- 工作流代码必须**确定性**（使用 Workflow 库提供的 async、current time 等能力），非确定行为需显式记录副作用。\n- 不要在 Activity 代码中调用 Workflow，编排逻辑应全部放在 Workflow 实现里。\n- Workflow Stub 每次调用动态创建，不要尝试用 IoC 容器托管 Workflow 实例（Activity 实现可以托管）。\n- Workflow 参数与返回值会持久化，避免自引用/递归结构对象导致序列化循环问题。\n- 写 Workflow 代码时要切换到“上帝视角”：代码执行位置与时间都可能跨 Worker、跨时间跨度。\n\n### 亮点和局限性\n\n亮点：\n\n1. 多语言 SDK 友好（Go/Java/TS/Python/PHP/C#/Ruby）。\n2. 稳定性与性能较好，适合产线规模。\n3. Web UI 查询 Workflow / Activity 方便。\n4. 应用层灵活性高、场景广。\n5. 中心化状态机 + 事件溯源模式下，韧性好、Bug 率低。\n6. 对长时间跨度业务友好，可原生实现分布式 Timer/Cron。\n\n局限：\n\n1. 偏底层，不直接提供 Workflow-as-DSL/YAML，需要自行实现 DSL 与可视化。\n2. 多语言与多框架生态仍在持续完善。\n3. Cron 当前支持到分钟级，非秒级。\n\n### 总结\n\n作者认为 Temporal 本质上可理解为：\n\n- 服务端：通过信令与队列调度实现中心化工作流引擎，通过事件溯源实现持久化长活事务与分布式可重入进程。\n- 客户端：通过代理模式把本地函数调用转换为基于 gRPC 的分布式调度与状态存取。\n\nTemporal 的三个关键特性：Resumable、Recoverable、Reactive。\n\n## 学习参考\n\n- 源码仓库：<https://github.com/temporalio/temporal>\n- 官网文档：<https://docs.temporal.io/>\n- 原理讲解：<https://www.youtube.com/watch?v=t524U9CixZ0&ab_channel=Temporal>\n- 集群组件：<https://docs.temporal.io/clusters>\n- 快速入门：<https://www.youtube.com/watch?v=2HjnQlnA5eY&ab_channel=Temporal>\n- 场景介绍：<https://www.youtube.com/watch?v=eMf1fk9RmhY&ab_channel=Temporal>\n\n支持语言示例：\n\n- TypeScript SDK：<https://docs.temporal.io/typescript/introduction/>\n- TypeScript Samples：<https://github.com/temporalio/samples-typescript/>\n- Java SDK：<https://docs.temporal.io/java/>\n- Java Samples：<https://github.com/temporalio/samples-java>\n- Golang SDK：<https://docs.temporal.io/go/>\n- Golang Samples：<https://github.com/temporalio/samples-go>"}, {"id": 15, "room": "wenyuan", "date": "2026-05-06", "title": "计划文件落地方案设计文档", "tags": [], "from": "计划文件落地方案设计文档", "summary": "一、概述 1.1 背景 当前Agent已具备Agent工作目录、Session工作目录、用户工作目录下的文件读写能力。需要在此基础上设计计划文件的落地方案，使Agent能够“先规划、后执行”，并在执行过程中严格遵循已确认的计划。 1.2 设计目标 -…", "content": "## 一、概述\n\n### 1.1 背景\n\n当前Agent已具备Agent工作目录、Session工作目录、用户工作目录下的文件读写能力。需要在此基础上设计计划文件的落地方案，使Agent能够“先规划、后执行”，并在执行过程中严格遵循已确认的计划。\n\n### 1.2 设计目标\n\n- Agent接到任务后，先生成计划供用户审阅，经确认后方可执行\n- 执行过程严格按照计划步骤顺序进行，不允许自行偏离\n- 支持会话中断后的断点恢复\n- 计划严格绑定会话生命周期，会话结束即清理\n\n---\n\n## 二、核心决策\n\n| 决策项 | 选择 | 说明 |\n|--------|------|------|\n| 计划文件格式 | Markdown + JSON | Markdown用于人可读的计划主文件，JSON用于Agent自动维护的执行状态 |\n| 审批机制 | 确认后执行 | 计划生成后状态为draft，需用户确认变更为confirmed后方可执行 |\n| 并行支持 | 不支持 | 同一会话内同时只允许一个活跃计划 |\n| 变更策略 | 严格模式 | 执行中任一步骤失败，计划立即暂停，等待用户介入 |\n| 存储位置 | 会话工作目录 | 计划跟随会话生命周期，避免跨会话残留 |\n\n---\n\n## 三、目录结构\n\n```\n{session_work_dir}/\n├── plan.md              # 计划主文件（人可读、Agent可解析）\n├── progress.json        # 执行状态文件（Agent自动维护，用于断点恢复）\n└── outputs/             # 会话执行产出文件目录\n```\n\n**设计考量：**\n- 计划文件与会话工作目录共存，会话结束时整体归档或清理，无跨会话残留\n- 单会话仅维持单计划，无需计划ID标识，扁平化结构即可满足需求\n- outputs目录用于存放计划执行过程中产出的中间文件或最终交付物\n\n---\n\n## 四、文件格式规范\n\n### 4.1 计划主文件（plan.md）\n\n以Markdown格式承载，兼顾人类可读性与Agent解析需求。\n\n**字段说明：**\n\n| 字段 | 说明 | 可选值 |\n|------|------|--------|\n| 标题 | 计划名称 | 自由文本 |\n| status | 计划生命周期状态 | draft / confirmed / executing / blocked / done |\n| created | 创建时间戳 | ISO 8601格式 |\n| 任务列表 | 编号的有序任务清单，使用Markdown checkbox标记完成状态 | - [ ] 未完成 / - [x] 已完成 |\n\n**模板示例：**\n\n```markdown\n# 计划: {任务名称}\nstatus: draft\ncreated: {创建时间}\n\n## 任务列表\n- [ ] 1. {步骤描述}\n- [ ] 2. {步骤描述}\n- [ ] 3. {步骤描述}\n```\n\n### 4.2 执行状态文件（progress.json）\n\n由Agent自动维护，用于追踪执行进度和支撑断点恢复。\n\n**字段说明：**\n\n| 字段 | 类型 | 说明 |\n|------|------|------|\n| plan_file | string | 关联的计划文件名，固定为\"plan.md\" |\n| status | string | 当前执行状态，与plan.md中的status同步 |\n| current_step | number | 当前正在执行的步骤编号 |\n| steps | array | 步骤详情列表 |\n| steps[].id | number | 步骤编号，对应plan.md中的序号 |\n| steps[].desc | string | 步骤描述摘要 |\n| steps[].status | string | 步骤状态：pending / doing / done / failed |\n| steps[].result | string/null | 步骤执行结果摘要或错误信息 |\n\n**模板示例：**\n\n```json\n{\n  \"plan_file\": \"plan.md\",\n  \"status\": \"executing\",\n  \"current_step\": 3,\n  \"steps\": [\n    {\"id\": 1, \"desc\": \"扫描下载文件夹\", \"status\": \"done\", \"result\": \"找到23个文件\"},\n    {\"id\": 2, \"desc\": \"按扩展名分类\", \"status\": \"done\", \"result\": \"4类别\"},\n    {\"id\": 3, \"desc\": \"创建子文件夹\", \"status\": \"doing\", \"result\": null},\n    {\"id\": 4, \"desc\": \"移动文件\", \"status\": \"pending\", \"result\": null},\n    {\"id\": 5, \"desc\": \"生成报告\", \"status\": \"pending\", \"result\": null}\n  ]\n}\n```\n\n---\n\n## 五、状态流转\n\n### 5.1 计划生命周期\n\n```\n                    ┌──────────────┐\n                    │    draft     │  ← Agent初始生成\n                    └──────┬───────┘\n                           │ 用户确认\n                           ▼\n                    ┌──────────────┐\n                    │  confirmed   │  ← 等待执行指令\n                    └──────┬───────┘\n                           │ 开始执行\n                           ▼\n                    ┌──────────────┐\n              ┌─────│  executing   │\n              │     └──────┬───────┘\n              │            │ 全部步骤完成\n              │            ▼\n              │     ┌──────────────┐\n              │     │     done     │  ← 终态\n              │     └──────────────┘\n              │\n              │     步骤执行失败（严格模式）\n              │            │\n              │            ▼\n              │     ┌──────────────┐\n              └────►│   blocked    │  ← 暂停，等待用户介入\n                    └──────┬───────┘\n                           │ 用户修改计划后重新确认\n                           ▼\n                    ┌──────────────┐\n                    │  confirmed   │  ← 回到确认态，可重新执行\n                    └──────────────┘\n```\n\n### 5.2 步骤状态\n\n| 状态 | 说明 | 触发条件 |\n|------|------|----------|\n| pending | 等待执行 | 初始状态或前置步骤未完成 |\n| doing | 执行中 | Agent开始处理该步骤 |\n| done | 已完成 | 步骤成功执行完毕 |\n| failed | 执行失败 | 步骤执行异常，严格模式下触发计划blocked |\n\n---\n\n## 六、核心工作流\n\n### 6.1 计划生成与确认流程\n\n```\n1. 用户提出任务需求\n2. Agent分析需求，生成plan.md（status: draft），呈现给用户\n3. 用户审阅计划\n   ├─ 同意 → 用户将status改为confirmed（或发送确认指令）\n   ├─ 修改 → 用户直接编辑plan.md，再改为confirmed\n   └─ 否决 → 废弃计划，Agent重新规划\n4. plan.md进入confirmed态，等待执行指令\n```\n\n### 6.2 计划执行流程\n\n```\n1. Agent读取confirmed状态的plan.md\n2. 将plan.md状态更新为executing\n3. 创建/重置progress.json，所有步骤置为pending\n4. 按步骤编号顺序逐个执行：\n   a. 将当前步骤status置为doing，更新current_step\n   b. 执行该步骤的实际操作\n   c. 成功 → 步骤status置为done，result记录结果摘要\n   d. 失败 → 步骤status置为failed，result记录失败原因\n       → 计划status置为blocked\n       → 通知用户，等待介入\n   e. 同步更新plan.md中对应checkbox状态（- [x]）\n5. 全部步骤完成 → 计划status置为done\n```\n\n### 6.3 阻塞恢复流程\n\n```\n1. 计划处于blocked状态\n2. 用户介入处理（修改plan.md调整步骤）\n3. 用户将status重新设为confirmed\n4. Agent读取更新后的plan.md\n5. 识别上次失败步骤，从该步骤恢复执行\n6. 后续步骤继续按顺序进行\n```\n\n---\n\n## 七、断点恢复机制\n\n### 7.1 触发时机\n\n- Agent每次启动或收到执行指令时\n- 执行步骤发生异常后重新调度时\n\n### 7.2 恢复逻辑\n\n```\n1. 检查{session_work_dir}/progress.json是否存在\n   ├─ 不存在 → 无历史计划，进入正常新建/读取流程\n   └─ 存在 → 进入步骤2\n\n2. 检查progress.json中的status字段\n   ├─ executing → 存在未完成计划，进入步骤3\n   ├─ blocked → 存在暂停计划，提示用户有阻塞计划待处理\n   ├─ done → 计划已完成，提示用户是否创建新计划\n   └─ confirmed → 异常状态，按executing处理\n\n3. 读取current_step，定位到对应步骤\n   ├─ 该步骤status为doing → 说明上次执行中断，重新执行（步骤需保证幂等）\n   ├─ 该步骤status为pending → 说明上次未开始，正常执行\n   └─ 该步骤status为done → 异常状态，从下一pending步骤开始\n\n4. 从定位步骤开始，继续顺序执行\n```\n\n### 7.3 幂等性要求\n\n由于断点恢复可能重复执行status为doing的步骤，每个步骤的实现需保证幂等性，即重复执行不会产生副作用或错误。\n\n---\n\n## 八、严格模式故障处理\n\n### 8.1 故障分类\n\n| 故障类型 | 示例 | 处理方式 |\n|----------|------|----------|\n| 可预见的业务失败 | 文件不存在、权限不足 | 步骤标记failed，计划blocked，告知用户原因 |\n| 意外异常 | 程序崩溃、网络超时 | 步骤保留doing状态，下次启动触发断点恢复 |\n\n### 8.2 blocked态处理细则\n\n1. Agent停止所有后续步骤的执行\n2. 在当前步骤result中记录明确的失败原因\n3. plan.md和progress.json双双更新为blocked状态\n4. 向用户输出：“步骤{N}执行失败：{原因}。计划已暂停，请修改后确认继续。”\n5. 等待用户操作，期间不接受其他任务指令\n\n---\n\n## 九、文件同步策略\n\nplan.md与progress.json存在状态冗余，需保证二者一致：\n\n| 事件 | plan.md更新 | progress.json更新 |\n|------|-------------|-------------------|\n| 计划生成 | 创建文件，status: draft | 不创建 |\n| 用户确认 | status改为confirmed | 不创建 |\n| 开始执行 | status改为executing | 创建，status: executing |\n| 步骤开始 | 对应checkbox标注进行中（可选） | 该步骤status: doing，更新current_step |\n| 步骤完成 | 对应checkbox改为- [x] | 该步骤status: done，填充result |\n| 步骤失败 | 无需额外更新 | 该步骤status: failed，填充result，全局status: blocked |\n| 计划完成 | status改为done | status: done |\n\n**同步原则：** progress.json是执行状态的主数据源，plan.md的更新为辅助性、人类可读性服务。恢复时以progress.json为准。\n\n---\n\n## 十、目录与文件操作权限\n\n| 操作 | 目标位置 | 说明 |\n|------|----------|------|\n| 创建计划文件 | {session_work_dir}/plan.md | 会话工作目录，Agent完全可写 |\n| 维护执行状态 | {session_work_dir}/progress.json | 会话工作目录，Agent完全可写 |\n| 产出中间文件 | {session_work_dir}/outputs/ | 会话工作目录，按需创建 |\n| 交付最终产物 | {user_work_dir}/ | 用户工作目录，由计划步骤中明确指定路径 |\n| 读取外部文件 | {user_work_dir}/ | 用户工作目录，计划步骤中指定读取路径 |\n\nAgent工作目录不作为计划文件的存储位置，仅用于跨会话共享的Agent配置或持久化数据。\n\n---\n\n## 十一、边界情况处理\n\n| 场景 | 处理方式 |\n|------|----------|\n| 用户试图开始新计划但当前有计划未完成 | 提示存在进行中的计划，需先完成或放弃 |\n| 用户直接删除plan.md | progress.json检测关联文件不存在，视为计划废弃，清理progress.json |\n| 用户直接删除progress.json | 视为重置执行进度，Agent重新从plan.md步骤1开始执行 |\n| plan.md与progress.json状态不一致 | 以progress.json为准，plan.md视为可能被手动编辑过 |\n| 用户修改confirmed计划未重新确认 | Agent检测plan.md修改时间戳变化，提示用户需重新确认 |\n| 会话工作目录被清理 | 计划彻底丢失，无恢复手段，符合会话生命周期设计预期 |\n\n---\n\n## 十二、与现有能力的关系\n\n| 现有能力 | 在方案中的角色 |\n|----------|---------------|\n| Agent工作目录读写 | 不参与计划存储，仅供跨会话持久化配置使用 |\n| Session工作目录读写 | 计划文件主存储区，plan.md + progress.json + outputs |\n| 用户工作目录读写 | 计划的输入来源和最终产出交付位置 |\n\n三者职责清晰，无耦合。"}, {"id": 16, "room": "shiyi", "date": "2026-06-10", "title": "Agent概述", "tags": [], "from": "Agent概述", "summary": "什么是 Agent Agent（智能体）不是单一模型，而是一个由 LLM 驱动的自主系统——它能感知环境、制定计划、调用工具、在循环中反思与修正，最终完成目标。 与传统的\"输入→输出\"式 LLM 调用不同，Agent 的核心差异在于 自主决策循环（Agentic…", "content": "## 什么是 Agent\n\nAgent（智能体）不是单一模型，而是一个**由 LLM 驱动的自主系统**——它能感知环境、制定计划、调用工具、在循环中反思与修正，最终完成目标。\n\n与传统的\"输入→输出\"式 LLM 调用不同，Agent 的核心差异在于 **自主决策循环**（Agentic Loop）：模型不再是一次性给出答案，而是像人一样\"思考 → 行动 → 观察 → 再思考\"，在迭代中逼近目标。\n\n## Agent 核心能力模块\n\n业界对 Agent 架构有多套成熟框架，以下是最广泛认可的四大核心能力（参考 Lilian Weng / Andrew Ng / Anthropic 等主流观点）：\n\n### 1. 推理与规划 (Reasoning & Planning)\n\nAgent 的\"大脑\"。面对复杂任务时，不是一步到位给答案，而是先拆解子任务、再按路径执行。\n\n关键技术：\n- **Chain-of-Thought (CoT)**：让模型在给出结论前先进行分步推理\n- **ReAct**：推理 (Reasoning) 与行动 (Action) 交替进行\n- **Plan-and-Execute**：先规划再执行，适合长链条任务\n- **Tree-of-Thought / Graph-of-Thought**：多路径探索 + 回溯，比线性 CoT 更鲁棒\n\n### 2. 记忆系统 (Memory)\n\nAgent 用来\"记住\"上下文的机制，分三层：\n\n| 类型 | 作用 | 典型实现 |\n|------|------|----------|\n| **短期记忆** | 当前对话上下文 | 上下文窗口、滑动窗口压缩 |\n| **长期记忆** | 跨会话知识沉淀 | 向量数据库 (Pinecone/Milvus)、知识图谱 |\n| **工作记忆** | 任务执行中间状态 | 草稿本 (scratchpad)、文件系统、状态机 |\n\n记忆不是存得越多越好——检索精度、时效性、隐私性三者需要权衡。\n\n### 3. 工具使用 (Tool Use / Function Calling)\n\n让 LLM 突破纯文本的边界，与外部世界交互。\n\n- **Function Calling**：模型输出结构化 JSON 触发外部 API\n- **代码执行**：Python/Shell 沙箱中运行代码\n- **RAG（检索增强生成）**：从外部知识库检索后注入上下文\n- **Browser / MCP / ACP**：通过标准化协议调用外部工具\n\n工具调用的核心挑战不是\"能调\"，而是**什么时候调、调哪个、调完怎么用**——这本质上是规划与推理的延伸。\n\n### 4. 多 Agent 协同 (Multi-Agent Collaboration)\n\n当单个 Agent 难以覆盖全部场景时，多个 Agent 分工协作。\n\n- **垂直分工**：不同 Agent 负责不同领域（编码 Agent、测试 Agent、文档 Agent）\n- **水平协作**：多个同构 Agent 并行处理子任务后汇总\n- **拓扑模式**：顺序链、层级树、动态路由、辩论式\n- **协调机制**：消息传递 vs 共享黑板 vs 中心编排器\n\n> 参考 Anthropic 的观点：从简单工作流开始，只在确有必要时才引入多 Agent 架构——多 Agent 增加复杂度和延迟，不应是默认选项。\n\n---\n\n## 本知识库索引\n\n以下为当前笔记目录中已覆盖的内容导航：\n\n### Agent 框架与工程化\n- [[Agent概述]]（本文）\n- [[上下文管理]] — Claude Code 上下文压缩机制\n- [[Agent安全沙箱]] — Agent 安全沙箱整体方案\n- [[世界模型-空间智能-学习路线]]\n- [[OpenClaw概述]]\n\n### 多 Agent 协同\n- [[多智能体拓扑结构与动态自适应]]\n- [[P-t-E架构综述_Architecting Resilient LLM Agents]]\n- [[Agent Memory综述_Memory in the Age of AI Agents]]\n\n### 协议簇\n- [[Agent Client Protocol 详解]]（ACP）\n- [[Model Context Protocol 详解]]（MCP）\n- [[Language Server Protocol 详解]]（LSP）\n- [[JSON-RPC 协议详解]]\n- [[Streamable HTTP 详解]]\n- [[Server-Sent Events 详解]]\n- [[PyCharm 远程开发方式详解]]\n\n### 工程化实现\n- [[Harness]] — Agent 评测框架\n- [[LLM API 缓存机制对比分析技术文档]]\n- [[LLM 约束解码系统的架构设计]]\n- [[动态技能加载系统技术方案]]\n- [[计划文件落地方案设计文档]]\n- [[Python → Rust 性能提升总结]]\n\n### 异步任务与会话管理\n- [[主流异步任务框架选型对比分析]]\n- [[Redis Streams 会话消息方案技术文档]]\n- [[RocketMQ实现服务级会话并发]]\n- [[工作流引擎Temporal学习笔记]]\n\n### 安全沙箱技术\n- [[nsjail + ossfs 技术方案总结]]\n- [[nsjail 技术详解：Linux Namespace 与进程隔离原理]]\n- [[nsjail 监听模式完整技术文档]]\n- [[seccomp-bpf 技术详解：系统调用过滤原理与实践]]\n- [[Landlock 技术详解：非特权文件系统沙箱]]\n- [[网络隔离三层架构：netns + nftables + HTTP 代理]]\n- [[内网沙箱网络隔离技术文档]]\n\n---\n\n## 参考阅读\n\n- Lilian Weng, *LLM Powered Autonomous Agents* (2023.6) — Agent 系统架构的经典综述\n- Andrew Ng, *Agentic Design Patterns* (2024.3) — 四种 Agent 设计模式\n- Anthropic, *Building Effective Agents* (2024.12) — 务实派 Agent 构建指南"}, {"id": 17, "room": "shiyi", "date": "2026-03-10", "title": "OpenClaw概述", "tags": [], "from": "OpenClaw概述", "summary": "一、功能特性 > OpenClaw能做什么 OpenClaw是一款开源子托管的AI代理网关。本质是运行在用户自由设备上的自主式智能助手，主打“本地优先，隐私可控”的设计理念。通过自然语言指令实现PC全功能自动化，真正做到替用户做事。…", "content": "# 一、功能特性\n> OpenClaw能做什么\n\nOpenClaw是一款开源子托管的AI代理网关。本质是运行在用户自由设备上的自主式智能助手，主打“本地优先，隐私可控”的设计理念。通过自然语言指令实现PC全功能自动化，真正做到替用户做事。\n\n与云端聊天机器人不同，OpenClaw持续运行在用户自有硬件（比如Mac Mini以及各种PC设备上），执行shell命令、管理文件、并协调多步骤工作流程，无需人工审核。\n\n用户可以在PC或者手机的通信软件上通过文字或者语音发布任务，它就可以在PC或另一台设备上（*Why not 服务器？*）完成工作并把结果发送到用户的通讯软件上。\n\n\n## 特性1: 基础办公自动化\n1. 文档处理： 支持生成各类文档，编辑文本内容，格式转换；\n2. 文件与日程管理：自动分类本地或服务器文件，设置日程提醒，同步日程至关联通讯工具，避免遗漏重要事项\n3. 数据简单处理： 支持基础数据统计，数据筛选与整理，无需掌握专业数据分析工具，自然语言指令即可实现需求。\n\n## 特性2: 跨工具协同操作\nOpenClaw可关联各类常用工具软件，实现跨平台任务协同，无需切换多个应用，提升操作效率。\n1. 通讯工具集成： 支持关联钉钉、企业微信等通讯软件，可通过指令实现“发送文档给指定联系人”“在群聊中发送通知”“同步消息至本地文档”等操作。\n2. 办公软件集成：关联WPS、Office等办公套件，可直接通过指令打开文件、编辑内容、保存至指定路径，无需手动启动软件\n3. 其他工具适配：支持关联代码仓库、浏览器等，开发者可通过指令拉取代码、生成简单代码片段，普通用户可指令浏览器打开指定网页、保存网页内容等。\n\n## 特性3: 轻量定制化需求\n针对特定场景需求，OpenClaw支持简单定制，无需编程基础，通过可视化配置即可实现：\n1. 私有知识库接入：可导入个人或团队专属知识库，输入相关问题即可快速检索答案，适配企业培训、个人学习等场景\n2. 简单API接入：支持接入公开API或者企业内部简单接口，实现特定数据查询，适配企业轻量办公需求。\n3. 自动化规则设置：可自定义简单自动化规则（如“每日固定时间汇总群聊消息并生成报告”“收到指定类型的文件后自动分类保存”），设置后自动执行，无需手动触发。\n\n## 特性4: 开发辅助（适配新手开发）\n1. 代码生成与解释：支持生成多种编程语言基础代码片段、解释代码含义、排查基础语法错误\n2. 日志分析：可导入服务器日志或程序运行日志，自动筛选异常信息、分析错误原因，无需手动逐行查看日志内容。\n\n\n# 二、技术方案\n## 1. 通道适配器\n通道适配器接收用户消息并进行预处理，包括消息标准化、提取附件等。不同的即时通讯工具和输入流，都配有专属的适配器。\n\n## 2. 网关服务器\n作为任务与会话的协调中枢，网关服务器接受用户消息并将其分发至对应会话，是Clawd的核心模块，可处理多个并行的请求。为实现操作序列化，Clawd采用了基于任务通道的命令队列：每个会话对应专属的任务通道，低风险、可并行的任务（如定时任务）则可在多个通道中并行执行。\n\n## 3. 智能体运行器\n这是真正承载AI能力的模块。该模块会确定待调用的模型、匹配对应的API密钥。若主模型调用失败，会自动切换至备用模型。若主模型调用失败，会自动切花至备用模型。智能体运行器会结合可用工具、技能、记忆内容动态生成系统提示词，再加入会话历史。随后将完整提示词传入上下文窗口防护机制，校验是否有足够的上下文空间。若上下文空间即将耗尽，系统会选择压缩会话内容或优雅降级终止执行。\n\n## 4. 大语言模型API调用\n大模型调用环节会以流式方式返回结果，同时对不同服务商的API做了一层抽象封装；若所调用的模型支持深度思考功能，该模块还会触发模型的扩展思考逻辑\n\n## 5. 智能体循环\n若大模型返回工具调用指令，Clawd会在本地执行该指令，并将执行结果补充至对话中。这一过程会反复执行，直至大模型返回最终文本内容，或达到最大循环次数（默认约20次）。\n\n## 6. 反馈通路\n这一环节的逻辑较为常规：执行结果会通过原消息通道反馈给用户，同时会话数据会以基础的jsonl格式持久化存储，文件中每行都是一个json对象，记录了用户消息、工具调用指令、执行结果、模型反馈等内容，这也是Clawd的记忆实现方式-基于会话的记忆机制。\n\n\n# 三、核心模块\n## 1. 记忆机制\nClawd通过两套系统实现记忆功能：\n1. 以jsonl格式存储的会话记录\n2. 存储为MarkDown格式的记忆文件\n\n在检索环节，Clawd采用了*向量检索*与*关键词匹配*的混合检索方式，兼具两种方式的优势。\n\n其中，向量检索基于SQLite实现，关键词检索则借助SQLite的扩展模块FTS5完成，嵌入向量生成服务商支持自定义配置。该系统还搭载了智能同步功能，当文件监视器检测到文件变化时，会自动触发同步。这些Markdown记忆文件由智能体通过常规的“写入”文件工具生成，无专属的记忆写入API，智能体只需向记忆文件内写入内容即可。\n\n当新的对话开始，系统会提取上一轮的对话内容，并将其总结为Markdown格式的文件。\n\n## 2. pc操作实现\n可接管本地电脑并实现各类操作。其实现逻辑与大家的直观认知基本一致。\n\nClawd会向智能体开放较高权限的电脑操作能力，相关风险由用户自行承担。它通过执行工具（exec tool）在设备上运行Shell命令，支持三种运行环境：\n- 沙箱环境（默认）：命令在Docker容器中运行\n- 本地宿主机\n- 远程设备\n\n\n## 3. 安全机制\n通过命令黑白名单，用户可对各类命令进行权限审批，支持三种操作：单次允许、始终允许、拒绝。并会向用户弹出审批提示。\n\n## 4. 浏览器工具\nClawd的浏览器工具并非主要依赖截图，而是采用语义快照 -- 一种基于页面无障碍树（ARIA）的文本化表示形式。\n\n## 5. 动态系统提示词\n与大多数框架不同，Clawd的系统提示词并非固定不变，而是结合技能、记忆检索结果、用户身份、时区等信息动态构建。其基础的系统提示词如下：\n```text\n## 工具集\n可用工具（按策略筛选）：工具名称区分大小写，需严格按列出的名称调用。\n- read：读取文件内容 \n- exec：运行 Shell 命令 \n- browser：控制网页浏览器\n[...仅显示该智能体可访问的工具]\n\n## 工具调用风格\n默认规则：常规、低风险的工具调用无需说明（直接调用即可）；\n仅在以下场景需补充说明：多步骤操作、复杂问题、敏感操作。\n\n## Moltbot 命令行快速参考\n[网关命令参考内容]\n\n## 工作目录\n你的工作目录为：/path/to/workspace\n将该目录视为唯一的全局工作空间...\n\n##运行时信息\n运行环境：智能体=主智能体 | 主机=MacBook | 操作系统=Darwin（arm64架构） | 模型=claude-sonnet-420250514 | 通道=电报 | 思考模式=关闭\n推理过程：关闭（仅在开启/流式模式下显示）\n```\n\n## 6. 子智能体/智能体生成？？\n智能体可以生成子智能体（但子智能体无法再生成下一级智能体）。子智能体拥有独立会话，父智能体通过session_send实现通信，子智能体的执行结果会反馈给父智能体，父智能体可通过轮询子智能体会话查看执行进度。\n\n## 7. 上下文压缩\n当接近上下文长度限制时，智能体会将关键信息保存至记忆中。会话历史会被拆分为多个片段，由大语言模型对片段进行总结，最终合并为连贯的摘要，替换原始消息内容。\n\n\n\n# 阿里云openClaw配置\n```txt\n企业微信webhook：\nhttps://1267735130996931.appflow.aliyunnest.com/webhook/a479a8f1288e72770bce9008ccd93ae074ff67bb01dea246439ec539427697e294950bca4b1f8363f4\ntoken: \n2dPE1TU8t9oWUdPC0vlHC93eS\n\nEncodingAESKey:\nT15nLlkmE4TDJhaPAqnqmVJ6wp0ThrO8rbGWSOfldTn\n```"}, {"id": 18, "room": "guanxing", "date": "2026-07-07", "title": "世界模型（空间智能流派）学习路线", "tags": [], "from": "世界模型-空间智能-学习路线", "summary": "世界模型（空间智能流派）学习路线 > 目标：以获取人工智能硕士学位为导向，系统掌握世界模型-空间智能流派的知识体系。 > 核心人物与机构：李飞飞 (Fei-Fei Li) / World Labs、Yann LeCun / AMI Labs ---…", "content": "# 世界模型（空间智能流派）学习路线\n\n> 目标：以获取人工智能硕士学位为导向，系统掌握世界模型-空间智能流派的知识体系。\n> 核心人物与机构：李飞飞 (Fei-Fei Li) / World Labs、Yann LeCun / AMI Labs\n\n---\n\n## 零、理解这个方向：什么是「空间智能」与「世界模型」？\n\n在开始学习之前，先建立全局认知：\n\n### 空间智能 (Spatial Intelligence)\n\n空间智能是李飞飞提出的 AI 下一个前沿。核心理念是：**语言让机器能够谈论世界，空间智能让机器能够理解、想象、推理并与物理世界互动。** 它关注的是 AI 对三维空间的理解、操作和生成能力，是连接「语言智能」与「物理世界」的桥梁。\n\n### 世界模型 (World Model)\n\n借用李飞飞 2026 年发布的 **《A Functional Taxonomy of World Models》** ，世界模型按功能分为三类：\n\n| 类型 | 输出 | 核心承诺 | 典型代表 |\n|------|------|---------|---------|\n| **渲染器 (Renderer)** | 观测（像素/图像） | 视觉保真度 | Sora, Genie 3, World Labs RTFM |\n| **模拟器 (Simulator)** | 状态（几何/物理/动态） | 结构准确性 | World Labs Marble, NVIDIA Omniverse |\n| **规划器 (Planner)** | 行动（动作序列） | 决策正确性 | VLA 模型, World Action Model |\n\n**三个模型的底层知识是共通的**——几何、物理、动态规律。真正的前沿是让一个统一模型同时具备渲染、模拟和规划能力。\n\n### 技术基础循环 (POMDP)\n\n```\n智能体 → 行动 → 世界状态 → 观测 → 智能体 → …\n```\n\n所有世界模型都是这个循环在不同维度上的投影。理解这个循环是理解整个领域的钥匙。\n\n---\n\n## 一、前置基础（0-3 个月）\n\n> 如果没有 CS/数学本科背景，需要先补齐这些。\n\n### 1.1 数学基础\n\n| 领域         | 核心内容                  | 推荐资源                                                      |\n| ---------- | --------------------- | --------------------------------------------------------- |\n| **线性代数**   | 矩阵运算、特征值分解、SVD、射影几何基础 | Gilbert Strang《Introduction to Linear Algebra》+ MIT 18.06 |\n| **概率论与统计** | 贝叶斯推断、高斯分布、马尔可夫过程、信息论 | 《概率导论》(Bertsekas)                                         |\n| **微积分**    | 多元微积分、梯度、链式法则         | 3Blue1Brown 微积分系列                                         |\n| **最优化**    | 梯度下降、Adam、凸优化基础       | Boyd《Convex Optimization》前 4 章                            |\n| **几何学基础**  | 刚体变换、旋转矩阵、四元数、李代数入门   | 《Multiple View Geometry in Computer Vision》附录             |\n\n### 1.2 编程与工具\n\n| 技能 | 要求 | 方式 |\n|------|------|------|\n| **Python** | 熟练使用 NumPy, PyTorch, JAX | 复现经典论文，PyTorch 官方教程 |\n| **Linux/命令行** | 日常工作环境 | 装一台 Linux 桌面或 WSL2 |\n| **Git** | 版本控制 | GitHub 日常使用 |\n| **CUDA 基础** | 理解 GPU 编程模型 | CUDA 官方入门 |\n| **可视化** | Matplotlib, Open3D, Polyscope | 边学边用 |\n\n### 1.3 机器学习基础\n\n| 阶段 | 内容 | 资源 |\n|------|------|------|\n| 经典 ML | 回归、分类、聚类、SVM、决策树、集成学习 | 吴恩达 Coursera ML 课程 / 李航《统计学习方法》 |\n| 深度学习基础 | MLP、CNN、RNN、Transformer、注意力机制 | 李沐《动手学深度学习》(d2l.ai) |\n| 深度学习进阶 | BatchNorm、Dropout、ResNet、ViT、损失函数设计 | d2l.ai + 相关论文 |\n\n> **里程碑 1**：能用 PyTorch 从零实现一个 ViT 并在 CIFAR-100 上训练。\n\n---\n\n## 二、计算机视觉核心（2-4 个月）\n\n> 空间智能的根基在 3D 视觉。这一步不能跳过。\n\n### 2.1 2D 视觉基础\n\n| 主题 | 关键概念 | 推荐资源 |\n|------|---------|---------|\n| 图像处理基础 | 卷积、边缘检测、滤波、特征提取 | Szeliski《Computer Vision: Algorithms and Applications》1-5 章 |\n| 目标检测 | R-CNN 系列, YOLO, DETR | 相关论文 + MMDetection 实践 |\n| 语义/实例分割 | FCN, U-Net, Mask R-CNN, SAM | MMSegmentation |\n| 自监督学习 | SimCLR, MoCo, MAE, DINO | 论文精读 |\n\n### 2.2 多视角几何（关键！）\n\n> 这是空间智能区别于普通 CV 的核心基础。\n\n| 主题 | 内容 | 资源 |\n|------|------|------|\n| 相机模型 | 针孔相机、内参/外参、畸变 | MVG 第 6 章 |\n| 对极几何 | 本质矩阵、基础矩阵、三角化 | MVG 第 9-12 章 |\n| 运动恢复结构 (SfM) | COLMAP 原理 | MVG 第 18 章 + COLMAP 论文 |\n| 多视角立体 (MVS) | 深度图估计、点云融合 | MVG 第 13 章 |\n\n- 核心教材：**Hartley & Zisserman《Multiple View Geometry in Computer Vision》**（必读）\n- 实践：用 COLMAP 对自己拍摄的场景做三维重建\n\n### 2.3 三维表示与深度学习\n\n| 表示形式 | 典型方法 | 特点 |\n|---------|---------|------|\n| 点云 (Point Cloud) | PointNet, PointNet++, Point Transformer | 稀疏、原始传感器输出 |\n| 体素 (Voxel) | VoxNet, 3D CNN | 规则网格、内存消耗大 |\n| 网格 (Mesh) | Pixel2Mesh, Mesh R-CNN | 紧致、适合渲染 |\n| 隐式表示 | DeepSDF, Occupancy Networks, **NeRF** | 连续、高分辨率 |\n| 显式基元 | **3D Gaussian Splatting (3DGS)** | 实时渲染、可编辑 |\n\n> **里程碑 2**：能复现 PointNet++ 做点云分类/分割 + 理解 NeRF 原理并跑通代码。\n\n---\n\n## 三、空间智能核心：NeRF 与 3DGS 时代（2-3 个月）\n\n> 这是当前空间智能流派最活跃、最核心的技术栈。\n\n### 3.1 NeRF 及演进（必读论文链）\n\n```\nNeRF (ECCV 2020)                          ← 原论文，开创性工作\n├── Mip-NeRF (ICCV 2021)                  ← 抗锯齿\n├── Instant-NGP (SIGGRAPH 2022)           ← 5 秒训练\n├── TensoRF (ECCV 2022)                   ← 张量分解加速\n├── Block-NeRF (CVPR 2022)                ← 城市场景\n├── NeRF in the Wild (CVPR 2021)          ← 无约束照片\n├── DreamFusion (ICLR 2023)               ← 文字→3D（SDS 蒸馏）\n└── Zip-NeRF (ICCV 2023)                  ← 最新整合方案\n```\n\n**学习方式**：每篇论文读完 → 看代码 → 跑通 demo → 写笔记总结核心贡献与局限。\n\n### 3.2 3D Gaussian Splatting 及演进\n\n```\n3DGS (SIGGRAPH 2023)                      ← 原论文，实时渲染里程碑\n├── Scaffold-GS (CVPR 2024)               ← 结构化高斯\n├── 4DGS (CVPR 2024)                      ← 动态场景\n├── SuGaR (CVPR 2024)                     ← 提取 mesh\n├── GaussianOpacity Fields (arXiv 2024)   ← 辐射场统一\n├── PixelSplat (CVPR 2024)                ← 稀疏视图重建\n├── MVSplat (ECCV 2024)                   ← 高效多视图\n└── InstantSplat (ECCV 2024)              ← 无优化 3DGS\n```\n\n### 3.3 生成式 3D / 4D 内容\n\n| 方向 | 代表工作 | 核心思路 |\n|------|---------|---------|\n| 文字→3D | DreamFusion, MVDream, Zero123 | SDS 蒸馏 + 多视图扩散 |\n| 图像→3D | LRM, Instant3D, CRM | 前馈大模型直接回归 |\n| 视频→4D | Animate3D, 4D-fy, DreamGaussian4D | 动态高斯表示 |\n| 场景生成 | Text2Room, SceneDreamer, LucidDreamer | 3D 场景级生成 |\n\n> **里程碑 3**：能完整讲解 NeRF 到 3DGS 的技术演进路线，并复现至少一个 3DGS 论文。\n\n---\n\n## 四、世界模型（2-3 个月）\n\n> 实现从「3D 感知」到「世界理解与交互」的跃迁。\n\n### 4.1 强化学习中的世界模型\n\n```\nWorld Models (NeurIPS 2018)               ← Ha & Schmidhuber，经典开篇\n├── DreamerV1 (ICLR 2020)                 ← 潜空间想象规划\n├── DreamerV2 (ICLR 2021)                 ← 离散潜变量\n├── DreamerV3 (Nature 2025)               ← 150+ 任务通用智能体\n└── DayDreamer (CoRL 2023)                ← 真实机器人部署\n```\n\n### 4.2 视频预测世界模型\n\n| 方法 | 特点 |\n|------|------|\n| SimVP (CVPR 2022) | 简洁高效的视频预测基线 |\n| TECO (ICLR 2023) | 时序一致性掩码建模 |\n| A-L JEPA (AAAI 2026) | 联合嵌入预测架构，自动驾驶点云 |\n| Genie 3 (Google, 2025) | 交互式世界渲染 |\n\n### 4.3 自动驾驶世界模型\n\n| 方法 | 会议 | 核心思想 |\n|------|------|---------|\n| OccNet | ICCV 2023 | 3D 占用网络作为场景表示 |\n| OccWorld | ECCV 2024 | 3D 占用世界模型预测未来 |\n| GenAD | CVPR 2024 | 广义预测驾驶 |\n| LAW | ICLR 2025 | 潜空间世界模型端到端驾驶 |\n| HERMES | ICCV 2025 | 统一世界模型 |\n| ViDAR | CVPR 2024 | 视觉点云预测 |\n| GaussTR | CVPR 2025 | 高斯 Transformer 世界模型 |\n\n### 4.4 具身智能与 VLA\n\n| 方向 | 代表工作 | 说明 |\n|------|---------|------|\n| VLA (视觉-语言-动作) | RT-2 (Google), Octo, OpenVLA | 通用机器人策略 |\n| World Action Model | UniPi, SuSIE | 视频生成指导动作规划 |\n| 仿真环境 | Isaac Sim, SAPIEN, MuJoCo | 机器人训练场 |\n\n> **里程碑 4**：理解 Dreamer 系列的技术演进，能解释世界模型如何支撑智能体的感知-规划闭环。\n\n---\n\n## 五、前沿方向与硕士选题（持续跟进）\n\n### 5.1 统一世界模型\n\n当前最重要的趋势：**渲染、模拟、规划三类模型正在融合**。World Labs 的 Marble 平台已经能从同一个模型输出 Gaussian Splats（渲染）和碰撞网格（模拟）。\n\n关键开放问题：\n- 如何在同一架构中平衡视觉美感与物理精度？\n- 如何低成本获取带几何/物理标注的三维数据？\n- Sim-to-Real Gap 如何系统性地弥合？\n\n### 5.2 候选硕士研究方向\n\n| 方向 | 具体选题示例 |\n|------|------------|\n| **高效 3D 表示** | 稀疏 Gaussian 表示、混合 NeRF+3DGS 架构 |\n| **世界模型预训练** | 视频预训练用于 3D 理解、跨模态知识迁移 |\n| **4D 动态场景** | 动态 Gaussian Splatting、长序列 4D 重建 |\n| **具身世界模型** | 面向机器人的潜空间世界模型、Sim2Real |\n| **空间推理** | 3D 场景理解 + LLM、Spatial VLM |\n| **模拟器生成** | 生成式模拟环境、自动场景构建 |\n| **多模态融合** | LiDAR + Camera + Radar 统一世界表示 |\n\n### 5.3 必读综述与资源\n\n- **Awesome Spatial Intelligence**: [worldbench/awesome-spatial-intelligence](https://github.com/worldbench/awesome-spatial-intelligence) — 100+ 论文、30+ 数据集\n- **李飞飞《A Functional Taxonomy of World Models》** (2026.07)\n- **李飞飞《From Words to Worlds》** (2025.11)\n- 综述论文：《Forging Spatial Intelligence》(Wang et al., arXiv 2025)\n\n---\n\n## 六、顶级会议与期刊（关注清单）\n\n| 级别 | 会议/期刊 | 相关领域 |\n|------|----------|---------|\n| 顶会 | **CVPR** | 3D 视觉、NeRF、3DGS 主阵地 |\n| 顶会 | **ICCV** (奇数年) | 同上 |\n| 顶会 | **ECCV** (偶数年) | 同上 |\n| 顶会 | **NeurIPS** | 世界模型、RL、表示学习 |\n| 顶会 | **ICLR** | 表示学习、生成模型 |\n| 顶会 | **ICML** | 机器学习理论 |\n| 顶会 | **CoRL / ICRA** | 机器人、具身智能 |\n| 顶会 | **SIGGRAPH** | 图形学（NeRF/3DGS 常有 SIGGRAPH 版本） |\n| 期刊 | **TPAMI** | 计算机视觉旗舰期刊 |\n| 期刊 | **IJCV** | 计算机视觉 |\n| 期刊 | **Nature / Science** | 里程碑式工作（如 DreamerV3） |\n\n---\n\n## 七、实践项目路线\n\n硕士申请/研究中，**项目经历比课程成绩更有说服力**。\n\n### 建议按顺序完成的项目：\n\n| 序号 | 项目 | 难度 | 产出 |\n|------|------|------|------|\n| 1 | 用 COLMAP + NeRF 重建自己的房间/桌面 | ⭐⭐ | 博客 + GitHub |\n| 2 | 复现 3D Gaussian Splatting 并做 ablation 分析 | ⭐⭐⭐ | 技术博客 + 代码 |\n| 3 | 训练一个简单的世界模型（DreamerV3 小型环境） | ⭐⭐⭐ | 实验报告 |\n| 4 | 基于 nuScenes 做 3D 占用预测（复现 OccNet） | ⭐⭐⭐⭐ | 研究型项目 |\n| 5 | 自选一个小方向做创新改进 | ⭐⭐⭐⭐⭐ | 可投稿论文 |\n\n> 所有项目代码放到 GitHub 上，用 README 写清楚动机、方法、结果。这会在申请时成为有力材料。\n\n---\n\n## 八、时间规划建议（以 18 个月为周期）\n\n```\n月份  阶段\n 0-3   前置基础：数学、Python、ML 基础\n 2-6   2D/3D 视觉核心：多视角几何 + 3D 表示学习\n 5-9   空间智能核心：NeRF 论文链 + 3DGS 复现\n 8-12  世界模型：Dreamer 系列 + VLA + 自动驾驶世界模型\n10-15  研究方向深入 + 项目实践\n12-18  论文产出 + 申请材料准备\n```\n\n> 各阶段有重叠是正常的，不必严格线性推进。深度学习和 3D 视觉可以并行学习。\n\n---\n\n## 九、推荐课程与学习资源\n\n### 系统课程\n\n| 课程 | 来源 | 说明 |\n|------|------|------|\n| CS231n | Stanford | 计算机视觉经典课 |\n| CS231a | Stanford | 3D 视觉（多视角几何 + 3D 重建） |\n| CS 285 / CS 188 | UC Berkeley | 深度强化学习 |\n| 6.S094 | MIT | 深度学习与自动驾驶 |\n| 3D Vision (CVPR Tutorials) | 网上 | 每年更新的 3D 视觉教程 |\n\n### 持续学习\n\n- **arXiv**: 订阅 cs.CV, cs.RO, cs.AI 每日更新\n- **Twitter/X**: 关注李飞飞、Yann LeCun、领域内活跃研究者\n- **中文社区**: 知乎关注「3D 视觉」「自动驾驶之心」等专栏\n- **论文讨论**: ReadPaper、Papers With Code\n\n---\n\n## 十、关键提醒\n\n1. **代码优先**：每篇论文读完要去读代码、跑代码。只看论文不写代码，掌握程度很浅。\n2. **打好几何基础**：多视角几何是空间智能的独有门槛，不要跳过。MVG 是越啃越香的硬书。\n3. **关注 World Labs**：李飞飞的 World Labs 是该方向的旗帜，持续追踪他们的论文、博客和技术报告（Marble 平台）。\n4. **尽早开始项目**：不要等到「学完所有理论基础」才开始动手。学完基础 3D 视觉就可以开始做项目。\n5. **英语能力**：顶会论文、课程都是英文的。如果英语阅读有障碍，先花时间提升。\n6. **硕士申请策略**：空间智能是 2025-2026 年最热的方向之一。找对导师比选校更重要——优先选择在 NeRF/3DGS/World Model/Robotics 领域有持续产出的实验室。\n\n> 最后：李飞飞说得好——「世界并不由词语构成」。空间智能的核心不是语言模型，而是让机器真正理解物理世界的几何、物理和动态。你的学习旅程，本质上就是在建立对这个信念的深层理解。"}, {"id": 19, "room": "tongdian", "date": "2026-06-16", "title": "Agent Client Protocol (ACP) 详解", "tags": [], "from": "Agent Client Protocol 详解", "summary": "1. 背景：编辑器与 Coding Agent 的集成碎片化 1.1 问题描述 2024-2025 年，AI Coding Agent 迎来爆发式增长。Claude Code、Cursor、GitHub Copilot、Cody、Continue、Aider 等大量 Agent…", "content": "## 1. 背景：编辑器与 Coding Agent 的集成碎片化\n\n### 1.1 问题描述\n\n2024-2025 年，AI Coding Agent 迎来爆发式增长。Claude Code、Cursor、GitHub Copilot、Cody、Continue、Aider 等大量 Agent 涌现，它们需要与 VS Code、JetBrains IDE、Zed、Neovim 等各种编辑器集成。\n\n问题随之而来：\n\n```\nAgent 数量 M = 10，编辑器数量 N = 8\n需要的集成数量 = 10 × 8 = 80 套\n```\n\n每个 Agent 都要为每个编辑器写适配层，每个编辑器都要对接每个 Agent 的 API。这是 LSP 解决过的同一个问题，只是对象从「语言服务」变成了「AI Agent」。\n\n### 1.2 ACP 的诞生\n\n**Agent Client Protocol (ACP)** 由 **JetBrains** 和 **Zed** 联合发起，于 2025 年首次公开。核心理念：\n\n> **任何支持 ACP 的编辑器，都可以使用任何支持 ACP 的 Coding Agent —— 就像 LSP 让任意编辑器使用任意语言服务一样。**\n\n```\n┌──────────────────────────────────────────────────────┐\n│                                                      │\n│  ┌──────────┐  ┌──────────┐  ┌──────────┐          │\n│  │ VS Code  │  │ JetBrains│  │   Zed    │  ...     │\n│  └────┬─────┘  └────┬─────┘  └────┬─────┘          │\n│       │             │             │                  │\n│       ▼             ▼             ▼                  │\n│  ┌─────────────────────────────────────────────┐    │\n│  │           ACP (标准协议层)                    │    │\n│  └─────────────────────────────────────────────┘    │\n│       ▲             ▲             ▲                  │\n│       │             │             │                  │\n│  ┌────┴─────┐  ┌────┴─────┐  ┌────┴─────┐          │\n│  │ Claude   │  │ GitHub   │  │ 自建     │  ...     │\n│  │ Code     │  │ Copilot  │  │ Agent    │          │\n│  └──────────┘  └──────────┘  └──────────┘          │\n│                                                      │\n└──────────────────────────────────────────────────────┘\n```\n\n**效果**：10 个 Agent + 8 个编辑器 → 10 + 8 = 18 个适配，而非 80 个定制集成。\n\n### 1.3 与 LSP 的类比定位\n\n| 维度 | LSP | ACP |\n|------|-----|-----|\n| 协议提出者 | 微软 (2016) | JetBrains + Zed (2025) |\n| Client 是什么 | 编辑器插件 | 代码编辑器 (IDE) |\n| Server 是什么 | 语言服务器 | Coding Agent |\n| 标准化什么 | 代码智能查询（补全/诊断/跳转） | Agent 交互流程（会话/提示/工具/文件操作） |\n| 数据方向 | 主要是 Server → Client | 双向：交互控制 + 内容流 |\n| 会话概念 | 无（每次请求独立） | 有（session 贯穿多轮对话） |\n\n> **ACP 是 LSP 在 AI 时代的自然延伸。**如果说 LSP 标准化了「编辑器如何向语言服务提问」，ACP 标准化了「编辑器如何与 AI Agent 对话和协作」。\n\n---\n\n## 2. 核心架构\n\n### 2.1 角色定义\n\nACP 中只有两个直接角色（与 LSP 类似，比 MCP 的三角色模型更简洁）：\n\n```\n┌──────────────────────────────────────┐\n│             Client                    │\n│          (代码编辑器/IDE)              │\n│                                      │\n│  • 管理环境 (cwd, 文件系统)            │\n│  • 处理用户交互                        │\n│  • 控制资源访问                        │\n│  • 渲染 Agent 输出                     │\n│  • 提供 UI 层 (diff 展示等)            │\n└──────────────┬───────────────────────┘\n               │  ACP (JSON-RPC 2.0)\n               │\n┌──────────────┴───────────────────────┐\n│             Agent                     │\n│       (Coding Agent 进程)             │\n│                                      │\n│  • 调用 LLM                           │\n│  • 执行工具                            │\n│  • 修改代码                            │\n│  • 规划和推理                          │\n└──────────────────────────────────────┘\n```\n\n| 角色 | 说明 | 示例 |\n|------|------|------|\n| **Client** | 代码编辑器/IDE，提供用户交互界面 | VS Code、JetBrains IDE、Zed、Neovim |\n| **Agent** | 利用生成式 AI 自主修改代码的程序 | Claude Code、GitHub Copilot Agent、Cody、Continue |\n\n> Agent 通常作为 Client 的**子进程**运行（stdio 模式），也可以作为远程服务独立部署（HTTP/WebSocket 模式）。\n\n### 2.2 部署模式\n\n| 模式 | 通信方式 | 适用场景 |\n|------|---------|---------|\n| **本地 Agent** | JSON-RPC over stdio | 低延迟、本地运行、安全可控 |\n| **远程 Agent** | HTTP 或 WebSocket | Agent 托管在云端、需要 GPU 等专有资源 |\n\n> ⚠️ 远程 Agent 的完整支持仍在开发中，官方正与多家 Agent 平台协作完善。\n\n---\n\n## 3. 协议基础\n\n### 3.1 JSON-RPC 2.0 消息格式\n\n与 LSP、MCP 相同，ACP 也基于 JSON-RPC 2.0：\n\n- **请求（Request）**：包含 `id`、`method`、`params`，期待响应\n- **响应（Response）**：包含 `id`、`result`（成功）或 `error`（失败）\n- **通知（Notification）**：包含 `method`、`params`，不含 `id`，无需响应\n\n### 3.2 文件路径约定\n\n- 所有文件路径**必须为绝对路径**\n- 行号从 **1** 开始计数（而非 0）\n\n### 3.3 文本渲染\n\n- 用户可读文本的默认格式为 **Markdown**\n- 这样设计的好处：提供足够富文本表现力，同时不强制编辑器支持 HTML 渲染\n\n---\n\n## 4. 完整生命周期\n\nACP 的交互遵循严格的三阶段生命周期：\n\n```\n┌─────────────────────────────────────────────────────────┐\n│                    阶段 1：初始化                         │\n│                                                         │\n│  Client ──── initialize ──────────► Agent               │\n│  (协议版本 + Client 能力 + Client 信息)                    │\n│                                                         │\n│  Client ◄──── InitializeResult ─── Agent                │\n│  (协商后协议版本 + Agent 能力 + Agent 信息)                │\n│                                                         │\n│  Client ──── authenticate (如需要) ─► Agent              │\n│                                                         │\n├─────────────────────────────────────────────────────────┤\n│                   阶段 2：会话设置                         │\n│                                                         │\n│  ┌─ 新建会话：                                           │\n│  │  Client ──── session/new ────────► Agent              │\n│  │  (cwd + MCP Servers 配置)                             │\n│  │  Client ◄──── { sessionId } ────── Agent              │\n│  │                                                      │\n│  └─ 恢复会话（需 loadSession 能力）：                     │\n│     Client ──── session/load ───────► Agent              │\n│     (sessionId + cwd)                                    │\n│     Agent  → → → 回放历史消息 → → → Client               │\n│     Client ◄──── { result: null } ─── Agent              │\n│                                                         │\n├─────────────────────────────────────────────────────────┤\n│                   阶段 3：提示词交互                        │\n│                                                         │\n│  Client ──── session/prompt ───────► Agent               │\n│  (sessionId + 用户消息内容块)                              │\n│                                                         │\n│  Agent ──── session/update ────────► Client (多次)       │\n│  (计划、文本流、工具调用进度)                               │\n│                                                         │\n│  Agent ──── session/request_permission ► Client (可选)    │\n│  (需要用户授权的工具调用)                                  │\n│                                                         │\n│  Client ──── session/cancel ───────► Agent (可随时取消)   │\n│                                                         │\n│  Agent ──── session/prompt 响应 ───► Client              │\n│  ({ stopReason: \"end_turn\" | ... })                     │\n│                                                         │\n└─────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 5. 初始化阶段详解\n\n### 5.1 initialize 请求\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 0,\n  \"method\": \"initialize\",\n  \"params\": {\n    \"protocolVersion\": 1,\n    \"clientCapabilities\": {\n      \"fs\": {\n        \"readTextFile\": true,\n        \"writeTextFile\": true\n      },\n      \"terminal\": true\n    },\n    \"clientInfo\": {\n      \"name\": \"my-client\",\n      \"title\": \"My Editor\",\n      \"version\": \"1.0.0\"\n    }\n  }\n}\n```\n\n### 5.2 InitializeResult 响应\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 0,\n  \"result\": {\n    \"protocolVersion\": 1,\n    \"agentCapabilities\": {\n      \"loadSession\": true,\n      \"promptCapabilities\": {\n        \"image\": true,\n        \"audio\": true,\n        \"embeddedContext\": true\n      },\n      \"mcp\": {\n        \"http\": true,\n        \"sse\": true\n      }\n    },\n    \"agentInfo\": {\n      \"name\": \"my-agent\",\n      \"title\": \"My Agent\",\n      \"version\": \"1.0.0\"\n    },\n    \"authMethods\": []\n  }\n}\n```\n\n### 5.3 能力字段详解\n\n**ClientCapabilities**：\n\n| 能力 | 说明 |\n|------|------|\n| `fs.readTextFile` | Client 支持代理读取文件 |\n| `fs.writeTextFile` | Client 支持代理写入文件 |\n| `terminal` | Client 支持所有 `terminal/*` 方法 |\n\n**AgentCapabilities**：\n\n| 能力 | 说明 |\n|------|------|\n| `loadSession` | 支持 `session/load` 恢复会话 |\n| `promptCapabilities.image` | 支持在 prompt 中接收图像 |\n| `promptCapabilities.audio` | 支持在 prompt 中接收音频 |\n| `promptCapabilities.embeddedContext` | 支持在 prompt 中嵌入资源内容 |\n| `mcp.http` | 支持通过 HTTP 连接 MCP Server |\n| `mcp.sse` | 支持通过 SSE 连接 MCP Server |\n\n> **基准要求**：所有 Agent 必须支持 `session/prompt` 中的 `ContentBlock::Text` 和 `ContentBlock::ResourceLink`。\n\n### 5.4 版本协商规则\n\n1. Client 发送自己支持的最新协议版本\n2. Agent 若支持该版本 → 响应相同版本\n3. Agent 若不支持 → 响应自己支持的最新版本\n4. Client 若不支持 Agent 响应的版本 → **断开连接**并通知用户\n\n---\n\n## 6. 会话管理\n\n### 6.1 创建新会话：`session/new`\n\n```json\n// 请求\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"session/new\",\n  \"params\": {\n    \"cwd\": \"/home/user/project\",\n    \"mcpServers\": [\n      {\n        \"name\": \"filesystem\",\n        \"command\": \"/path/to/mcp-server\",\n        \"args\": [\"--stdio\"],\n        \"env\": [\n          { \"name\": \"API_KEY\", \"value\": \"xxx\" }\n        ]\n      }\n    ]\n  }\n}\n\n// 响应\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"result\": {\n    \"sessionId\": \"sess_abc123def456\"\n  }\n}\n```\n\n| 参数 | 类型 | 必填 | 说明 |\n|------|------|------|------|\n| `cwd` | string | ✅ | 当前工作目录（绝对路径） |\n| `mcpServers` | array | 否 | Agent 应连接的 MCP Server 列表 |\n\n**MCP Server 配置支持三种传输类型**：\n\n| 类型 | 配置方式 | 备注 |\n|------|---------|------|\n| **Stdio（默认）** | `command` + `args` | 所有 Agent 必须支持 |\n| **HTTP** | `type: \"http\"` + `url` + `headers` | 可选，检查 `mcpCapabilities.http` |\n| **SSE** | `type: \"sse\"` + `url` + `headers` | 可选，已被 MCP 规范弃用 |\n\n### 6.2 恢复会话：`session/load`\n\n前提是 Agent 在 initialize 中声明了 `loadSession: true`。\n\n```json\n// 请求\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"session/load\",\n  \"params\": {\n    \"sessionId\": \"sess_789xyz\",\n    \"cwd\": \"/home/user/project\"\n  }\n}\n```\n\n**加载流程**：\n\n```\nClient ──── session/load ──────────────────────► Agent\n                                                    │\nAgent ──── session/update (历史消息1) ──────────► Client\nAgent ──── session/update (历史消息2) ──────────► Client\nAgent ──── session/update (历史消息3) ──────────► Client\n   ...                                              │\nAgent ──── { result: null } ───────────────────► Client\n                                                    │\n   [对话恢复，可继续发送 session/prompt]              │\n```\n\n### 6.3 session/update 通知\n\n`session/update` 是 Agent 向 Client 推送信息的核心通知，可包含：\n\n| 更新类型 (sessionUpdate) | 说明 |\n|--------------------------|------|\n| `agent_message_chunk` | Agent 生成的文本内容 |\n| `user_message_chunk` | 历史会话中的用户消息（加载时用） |\n| `tool_call` | 工具调用请求 |\n| `tool_call_update` | 工具调用状态更新（in_progress/completed） |\n| `plan` | Agent 的任务分步计划 |\n| `available_commands_update` | 可用命令列表变更 |\n| `mode_change` | Agent 运行模式变更 |\n\n---\n\n## 7. 提示词交互轮次（Prompt Turn）\n\n这是 ACP 最核心的交互模式。一个 Turn 从用户消息开始，到 Agent 完成响应结束。\n\n### 7.1 完整时序图\n\n```\nClient                                    Agent\n  │                                         │\n  │──── session/prompt ────────────────────►│  ① 发送用户消息\n  │  (文本 + 图片 + 文件引用等)               │\n  │                                         │  ② LLM 推理\n  │◄─── session/update (plan) ─────────────│  ③ 输出计划\n  │◄─── session/update (message chunk) ────│  ③ 输出文本流\n  │◄─── session/update (tool_call) ────────│  ③ 工具调用请求\n  │                                         │  ④ 检查：有待处理工具\n  │◄─── session/request_permission ────────│  ⑤ 请求用户确认\n  │──── 授权响应 ──────────────────────────►│\n  │◄─── session/update (tool in_progress) ─│  ⑤ 工具开始执行\n  │◄─── session/update (tool completed) ───│  ⑤ 工具执行完成\n  │                                         │  ⑥ 结果返回 LLM （回到②循环）\n  │                                         │  ...\n  │                                         │  ④ 检查：无待处理工具\n  │◄─── session/prompt 响应 ───────────────│     返回 StopReason\n  │  ({ stopReason: \"end_turn\" })          │\n  │                                         │\n```\n\n### 7.2 session/prompt 请求\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2,\n  \"method\": \"session/prompt\",\n  \"params\": {\n    \"sessionId\": \"sess_abc123def456\",\n    \"prompt\": [\n      {\n        \"type\": \"text\",\n        \"text\": \"分析这段代码的潜在问题\"\n      },\n      {\n        \"type\": \"resource\",\n        \"resource\": {\n          \"uri\": \"file:///home/user/project/main.py\",\n          \"mimeType\": \"text/x-python\",\n          \"text\": \"def process_data(items):\\n    for item in items:\\n        print(item)\"\n        }\n      }\n    ]\n  }\n}\n```\n\n| 参数 | 类型 | 必填 | 说明 |\n|------|------|------|------|\n| `sessionId` | string | ✅ | 会话 ID |\n| `prompt` | ContentBlock[] | ✅ | 消息内容数组，可包含文本、图像、文件等 |\n\n**ContentBlock 类型**：\n\n| 类型 | 说明 | 是否必支持 |\n|------|------|-----------|\n| `text` | 纯文本 `{ type: \"text\", text: \"...\" }` | ✅ 基准必须 |\n| `resource` | 资源引用（URI + MIME + 内容） | ✅ 基准必须 |\n| `image` | 图像内容 | 可选（需 `promptCapabilities.image`） |\n| `audio` | 音频内容 | 可选（需 `promptCapabilities.audio`） |\n\n### 7.3 session/prompt 响应\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2,\n  \"result\": {\n    \"stopReason\": \"end_turn\"\n  }\n}\n```\n\n### 7.4 StopReason 枚举\n\n| 值 | 说明 |\n|------|------|\n| `end_turn` | LLM 不请求更多工具调用，正常完成响应 |\n| `max_tokens` | 达到 Token 上限 |\n| `max_turn_requests` | 超过单轮 LLM 请求次数上限 |\n| `refusal` | Agent 拒绝继续 |\n| `cancelled` | 被客户端通过 `session/cancel` 取消 |\n\n### 7.5 取消机制：`session/cancel`\n\n客户端可随时取消正在进行的轮次：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"session/cancel\",\n  \"params\": {\n    \"sessionId\": \"sess_abc123def456\"\n  }\n}\n```\n\n| 角色 | 取消后的行为要求 |\n|------|----------------|\n| Client | 立即标记所有待处理的工具调用为 `cancelled` |\n| Client | 用 `cancelled` 结果响应所有挂起的权限请求 |\n| Agent | 尽快停止所有 LLM 请求和工具调用 |\n| Agent | 捕获中止异常，返回 `cancelled` 停止原因 |\n\n### 7.6 权限确认：`session/request_permission`\n\n当 Agent 需要执行可能产生副作用的操作时，会先请求 Client 确认：\n\n```\nAgent ──── session/request_permission ──► Client\n          { toolCallId, toolName, arguments }\n\nClient ── 响应 (allow/deny) ────────────► Agent\n```\n\n---\n\n## 8. Client 端方法（Client 暴露给 Agent）\n\n### 8.1 文件系统操作\n\n| 方法 | 说明 | 能力要求 |\n|------|------|---------|\n| `fs/read_text_file` | Agent 请求 Client 读取文件内容 | `fs.readTextFile` |\n| `fs/write_text_file` | Agent 请求 Client 写入文件内容 | `fs.writeTextFile` |\n\n> **设计理念**：ACP 中不是 Agent 直接操作文件系统，而是**Agent 请求 Client 代为操作**。这给了 Client 完全的权限控制能力——Client 可以拦截、审计或拒绝任何文件操作。\n\n### 8.2 终端操作\n\n| 方法 | 说明 | 能力要求 |\n|------|------|---------|\n| `terminal/create` | 创建新终端 | `terminal` |\n| `terminal/output` | 获取终端输出和退出状态 | `terminal` |\n| `terminal/wait_for_exit` | 等待终端命令退出 | `terminal` |\n| `terminal/kill` | 强制终止终端命令 | `terminal` |\n| `terminal/release` | 释放终端资源 | `terminal` |\n\n> LSP 中没有终端概念，ACP 新增这一能力体现了 Coding Agent 的特殊需求——Agent 需要执行 shell 命令来运行测试、构建、安装依赖等。\n\n---\n\n## 9. 可选方法\n\n### 9.1 session/set_mode\n\n允许 Client 在不同操作模式间切换：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 3,\n  \"method\": \"session/set_mode\",\n  \"params\": {\n    \"sessionId\": \"sess_abc123\",\n    \"mode\": \"plan\"\n  }\n}\n```\n\n典型模式：`craft`（直接执行）、`plan`（先规划再执行）、`ask`（仅回答问题）。\n\n---\n\n## 10. ACP 与 MCP 的关系\n\nACP 和 MCP **不是竞争关系，而是互补关系**。ACP 内置了 MCP 集成：\n\n```\n┌─────────────────────────────────────────────────────┐\n│                    Client (编辑器)                    │\n│                                                     │\n│  ┌─────────────────────────────────────────────┐    │\n│  │              Agent (ACP Server)               │    │\n│  │                                              │    │\n│  │  ┌──────────┐  ┌──────────┐  ┌──────────┐  │    │\n│  │  │ MCP      │  │ MCP      │  │ MCP      │  │    │\n│  │  │ Client 1 │  │ Client 2 │  │ Client 3 │  │    │\n│  │  └────┬─────┘  └────┬─────┘  └────┬─────┘  │    │\n│  └───────┼──────────────┼──────────────┼───────┘    │\n└──────────┼──────────────┼──────────────┼────────────┘\n           │              │              │\n     ┌─────┴─────┐  ┌─────┴─────┐  ┌─────┴─────┐\n     │ 文件系统   │  │ 数据库     │  │ GitHub    │\n     │ MCP Server│  │ MCP Server│  │ MCP Server│\n     └───────────┘  └───────────┘  └───────────┘\n```\n\n**关系梳理**：\n\n| 维度 | ACP | MCP |\n|------|-----|-----|\n| 标准化什么 | 编辑器 ↔ Agent 交互 | AI 应用 ↔ 数据源/工具 交互 |\n| 谁调用谁 | Client 调用 Agent 方法；Agent 调用 Client 方法 | Host 调用 MCP Server 方法 |\n| MCP 如何关联 | ACP 允许 Client 在创建会话时配置 MCP Server，Agent 内部连接它们 | MCP 是 ACP 的一个「子协议」 |\n| 角色映射 | Client = 编辑器；Agent = Coding Agent | Host = AI 应用；Server = 数据源 |\n\n> 简单说：**ACP 管「编辑器怎么和 Agent 对话」，MCP 管「Agent 怎么连外部工具」。**两者结合就构成了完整的 AI 编程体验：编辑器通过 ACP 调度 Agent，Agent 通过 MCP 获取上下文和执行工具。\n\n---\n\n## 11. 三大协议对比总览\n\n| 维度 | LSP | MCP | ACP |\n|------|-----|-----|-----|\n| **发布时间** | 2016 | 2024 | 2025 |\n| **提出者** | 微软 | Anthropic | JetBrains + Zed |\n| **标准化什么** | 编辑器 ↔ 语言服务 | AI 应用 ↔ 数据源/工具 | 编辑器 ↔ Coding Agent |\n| **Server 做什么** | 代码智能（补全、诊断） | 提供上下文/执行工具 | AI 自主编程（调用 LLM + 工具） |\n| **会话概念** | 无（请求独立） | 无（请求独立） | 有（session 跨轮次） |\n| **终端操作** | 无 | 无 | 有（terminal/*） |\n| **文件操作** | 有（textDocument/*） | 有（但非核心） | 有（fs/*，通过 Client 代理） |\n| **用户确认** | 不需要 | 需要（工具调用） | 需要（session/request_permission） |\n| **取消机制** | 有（$/cancelRequest） | 无标准机制 | 有（session/cancel） |\n| **MCP 集成** | 无 | 本身即 MCP | 内置 MCP Server 配置 |\n| **扩展性** | 自定义方法 | 社区 Server | _ 前缀方法 + _meta 字段 |\n| **传输方式** | stdio, TCP, Pipe | stdio, SSE(HTTP) | stdio, HTTP, WebSocket |\n| **数据复用** | — | — | 尽可能复用 MCP 的 JSON 类型定义 |\n\n### 三者的分层关系\n\n```\n┌──────────────────────────────────────────────────────┐\n│                    用户交互层                          │\n│                                                      │\n│   ┌──────────┐                                       │\n│   │ 编辑器     │ ← 人机交互界面                         │\n│   └────┬─────┘                                       │\n├────────┼──────────────────────────────────────────────┤\n│   ACP  │ 标准化「编辑器 ↔ Coding Agent」交互            │\n│        │ (会话管理、提示流转、权限控制、取消机制)          │\n├────────┼──────────────────────────────────────────────┤\n│   MCP  │ Agent 通过 MCP 连接外部数据源和工具             │\n│        │ (文件系统、数据库、API、搜索引擎等)              │\n├────────┼──────────────────────────────────────────────┤\n│   LSP  │ Agent 通过 LSP 理解代码语义                    │\n│        │ (符号表、诊断、类型信息、引用关系)               │\n└────────┴──────────────────────────────────────────────┘\n```\n\n> 三个协议的分工：\n> - **ACP**：编辑器与 Agent 之间的「指挥系统」\n> - **MCP**：Agent 连接外部世界的「感觉器官和手」\n> - **LSP**：Agent 理解代码语义的「语法分析器」\n\n---\n\n## 12. 扩展性机制\n\nACP 提供了标准化的扩展机制，在保持互操作性的同时支持自定义功能。\n\n### 12.1 _meta 字段\n\n协议中**所有类型**都包含 `_meta` 字段（`{ [key: string]: unknown }`），可用于附加自定义信息：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"session/prompt\",\n  \"params\": {\n    \"sessionId\": \"sess_abc123\",\n    \"prompt\": [{ \"type\": \"text\", \"text\": \"Hello\" }],\n    \"_meta\": {\n      \"traceparent\": \"00-80e1...7a08-01\",\n      \"zed.dev/debugMode\": true\n    }\n  }\n}\n```\n\n> `_meta` 中根级保留键名：`traceparent`、`tracestate`、`baggage`（用于 W3C Trace Context）。\n\n### 12.2 扩展方法\n\n以 `_` 开头的方法名保留给自定义扩展：\n\n```json\n// 自定义请求（包含 id，期待响应）\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"_zed.dev/workspace/buffers\",\n  \"params\": { \"language\": \"rust\" }\n}\n\n// 自定义通知（不含 id，单向）\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"_zed.dev/file_opened\",\n  \"params\": { \"path\": \"/home/user/project/src/main.rs\" }\n}\n```\n\n| 行为 | 规范 |\n|------|------|\n| 无法识别的自定义请求 | 必须返回 Method not found 错误 (-32601) |\n| 无法识别的自定义通知 | 应该静默忽略 |\n\n### 12.3 声明自定义能力\n\n```json\n{\n  \"result\": {\n    \"agentCapabilities\": {\n      \"loadSession\": true,\n      \"_meta\": {\n        \"zed.dev\": {\n          \"workspace\": true,\n          \"fileNotifications\": true\n        }\n      }\n    }\n  }\n}\n```\n\n---\n\n## 13. 生态系统\n\n### 13.1 发起者\n\n| 组织 | 角色 |\n|------|------|\n| **JetBrains** | 联合发起，提供 IDE 侧集成 |\n| **Zed** | 联合发起，高性能编辑器原生支持 |\n\n### 13.2 SDK 支持\n\nACP 提供多语言 SDK：\n\n| 语言 | 说明 |\n|------|------|\n| **Kotlin** | JetBrains 官方维护 |\n| **Java** | JetBrains 官方维护 |\n| **Python** | 社区维护 |\n| **Rust** | Zed 官方维护 |\n| **TypeScript** | 社区维护 |\n\n### 13.3 官网资源\n\n| 资源 | 链接 |\n|------|------|\n| 官网 | https://agentclientprotocol.com |\n| 中文站 | https://agentclientprotocol.cn |\n| GitHub | https://github.com/agentclientprotocol/agent-client-protocol |\n| 文档索引 | https://agentclientprotocol.com/llms.txt |\n\n---\n\n## 14. 与 AI Agent 工程的关系\n\n### 14.1 ACP 提供了 Agent 的标准化外壳\n\n对于构建 AI Agent 框架的开发者：\n\n- **如果做 Agent（服务端）**：实现 ACP 协议即可对接所有支持 ACP 的编辑器，无需为每个编辑器写插件\n- **如果做编辑器集成（客户端）**：实现 ACP 协议即可接入所有 ACP 兼容的 Agent\n\n### 14.2 ACP + MCP + LSP = Agent 三件套\n\n现代 AI Coding Agent 的完整技术栈：\n\n```\nACP ← 编辑器如何调用 Agent\n MCP ← Agent 如何获取上下文和工具\n LSP ← Agent 如何理解代码语义\n```\n\n### 14.3 潜在应用场景\n\n- **自研 Agent 对接多编辑器**：一次实现 ACP，兼容 VS Code、JetBrains、Zed\n- **企业内部 Agent 平台**：通过 ACP 统一管理多个 Agent 实例\n- **Agent 市场**：类似 LSP 让语言服务可插拔，ACP 让 Agent 可插拔\n\n---\n\n## 15. 总结\n\n| 维度 | 要点 |\n|------|------|\n| **解决什么问题** | 编辑器与 Coding Agent 的集成碎片化（M×N 问题） |\n| **核心理念** | LSP for AI Agents：标准化编辑器 ↔ Agent 交互 |\n| **发起组织** | JetBrains + Zed（2025） |\n| **通信协议** | JSON-RPC 2.0，stdio / HTTP / WebSocket |\n| **三阶段生命周期** | 初始化 → 会话设置 → 提示词交互 |\n| **核心特性** | 会话管理、流式输出、工具调用、权限控制、取消机制 |\n| **与 MCP 关系** | 内置 MCP 集成，Agent 通过 MCP 获取上下文和工具 |\n| **与 LSP 关系** | 继承 LSP 的 \"Client-Server 标准化\" 理念 |\n| **扩展性** | `_meta` 字段 + `_` 前缀方法 + 能力声明 |\n| **生态现状** | 新协议（2025），JetBrains 和 Zed 主导，快速增长 |\n\n---\n\n> **延伸阅读**：\n> - ACP 官方规范：https://agentclientprotocol.com\n> - ACP 中文文档：https://agentclientprotocol.cn\n> - GitHub 仓库：https://github.com/agentclientprotocol/agent-client-protocol\n> - 本项目相关文档：`Language Server Protocol 详解.md`、`Model Context Protocol 详解.md`"}, {"id": 20, "room": "tongdian", "date": "2026-06-16", "title": "JSON-RPC 协议详解", "tags": [], "from": "JSON-RPC 协议详解", "summary": "1. 为什么需要 JSON-RPC？ 1.1 RPC 的核心思想 RPC (Remote Procedure Call，远程过程调用) 的核心思想很简单：像调用本地函数一样调用远程服务。 要实现远程调用，需要解决三个问题： 1. 怎么传：数据如何编码（序列化） 2.…", "content": "## 1. 为什么需要 JSON-RPC？\n\n### 1.1 RPC 的核心思想\n\n**RPC (Remote Procedure Call，远程过程调用)** 的核心思想很简单：像调用本地函数一样调用远程服务。\n\n```\n本地调用：\nresult = add(1, 2)                    ← 直接调用\n\n远程调用：\nresult = remote_call(\"add\", [1, 2])   ← 通过网络调用远程服务器上的 add 函数\n```\n\n要实现远程调用，需要解决三个问题：\n1. **怎么传**：数据如何编码（序列化）\n2. **传什么**：怎么指定调用哪个方法、传什么参数\n3. **协议无关**：不绑定特定传输方式（HTTP、WebSocket、stdio 都应该能用）\n\n### 1.2 JSON-RPC 的答案\n\nJSON-RPC 是一个**极简主义的 RPC 协议**，只用 JSON 就解决了全部三个问题：\n\n| 问题 | JSON-RPC 解法 |\n|------|--------------|\n| 编码 | JSON（文本，可读，所有语言原生支持） |\n| 语义 | `method` + `params` + `id` 三个字段 |\n| 传输 | 协议无关（HTTP、stdio、WebSocket、TCP 随便用） |\n\n> 协议规范仅约 **10 页**，是目前所有主流 RPC 协议中**最简单的**。\n\n---\n\n## 2. JSON-RPC 2.0 核心规范\n\n### 2.1 四种消息类型\n\nJSON-RPC 2.0 定义了四种消息类型：\n\n```\n                          JSON-RPC 消息\n                               │\n          ┌────────────────────┼────────────────────┐\n          │                    │                    │\n      Request              Notification           Batch\n   (期待回复)              (不期待回复)           (批量请求)\n          │\n    ┌─────┴─────┐\n    │           │\n  Response    Error\n (成功响应)   (错误响应)\n```\n\n### 2.2 请求（Request）\n\n一个完整的 JSON-RPC 请求包含四个字段：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"subtract\",\n  \"params\": [42, 23]\n}\n```\n\n| 字段 | 类型 | 必填 | 说明 |\n|------|------|------|------|\n| `jsonrpc` | string | ✅ | 固定值 `\"2.0\"`，版本标识 |\n| `id` | string / number / null | ✅ | 请求标识，用于匹配响应。**通知中无此字段** |\n| `method` | string | ✅ | 调用的方法名，如 `\"subtract\"`、`\"tools/call\"` |\n| `params` | array / object | 否 | 参数。数组为**按位置传参**，对象为**按名称传参** |\n\n**两种传参方式*
