*：\n\n```json\n// 按位置传参 (by-position)\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"subtract\",\n  \"params\": [42, 23]\n}\n\n// 按名称传参 (by-name)\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2,\n  \"method\": \"subtract\",\n  \"params\": { \"minuend\": 42, \"subtrahend\": 23 }\n}\n```\n\n### 2.3 通知（Notification）\n\n通知是**不需要回复的请求**——没有 `id` 字段：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"update\",\n  \"params\": [1, 2, 3, 4, 5]\n}\n```\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"log\",\n  \"params\": { \"level\": \"info\", \"message\": \"Server started\" }\n}\n```\n\n| 特点 | 说明 |\n|------|------|\n| **无 `id` 字段** | 不需要匹配响应 |\n| **单向** | 发完即忘，不期待回复 |\n| **不可批处理** | 通知不能在 Batch 中发送 |\n| **典型用途** | 日志、状态更新、事件推送 |\n\n### 2.4 成功响应（Response）\n\n当请求被成功处理时：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"result\": 19\n}\n```\n\n| 字段 | 类型 | 必填 | 说明 |\n|------|------|------|------|\n| `jsonrpc` | string | ✅ | 固定值 `\"2.0\"` |\n| `id` | — | ✅ | 必须与请求的 `id` 完全相同（类型和值） |\n| `result` | any | ✅ | 返回结果，可以是任意 JSON 类型 |\n\n> ⚠️ `Result` 和 `Error` **互斥**——成功响应有 `result` 无 `error`，错误响应有 `error` 无 `result`。\n\n### 2.5 错误响应（Error）\n\n当请求处理失败时：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"error\": {\n    \"code\": -32601,\n    \"message\": \"Method not found\",\n    \"data\": \"The method 'foobar' does not exist\"\n  }\n}\n```\n\nError 对象包含三个字段：\n\n| 字段 | 类型 | 必填 | 说明 |\n|------|------|------|------|\n| `code` | number | ✅ | 错误码（整数） |\n| `message` | string | ✅ | 简短描述（单句，不含换行） |\n| `data` | any | 否 | 附加信息（堆栈跟踪、详细原因等） |\n\n---\n\n## 3. 标准错误码\n\nJSON-RPC 2.0 定义了五类标准错误码：\n\n| 错误码 | 名称 | 说明 |\n|--------|------|------|\n| `-32700` | Parse error | 无效 JSON。服务端收到无法解析的数据 |\n| `-32600` | Invalid Request | 发送的 JSON 不是有效的请求对象 |\n| `-32601` | Method not found | 方法不存在或不可用 |\n| `-32602` | Invalid params | 方法参数无效 |\n| `-32603` | Internal error | JSON-RPC 内部错误 |\n\n**自定义错误码**范围：\n\n```\n-32768 ~ -32000    保留给预定义错误（未来扩展）\n-32000 ~ -32099    保留给实现定义的服务器错误\n其余范围          可用于应用自定义错误\n```\n\n---\n\n## 4. 批量请求（Batch）\n\n### 4.1 基本用法\n\n客户端可以一次发送多个请求（JSON 数组），服务端按顺序返回响应数组：\n\n```json\n// 请求（JSON 数组）\n[\n  { \"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"add\", \"params\": [1, 2] },\n  { \"jsonrpc\": \"2.0\", \"id\": 2, \"method\": \"add\", \"params\": [3, 4] },\n  { \"jsonrpc\": \"2.0\", \"method\": \"notify\", \"params\": [\"hello\"] }\n]\n\n// 响应（JSON 数组，通知无响应）\n[\n  { \"jsonrpc\": \"2.0\", \"id\": 1, \"result\": 3 },\n  { \"jsonrpc\": \"2.0\", \"id\": 2, \"result\": 7 }\n]\n```\n\n### 4.2 批处理规则\n\n| 规则 | 说明 |\n|------|------|\n| **空数组** | 服务端应返回 Invalid Request 错误 |\n| **全是通知** | 服务端不返回任何内容 |\n| **单个请求** | 必须返回单个响应对象，不能包装在数组中 |\n| **执行顺序** | 服务端可以任意顺序执行（不保证顺序） |\n| **通知不允许** | 通知（无 `id` 的消息）不能出现在 Batch 中 |\n\n---\n\n## 5. 协议规则总结\n\n### 5.1 客户端行为\n\n| 规则 | 规范 |\n|------|------|\n| 发送结构 | 所有请求严格是 JSON 对象或数组（Batch） |\n| `jsonrpc` 字段 | 必须为 `\"2.0\"` |\n| `id` 类型 | null、number、string 之一 |\n| `id` 顺序 | 不要求连续、有序，只要求匹配 |\n| 通知 | 客户端不应对通知设置 `id` |\n| 重试 | 客户端自行决定，规范不规定 |\n\n### 5.2 服务端行为\n\n| 规则 | 规范 |\n|------|------|\n| 解析失败 | 返回 Parse error（-32700） |\n| 结构无效 | 返回 Invalid Request（-32600） |\n| 请求批处理 | 逐个处理，逐响应 |\n| 通知无响应 | 服务端不得对通知返回响应 |\n| `id` 匹配 | 响应中的 `id` 必须与原请求完全一致 |\n| 批量响应 | 可以按任意顺序返回，客户端按 `id` 匹配 |\n\n---\n\n## 6. JSON-RPC 1.0 vs 2.0\n\n| 维度 | 1.0 | 2.0 |\n|------|-----|-----|\n| `jsonrpc` 字段 | 无 | `\"2.0\"` |\n| `id` 字段 | 必填（无法支持通知） | 可选（无 `id` = 通知） |\n| 错误码 | 简单字符串 | 结构化 `{code, message, data}` |\n| 命名参数 | 不支持 | 支持（`params` 可以是对象） |\n| 批量请求 | 不支持 | 支持（JSON 数组） |\n| 错误时 `id` | null | 保留原请求 `id` |\n\n> 现在所有现代协议（LSP、MCP、ACP）都基于 **JSON-RPC 2.0**。\n\n---\n\n## 7. JSON-RPC 传输层\n\nJSON-RPC 的核心优势是**传输无关**——以下方式都可以：\n\n### 7.1 HTTP\n\n```http\nPOST /rpc HTTP/1.1\nHost: example.com\nContent-Type: application/json\n\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"getUser\",\n  \"params\": { \"userId\": 123 }\n}\n```\n\n### 7.2 stdio（标准输入输出）\n\n```\n┌──────────────┐                    ┌──────────────┐\n│ Client       │                    │ Server       │\n│              │──── stdin ────────►│              │\n│              │    JSON-RPC 消息    │  (子进程)     │\n│              │◄─── stdout ───────│              │\n└──────────────┘                    └──────────────┘\n```\n\n这是 LSP 和 MCP 最常用的本地通信方式。Client 启动 Server 作为子进程，通过 stdin 发送 JSON-RPC 请求，stdout 读取响应。\n\n### 7.3 WebSocket\n\n```javascript\n// 客户端\nws.send(JSON.stringify({\n  jsonrpc: \"2.0\",\n  id: 1,\n  method: \"subscribe\",\n  params: { channel: \"updates\" }\n}));\n\nws.onmessage = (event) => {\n  const response = JSON.parse(event.data);\n  // 处理响应或通知\n};\n```\n\n### 7.4 TCP Socket\n\n```json\n{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}\\n\n```\n\nLSP 支持通过 TCP Socket 连接远程 Language Server。\n\n---\n\n## 8. 在 LSP / MCP / ACP 中的应用\n\nJSON-RPC 2.0 是这三个协议共同的**消息格式层**：\n\n```\n┌─────────────────────────────────────────────────┐\n│               LSP / MCP / ACP                   │\n│                                                  │\n│    各自的方法语义（补全、工具调用、会话管理...）        │\n│                                                  │\n├─────────────────────────────────────────────────┤\n│              JSON-RPC 2.0                        │\n│                                                  │\n│    Request / Response / Notification / Error     │\n│                                                  │\n├─────────────────────────────────────────────────┤\n│              传输层 (stdio / HTTP / TCP)         │\n└─────────────────────────────────────────────────┘\n```\n\n### 8.1 各协议的方法命名风格\n\n| 协议 | 方法示例 | 命名风格 |\n|------|---------|---------|\n| **LSP** | `textDocument/completion`、`textDocument/hover` | 领域/操作 |\n| **MCP** | `tools/list`、`resources/read`、`prompts/get` | 原语/操作 |\n| **ACP** | `session/prompt`、`session/new`、`fs/read_text_file` | 模块/操作 |\n\n### 8.2 LSP 中的实际消息\n\n```json\n// LSP 请求：请求代码补全\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 42,\n  \"method\": \"textDocument/completion\",\n  \"params\": {\n    \"textDocument\": { \"uri\": \"file:///main.go\" },\n    \"position\": { \"line\": 10, \"character\": 15 }\n  }\n}\n\n// LSP 通知：文档被打开\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"textDocument/didOpen\",\n  \"params\": {\n    \"textDocument\": {\n      \"uri\": \"file:///main.go\",\n      \"languageId\": \"go\",\n      \"version\": 1,\n      \"text\": \"package main\\n\\nimport \\\"fmt\\\"\\n...\"\n    }\n  }\n}\n```\n\n### 8.3 MCP 中的实际消息\n\n```json\n// MCP 请求：列出可用工具\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"tools/list\",\n  \"params\": {}\n}\n\n// MCP 通知：资源已更新\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"notifications/resources/updated\",\n  \"params\": {\n    \"uri\": \"file:///project/config.json\"\n  }\n}\n```\n\n### 8.4 ACP 中的实际消息\n\n```json\n// ACP 请求：发送用户提示\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 5,\n  \"method\": \"session/prompt\",\n  \"params\": {\n    \"sessionId\": \"sess_abc123\",\n    \"prompt\": [{ \"type\": \"text\", \"text\": \"修复这个 bug\" }]\n  }\n}\n\n// ACP 通知：取消当前操作\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"session/cancel\",\n  \"params\": {\n    \"sessionId\": \"sess_abc123\"\n  }\n}\n```\n\n---\n\n## 9. 与其他 RPC 协议对比\n\n| 协议           | 序列化      | 复杂度   | 可读性   | 适用场景                 |\n| ------------ | -------- | ----- | ----- | -------------------- |\n| **JSON-RPC** | JSON     | ★☆☆☆☆ | ✅ 极高  | 简单服务、跨语言、LSP/MCP/ACP |\n| **gRPC**     | Protobuf | ★★★★☆ | ❌ 不可读 | 高性能微服务、强类型           |\n| **XML-RPC**  | XML      | ★★☆☆☆ | ⚠️ 一般 | 遗留系统                 |\n| **SOAP**     | XML      | ★★★★★ | ⚠️ 极差 | 企业遗留系统               |\n| **REST**     | JSON/任意  | ★★☆☆☆ | ✅ 高   | Web API              |\n| **GraphQL**  | JSON     | ★★★☆☆ | ✅ 高   | 灵活查询、前端驱动            |\n\n### JSON-RPC 的取舍\n\n| 优势 | 劣势 |\n|------|------|\n| 极简，协议仅 10 页 | 无 Schema（无强类型校验） |\n| 人类可读，调试友好 | 文本编码比二进制慢 |\n| 传输无关（HTTP/stdio/WS/TCP） | 无流式控制（依赖传输层） |\n| 所有语言原生支持 JSON | 无内置服务发现 |\n| 批量请求减少往返 | 无压缩（纯文本） |\n| 通知机制（单向消息） | 无连接状态管理 |\n\n> JSON-RPC 选择了**简单**而非**性能**。它不适合每秒百万次的高频调用，但在 LSP/MCP/ACP 这类「人机交互速率」的场景中，简洁性远胜一切。\n\n---\n\n## 10. 在 AI Agent 中的特殊价值\n\n### 10.1 为什么 AI 协议都选 JSON-RPC\n\nLSP、MCP、ACP 不约而同选择 JSON-RPC 2.0 不是巧合：\n\n| 原因 | 说明 |\n|------|------|\n| **可读性** | AI 正在生成 JSON-RPC 调用时，可以「看到并理解」自己发了什么 |\n| **调试友好** | 开发者可以直接看日志中的 JSON 消息排查问题 |\n| **工具链成熟** | 几乎所有语言都有现成的 JSON 序列化库 |\n| **传输灵活** | stdio 用于本地进程，HTTP 用于远程——同一套协议 |\n| **与 LLM function calling 格式天然兼容** | OpenAI 的 function calling 本质就是结构化的 JSON |\n\n### 10.2 JSON-RPC 通知 = Agent 实时推送\n\nAgent 执行任务时，通过 JSON-RPC Notification 推送状态，客户端无需轮询：\n\n```json\n// Agent 通知：工具调用进度\n{ \"jsonrpc\": \"2.0\", \"method\": \"notifications/progress\",\n  \"params\": { \"token\": \"abc\", \"progress\": 50, \"total\": 100 } }\n\n// Agent 通知：状态变更\n{ \"jsonrpc\": \"2.0\", \"method\": \"session/update\",\n  \"params\": { \"sessionId\": \"xxx\", \"update\": { \"sessionUpdate\": \"agent_message_chunk\", ... } } }\n```\n\n---\n\n## 11. 总结\n\n| 维度 | 要点 |\n|------|------|\n| **本质** | 极简的远程过程调用协议，用 JSON 描述一切 |\n| **消息类型** | Request（有 id）、Response（有 result）、Error（有 error）、Notification（无 id） |\n| **批量请求** | 支持 JSON 数组一次发送多个请求 |\n| **错误码** | 5 个标准码（-32700 ~ -32603），支持自定义 |\n| **传输** | 协议无关——HTTP、stdio、WebSocket、TCP 都可以 |\n| **核心哲学** | **少即是多**——用最少的概念解决最核心的问题 |\n| **在 AI 协议栈中的位置** | LSP、MCP、ACP 的消息格式基础层 |\n\n> **一句话**：JSON-RPC 2.0 是 AI Agent 协议栈的「通用语言」——LSP 用它查询代码语义，MCP 用它调用远程工具，ACP 用它指挥 Agent。理解 JSON-RPC = 理解所有上层协议的共同语法。\n\n---\n\n> **延伸阅读**：\n> - JSON-RPC 2.0 官方规范：https://www.jsonrpc.org/specification\n> - 本项目相关文档：`Language Server Protocol 详解.md`、`Model Context Protocol 详解.md`、`Agent Client Protocol 详解.md`"}, {"id": 21, "room": "tongdian", "date": "2026-06-16", "title": "Language Server Protocol (LSP) 详解", "tags": [], "from": "Language Server Protocol 详解", "summary": "1. 背景：编辑器碎片化问题 1.1 在 LSP 出现之前 假设市面上有 M 种编程语言（Python、Go、Rust、TypeScript...）和 N 种编辑器/IDE（VS Code、Vim、Emacs、Sublime…", "content": "## 1. 背景：编辑器碎片化问题\n\n### 1.1 在 LSP 出现之前\n\n假设市面上有 **M** 种编程语言（Python、Go、Rust、TypeScript...）和 **N** 种编辑器/IDE（VS Code、Vim、Emacs、Sublime Text、JetBrains...）。每个编辑器想要支持每种语言的智能功能（自动补全、跳转定义、错误提示等），都需要为每种语言单独实现一套逻辑。\n\n这就是经典的 **M × N 问题**：\n\n```\n语言数量 M = 10，编辑器数量 N = 5\n需要的实现数量 = 10 × 5 = 50 套\n```\n\n每种语言在每种编辑器中都要重复实现解析器、类型检查器、自动补全引擎等。这显然是巨大的工程浪费。\n\n### 1.2 LSP 的解决方案\n\nLSP 的核心思想来自 **编译器前端/后端分离** 的经典设计：将「理解代码」这件事从编辑器中剥离出来，交给一个独立运行的 **语言服务器（Language Server）**。\n\n```\n┌──────────────┐     LSP (JSON-RPC)     ┌──────────────┐\n│               │ ◄──────────────────►  │               │\n│  Editor/IDE   │                        │   Language    │\n│  (Client)     │                        │   Server      │\n│               │                        │               │\n└──────────────┘                        └──────────────┘\n```\n\n这样，每种语言只需实现一个 Language Server，所有支持 LSP 的编辑器都能复用：\n\n```\n语言数量 M = 10，编辑器数量 N = 5\n需要的实现数量 = 10（Server）+ 5（Client 适配） = 15 套\n```\n\n---\n\n## 2. 核心概念\n\n### 2.1 三个角色\n\n| 角色 | 说明 | 例子 |\n|------|------|------|\n| **Language Server** | 理解某种编程语言的独立进程，提供代码智能服务 | `gopls`（Go）、`rust-analyzer`（Rust）、`pyright`（Python） |\n| **Language Client** | 嵌入在编辑器/IDE 中的插件，负责与 Server 通信并展示结果 | VS Code 的 LSP 扩展框架、Neovim 的 `nvim-lspconfig` |\n| **Protocol** | Client 与 Server 之间的通信约定，基于 JSON-RPC 2.0 | 由微软定义和维护的规范 |\n\n### 2.2 通信方式\n\nLSP 使用 **JSON-RPC 2.0** 作为消息格式，支持三种传输方式：\n\n- **Stdio**（标准输入/输出）：最常用，Server 作为子进程启动，通过 stdin/stdout 通信。简单可靠，无需网络配置。\n- **TCP Socket**：通过网络端口通信，适合远程开发场景。\n- **Pipe**（命名管道）：Windows 上常用。\n\n---\n\n## 3. 协议细节\n\n### 3.1 JSON-RPC 2.0 消息结构\n\nLSP 中的每一条消息都是一个 JSON-RPC 2.0 消息，分为四种类型：\n\n**Request（请求）** — 期待回复：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"textDocument/completion\",\n  \"params\": {\n    \"textDocument\": { \"uri\": \"file:///path/to/file.go\" },\n    \"position\": { \"line\": 10, \"character\": 15 }\n  }\n}\n```\n\n**Response（响应）** — 对请求的回复：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"result\": { }\n}\n```\n\n**Notification（通知）** — 无需回复：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"method\": \"textDocument/didOpen\",\n  \"params\": {\n    \"textDocument\": {\n      \"uri\": \"file:///path/to/file.go\",\n      \"languageId\": \"go\",\n      \"version\": 1,\n      \"text\": \"package main\\n\\n...\"\n    }\n  }\n}\n```\n\n**Error（错误响应）**：\n\n```json\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"error\": {\n    \"code\": -32601,\n    \"message\": \"Method not found\"\n  }\n}\n```\n\n### 3.2 关键设计原则\n\n- **无状态 vs 有状态**：Server 是有状态的——它会在内存中维护已打开文档的抽象语法树（AST）、符号表等。但协议层面不要求 Server 持久化这些状态。\n- **异步通信**：Client 和 Server 之间的消息是异步的。Client 可以连续发送多个请求而不等前一个返回。\n- **Server 推送**：Server 可以主动向 Client 推送诊断信息（错误/警告），无需 Client 轮询。\n- **取消机制**：通过 `$/cancelRequest` 通知取消仍在处理的请求（当用户在快速输入时，旧的补全请求可以被取消）。\n\n---\n\n## 4. 生命周期\n\nLSP 连接有严格的生命周期阶段：\n\n```\n初始化 → 运行 → 关闭\n```\n\n### 4.1 初始化握手\n\n```\nClient                                Server\n  │                                      │\n  │──── initialize ────────────────────► │  (客户端能力 + 工作区根路径)\n  │                                      │\n  │ ◄─── InitializeResult ───────────── │  (服务端能力)\n  │                                      │\n  │──── initialized (notification) ────► │  (握手完成，可以开始正常通信)\n  │                                      │\n```\n\n`initialize` 请求中，Client 声明自己能处理哪些功能（如 `completion`、`hover`、`definition` 等），Server 响应自己能提供哪些能力。双方取交集作为后续可用的功能。\n\n### 4.2 运行阶段\n\n初始化完成后进入运行阶段。主要活动包括：\n\n- **文档同步**：Client 通知 Server 文档的打开、修改、关闭\n- **请求响应**：Client 发送功能请求（补全、跳转等），Server 返回结果\n- **诊断推送**：Server 主动推送错误和警告\n\n### 4.3 关闭\n\n```\nClient ──── shutdown ────────► Server  (Server 停止服务，但进程仍存活)\nClient ◄──── result ────────── Server\nClient ──── exit (notification) ► Server  (Server 进程终止)\n```\n\n---\n\n## 5. 核心能力详解\n\n### 5.1 文档同步\n\n文档同步是所有功能的基础。有三种同步模式：\n\n| 模式 | 说明 | 适用场景 |\n|------|------|----------|\n| **Full** | 每次变更发送整个文档内容 | 简单实现，小文件 |\n| **Incremental** | 只发送变更的 diff（TextDocumentContentChangeEvent） | 大文件，高效 |\n| **None** | Server 只跟踪打开/关闭，不关心内容 | Server 不需要实时分析时 |\n\n**关键通知**：\n\n- `textDocument/didOpen` — 文档被打开\n- `textDocument/didChange` — 文档内容变更\n- `textDocument/didClose` — 文档被关闭\n- `textDocument/didSave` — 文档被保存\n\n### 5.2 诊断（Diagnostics）\n\nServer 分析代码后，主动通过 `textDocument/publishDiagnostics` 通知将诊断结果推送给 Client。\n\n```json\n{\n  \"uri\": \"file:///path/to/main.go\",\n  \"diagnostics\": [\n    {\n      \"range\": {\n        \"start\": { \"line\": 10, \"character\": 4 },\n        \"end\":   { \"line\": 10, \"character\": 8 }\n      },\n      \"severity\": 1,\n      \"code\": \"unused-var\",\n      \"source\": \"gopls\",\n      \"message\": \"variable 'foo' is declared but not used\"\n    }\n  ]\n}\n```\n\n- `severity`：1 = Error、2 = Warning、3 = Info、4 = Hint\n\n### 5.3 代码补全（Completion）\n\n用户输入时，Client 发送补全请求，Server 返回候选列表。\n\n**触发方式**：\n\n- **手动触发**：用户按 Ctrl+Space\n- **自动触发**：输入特定字符（如 `.`、`->`）时自动弹出\n\n**补全项结构**：\n\n```json\n{\n  \"label\": \"fmt.Println\",\n  \"kind\": 3,\n  \"detail\": \"func Println(a ...any) (n int, err error)\",\n  \"documentation\": \"Println formats using the default formats...\",\n  \"insertText\": \"Println(${1:args})\",\n  \"insertTextFormat\": 2\n}\n```\n\n- `kind`：`CompletionItemKind` 枚举，定义了 ~25 种补全类型\n- `insertTextFormat = 2`：表示支持 Snippet 语法（占位符 `${1:...}`）\n\n`CompletionItemKind` 枚举完整列表：\n\n| 值 | 名称 | 说明 |\n|----|------|------|\n| 1 | Text | 纯文本 |\n| 2 | Method | 方法 |\n| 3 | Function | 函数 |\n| 4 | Constructor | 构造函数 |\n| 5 | Field | 字段 |\n| 6 | Variable | 变量 |\n| 7 | Class | 类 |\n| 8 | Interface | 接口 |\n| 9 | Module | 模块 |\n| 10 | Property | 属性 |\n| 11 | Unit | 单元 |\n| 12 | Value | 值 |\n| 13 | Enum | 枚举 |\n| 14 | Keyword | 关键字 |\n| 15 | Snippet | 代码片段 |\n| 16 | Color | 颜色 |\n| 17 | File | 文件 |\n| 18 | Reference | 引用 |\n| 19 | Folder | 文件夹 |\n| 20 | EnumMember | 枚举成员 |\n| 21 | Constant | 常量 |\n| 22 | Struct | 结构体 |\n| 23 | Event | 事件 |\n| 24 | Operator | 操作符 |\n| 25 | TypeParameter | 类型参数 |\n\n### 5.4 悬停提示（Hover）\n\n光标悬停在符号上时，Server 返回类型信息和文档注释。\n\n```json\n// 请求\n{ \"method\": \"textDocument/hover\", \"params\": {\n    \"textDocument\": {\"uri\": \"file:///main.go\"},\n    \"position\": {\"line\": 5, \"character\": 10}\n}}\n\n// 响应\n{\n  \"contents\": {\n    \"kind\": \"markdown\",\n    \"value\": \"```go\\nfunc fmt.Println(a ...interface{}) (n int, err error)\\n```\\n\\n---\\n\\nPrintln writes to standard output...\"\n  },\n  \"range\": { }\n}\n```\n\n### 5.5 跳转定义（Go to Definition）\n\n```json\n// 请求\n{ \"method\": \"textDocument/definition\", \"params\": {\n    \"textDocument\": {\"uri\": \"file:///main.go\"},\n    \"position\": {\"line\": 5, \"character\": 10}\n}}\n\n// 响应：可以返回单个或多个 Location\n{\n  \"uri\": \"file:///path/to/fmt/print.go\",\n  \"range\": {\n    \"start\": {\"line\": 254, \"character\": 5},\n    \"end\":   {\"line\": 261, \"character\": 1}\n  }\n}\n```\n\n类似的跳转能力：\n\n- `textDocument/declaration` — 跳转到声明\n- `textDocument/typeDefinition` — 跳转到类型定义\n- `textDocument/implementation` — 跳转到接口实现\n- `textDocument/references` — 查找所有引用\n\n### 5.6 代码重构\n\n| 方法 | 说明 |\n|------|------|\n| `textDocument/rename` | 重命名符号（全局替换所有引用） |\n| `textDocument/formatting` | 格式化整个文档 |\n| `textDocument/rangeFormatting` | 格式化选中范围 |\n| `textDocument/codeAction` | 代码操作（快速修复、自动导入等） |\n| `workspace/executeCommand` | 执行自定义命令（如 `goimports`） |\n\n**CodeAction 示例**：当出现「未使用的变量」诊断时，Server 可以返回一个「移除该变量」的快速修复。\n\n### 5.7 其他重要能力\n\n| 类别 | 方法 | 说明 |\n|------|------|------|\n| 文档链接 | `textDocument/documentLink` | 识别文档中的 URL，支持 Ctrl+Click 打开 |\n| 代码高亮 | `textDocument/documentHighlight` | 高亮当前符号的所有出现位置 |\n| 折叠区域 | `textDocument/foldingRange` | 提供可折叠的代码块范围 |\n| 签名帮助 | `textDocument/signatureHelp` | 函数调用时显示参数签名提示 |\n| 代码透镜 | `textDocument/codeLens` | 在代码行上方显示可操作提示（如引用计数、运行测试按钮） |\n| 语义标记 | `textDocument/semanticTokens` | 提供更精细的语法高亮（比正则匹配更准确） |\n| 链接编辑 | `textDocument/linkedEditingRange` | 同时编辑配对的标签（如 HTML 开闭标签） |\n| 内联提示 | `textDocument/inlayHint` | 在代码中内嵌显示类型推断、参数名等提示 |\n\n### 5.8 工作区能力\n\n除了针对单个文档的操作，LSP 还支持工作区级别的功能：\n\n| 方法 | 说明 |\n|------|------|\n| `workspace/symbol` | 工作区符号搜索（模糊匹配，类似 Ctrl+T） |\n| `workspace/didChangeWatchedFiles` | 文件系统变更通知 |\n| `workspace/didChangeConfiguration` | 配置变更通知 |\n\n---\n\n## 6. 关键数据结构\n\n### 6.1 Position（位置）\n\n```typescript\ninterface Position {\n  line: number;      // 从 0 开始的行号\n  character: number; // 从 0 开始的列号（UTF-16 编码偏移）\n}\n```\n\n> **重要**：`character` 使用 UTF-16 编码偏移，而非 Unicode 码点或字节偏移。\n> 这意味着一个 Emoji 字符（如 👨‍👩‍👧‍👦）可能占用多个 character 单位。\n\n### 6.2 Range（范围）\n\n```typescript\ninterface Range {\n  start: Position;  // 起始位置（包含）\n  end: Position;    // 结束位置（不包含）\n}\n```\n\n### 6.3 Location（位置信息）\n\n```typescript\ninterface Location {\n  uri: string;    // 文档 URI，如 \"file:///path/to/file.go\"\n  range: Range;   // 在文档中的范围\n}\n```\n\n### 6.4 TextEdit（文本编辑）\n\n```typescript\ninterface TextEdit {\n  range: Range;      // 要替换的范围\n  newText: string;   // 新文本内容\n}\n```\n\n### 6.5 TextDocumentIdentifier（文档标识符）\n\n```typescript\ninterface TextDocumentIdentifier {\n  uri: string;   // 文档的 URI，必须是 file:// 或 untitled: 等 scheme\n}\n```\n\n### 6.6 Diagnostic（诊断信息）\n\n```typescript\ninterface Diagnostic {\n  range: Range;\n  severity?: DiagnosticSeverity;   // 1=Error, 2=Warning, 3=Info, 4=Hint\n  code?: number | string;\n  source?: string;                  // 来源标识，如 \"gopls\", \"pyright\"\n  message: string;\n  tags?: DiagnosticTag[];          // 1=Unnecessary, 2=Deprecated\n  relatedInformation?: DiagnosticRelatedInformation[];\n  data?: unknown;                  // 用于 codeAction 时的上下文传递\n}\n```\n\n---\n\n## 7. 主流实现\n\n### 7.1 知名的 Language Server\n\n| Server | 语言 | 特点 |\n|--------|------|------|\n| **gopls** | Go | Go 团队官方维护，深度理解 Go 模块系统 |\n| **rust-analyzer** | Rust | Rust 社区事实标准，速度快，功能全面 |\n| **pyright** | Python | 微软开发，类型检查严格 |\n| **Pylance** | Python | 基于 Pyright，增加了 AI 辅助补全 |\n| **TypeScript Language Server** | TypeScript/JS | 微软维护，与 VS Code 深度集成 |\n| **clangd** | C/C++ | 基于 Clang/LLVM，提供精确的符号解析 |\n| **jdtls** | Java | Eclipse JDT 的 LSP 封装 |\n| **OmniSharp** | C# | .NET 生态的 LSP 实现 |\n| **terraform-ls** | Terraform/HCL | HashiCorp 官方维护 |\n| **lua-language-server** | Lua | 社区维护，用于 Neovim 等配置 |\n| **bash-language-server** | Bash | Shell 脚本的智能支持 |\n| **marksman** | Markdown | Markdown 文件引用跳转和补全 |\n| **yaml-language-server** | YAML | 基于 JSON Schema 的验证和补全 |\n\n### 7.2 知名的 LSP Client / 编辑器集成\n\n| Client | 说明 |\n|--------|------|\n| **VS Code** | LSP 的诞生地，内置最完整的 LSP Client 支持 |\n| **Neovim** | 通过 `nvim-lspconfig` 内置 LSP Client |\n| **Emacs** | `lsp-mode` 和 `eglot` |\n| **Sublime Text** | 通过 `LSP` 插件支持 |\n| **JetBrains IDE** | 有 LSP 插件，但更倾向用自身的 PSI 体系 |\n| **Helix** | 新一代模态编辑器，内置 LSP 支持 |\n| **Zed** | Rust 开发的高性能编辑器，原生 LSP 集成 |\n\n---\n\n## 8. LSP 与 AI/Agent 的关系\n\n作为一个主要关注 AI Agent 方向的学习者，这部分尤为重要。\n\n### 8.1 LSP 为 AI 编码助手提供代码理解能力\n\n现代的 AI 编码助手（GitHub Copilot、Cursor、Claude Code、Cody 等）在做代码生成和修改时，严重依赖 LSP 提供上下文信息：\n\n- **获取当前文件的符号表**：知道有哪些函数、类型、变量，才能生成一致的代码\n- **获取诊断信息**：发现当前代码的错误，帮助 AI 更准确地定位和修复问题\n- **获取引用关系**：修改一个函数时，知道哪些地方调用了它，避免破坏性修改\n- **获取类型信息**：生成代码时保持类型一致\n\n### 8.2 Claude Code 中的 LSP\n\nClaude Code 使用了 LSP 来增强代码理解能力。在 `settings.json` 中可以配置 LSP 集成：\n\n```json\n{\n  \"lsp\": {\n    \"servers\": {\n      \"gopls\": {\n        \"command\": \"gopls\",\n        \"args\": [\"-mode=stdio\"]\n      }\n    }\n  }\n}\n```\n\n这使得 Claude Code 在修改代码时，能够像人类开发者一样感知到代码的语义信息，而不仅仅是文本。\n\n### 8.3 作为协议思想的参考\n\nLSP 的设计思想对 AI Agent 工程有重要借鉴意义：\n\n| LSP 思想 | Agent 类比 |\n|----------|------------|\n| Client-Server 分离 | Agent 框架中 tool/runtime 和执行环境的分离 |\n| JSON-RPC 通信 | MCP (Model Context Protocol) 也基于 JSON-RPC，受 LSP 直接影响 |\n| 能力协商（Capability Negotiation） | Agent 与 Tool 之间的能力注册与匹配 |\n| 异步推送诊断 | Agent 执行任务时的实时状态推送 |\n| 无状态的协议 + 有状态的 Server | Agent 会话管理策略 |\n\n> **MCP (Model Context Protocol)** 是 Anthropic 推出的 AI 协议，其设计直接借鉴了 LSP。MCP 将 LSP 的「编辑器 ↔ 语言服务器」模式迁移到「AI 应用 ↔ 上下文服务器」模式。理解 LSP 是理解 MCP 的绝佳前置知识。\n\n---\n\n## 9. LSP 扩展与变体\n\n### 9.1 DAP (Debug Adapter Protocol)\n\nLSP 的成功催生了相同理念的 **调试适配器协议（DAP）**，用于统一编辑器和调试器之间的通信：\n\n```\nLSP: 编辑器 ↔ 语言服务器  →  代码智能\nDAP: 编辑器 ↔ 调试适配器  →  断点调试\n```\n\n### 9.2 LSP 3.17+ 新特性\n\n- **Type Hierarchy**：显示类型的继承层次结构\n- **Inline Values**：调试时在代码旁显示变量值\n- **Inline Completion**：内联补全（逐词补全，而非整项补全）\n- **Diagnostic Pull Model**：除了 Server 推送，Client 也可以主动拉取诊断\n- **Notebook Support**：支持 Jupyter Notebook 等交互式文档\n\n### 9.3 LSIF (Language Server Index Format)\n\nLSIF 是一种将 LSP 的交互式查询结果「固化」为静态索引文件的格式，用于代码托管平台的代码导航。GitHub、GitLab 等用它来在 Web 界面上提供「跳转定义」功能，而不需要运行 Language Server。\n\n---\n\n## 10. 动手实践建议\n\n理解 LSP 最好的方式是亲自跑一个 Language Server 并观察通信过程：\n\n```bash\n# 1. 安装一个 Language Server（以 gopls 为例）\ngo install golang.org/x/tools/gopls@latest\n\n# 2. 手动启动并观察 JSON-RPC 通信\n# 在终端中启动 gopls（stdin/stdout 模式）\necho '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\n  \"processId\":null,\n  \"rootUri\":\"file:///tmp/test\",\n  \"capabilities\":{}\n}}' | gopls -mode=stdio\n\n# 3. 你会看到 Server 返回的 InitializeResult\n```\n\n> 也可以用 `lsp-devtools` 或 VS Code 的 \"LSP Inspector\" 功能来可视化监控 LSP 消息。\n\n---\n\n## 11. 总结\n\n| 维度 | 要点 |\n|------|------|\n| **解决什么问题** | M×N 问题：统一语言智能功能的接口标准 |\n| **核心思想** | 将「理解代码」从编辑器中剥离为独立进程 |\n| **通信协议** | JSON-RPC 2.0（Request/Response/Notification + Error） |\n| **传输方式** | Stdio（最常用）、TCP、Pipe |\n| **核心能力** | 补全、诊断、跳转定义、悬停提示、重构、格式化等 |\n| **与你学习方向的关系** | MCP 直接继承 LSP 思想；AI 编码工具深度依赖 LSP |\n\n---\n\n> **延伸阅读**：\n> - 官方规范：https://microsoft.github.io/language-server-protocol/specifications/lsp/3.17/specification/\n> - MCP 规范：https://modelcontextprotocol.io/\n> - `langserver.org`：社区维护的 LSP Server 列表"}, {"id": 22, "room": "tongdian", "date": "2026-06-16", "title": "Model Context Protocol (MCP) 详解", "tags": [], "from": "Model Context Protocol 详解", "summary": "1. 背景：LLM 的「信息孤岛」问题 1.1 问题描述 大语言模型（LLM）本身是一个封闭系统。它能回答问题，但知识截止于训练数据。当 AI 应用需要访问外部数据（数据库、API、文件系统、第三方服务）时，传统做法是每个应用各自实现一套集成代码。 这就产生了类似 LSP…", "content": "## 1. 背景：LLM 的「信息孤岛」问题\n\n### 1.1 问题描述\n\n大语言模型（LLM）本身是一个封闭系统。它能回答问题，但知识截止于训练数据。当 AI 应用需要访问外部数据（数据库、API、文件系统、第三方服务）时，传统做法是每个应用各自实现一套集成代码。\n\n这就产生了类似 LSP 诞生前的 M×N 问题：\n\n```\n数据源 M = 10（数据库、GitHub、Slack、文件系统...）\nAI 应用 N = 5（Claude Desktop、Cursor、自定义 Agent...）\n需要的集成数量 = 10 × 5 = 50 套\n```\n\n### 1.2 MCP 的解决方案\n\nMCP 由 Anthropic 于 2024 年底推出，核心理念直接继承自 LSP：\n\n> **用统一的协议，让任何 AI 应用（Host）都能通过标准接口连接任何数据源（Server），获取上下文信息。**\n\n```\n┌──────────────┐     MCP (JSON-RPC)      ┌──────────────┐\n│               │ ◄────────────────────►  │               │\n│  AI 应用       │                         │  MCP Server   │\n│  (Host/Client) │                         │  (数据源)      │\n│               │                         │               │\n│  如：Claude    │                         │  如：GitHub    │\n│  Desktop       │                         │  API、数据库    │\n│  Cursor        │                         │  文件系统等     │\n└──────────────┘                         └──────────────┘\n```\n\n效果：\n\n```\n数据源 M = 10，AI 应用 N = 5\n需要的集成数量 = 10（MCP Server）+ 5（Host 适配） = 15 套\n```\n\n### 1.3 MCP 与 LSP 的关系\n\nMCP 受 LSP 直接启发，但不是 LSP 的「变体」，而是同一理念在不同领域的应用：\n\n| 维度 | LSP | MCP |\n|------|-----|-----|\n| 提出者 | 微软 (2016) | Anthropic (2024) |\n| 解决的问题 | 编辑器 ↔ 语言服务的集成碎片化 | AI 应用 ↔ 数据源的集成碎片化 |\n| Server 提供什么 | 代码智能（补全、诊断、跳转） | 上下文（资源、工具、提示模板） |\n| Client（消费者） | 编辑器/IDE | AI 模型 / AI 应用 |\n| 传输层 | stdio, TCP, Pipe | stdio, SSE (HTTP) |\n| 消息格式 | JSON-RPC 2.0 | JSON-RPC 2.0 |\n| 能力协商 | ✅ | ✅ |\n| Server 推送 | ✅ 诊断推送 | ✅ 资源变更通知 |\n\n> 可以说：**MCP 就是「LLM 时代的 LSP」**。\n\n---\n\n## 2. 核心架构\n\n### 2.1 三角模型\n\nMCP 架构包含三个角色，与 LSP 有所不同：\n\n```\n┌──────────────────────────────────────────────────────┐\n│                    MCP Host                           │\n│  ┌──────────┐  ┌──────────┐  ┌──────────┐           │\n│  │ Claude   │  │ Cursor   │  │ 自建Agent │           │\n│  │ Desktop  │  │          │  │          │           │\n│  └────┬─────┘  └────┬─────┘  └────┬─────┘           │\n│       │             │             │                  │\n│       │     ┌───────┴───────┐     │                  │\n│       │     │               │     │                  │\n│       └────►│  MCP Client   │◄────┘                  │\n│             │  (协议层)       │                        │\n│             └───────┬───────┘                        │\n└─────────────────────┼────────────────────────────────┘\n                      │ MCP (JSON-RPC 2.0)\n          ┌───────────┼───────────┐\n          │           │           │\n    ┌─────┴─────┐ ┌───┴───┐ ┌───┴─────────┐\n    │  MCP      │ │ MCP   │ │  MCP        │\n    │  Server A │ │Server │ │  Server C    │\n    │ (数据库)   │ │(文件)  │ │  (第三方API) │\n    └───────────┘ └───────┘ └─────────────┘\n```\n\n### 2.2 角色定义\n\n| 角色 | 说明 | 示例 |\n|------|------|------|\n| **MCP Host** | 实际的 AI 应用，集成 LLM 并与用户交互 | Claude Desktop、Cursor、自建聊天应用 |\n| **MCP Client** | 协议客户端层，与 MCP Server 建立一对一连接。一个 Host 可以有多个 Client，每个 Client 连接一个 Server | Host 内部使用的库（如 `mcp` Python SDK） |\n| **MCP Server** | 轻量级服务，通过 MCP 暴露特定能力 | GitHub Server、Postgres Server、Filesystem Server |\n\n> **关键区别**：LSP 中 Client 是编辑器插件、Server 是语言服务器。MCP 中 Client 被嵌入在 Host 内部，Server 是数据/工具提供方。两者概念恰好「错位」了。\n\n---\n\n## 3. 核心原语（Primitives）\n\nMCP Server 通过三种核心原语向 AI 模型暴露能力：\n\n```\n┌─────────────────────────────────────────────────────┐\n│                  MCP Server                          │\n│                                                     │\n│  ┌───────────┐  ┌───────────┐  ┌───────────────┐   │\n│  │ Resources │  │   Tools   │  │   Prompts     │   │\n│  │  (资源)    │  │  (工具)    │  │   (提示模板)   │   │\n│  └─────┬─────┘  └─────┬─────┘  └──────┬────────┘   │\n│        │              │               │             │\n│        ▼              ▼               ▼             │\n│  ┌─────────────────────────────────────────────┐   │\n│  │         MCP Client → AI 模型                  │   │\n│  └─────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────┘\n```\n\n### 3.1 Resources（资源）\n\nResources 是 **只读** 的数据，类似 REST API 中的 GET 端点。AI 模型可以读取但不能修改。\n\n**两种类型**：\n\n| 类型 | 说明 | 示例 |\n|------|------|------|\n| **TextResourceContents** | 文本内容（UTF-8 字符串） | 数据库查询结果、API 返回值、文件内容 |\n| **BlobResourceContents** | 二进制内容（Base64 编码） | 图片、PDF、音频文件 |\n\n**资源寻址**：每个 Resource 有一个唯一的 URI：\n\n```\nfile:///home/user/project/README.md    # 文件系统中的文件\npostgres://database/users/table        # 数据库中的表\ngithub://owner/repo/issues/42          # GitHub Issue\n```\n\n**资源模板**：支持参数化的 URI 模板，用于动态资源：\n\n```\ngithub://owner/repo/issues/{issue_number}   # 动态 GitHub Issue\nfile:///project/src/{module}/__init__.py   # 动态文件路径\n```\n\n**资源能力**：\n- `resources/list` — 列出所有可用资源\n- `resources/read` — 读取指定资源\n- `resources/subscribe` — 订阅资源变更通知\n- `notifications/resources/updated` — 资源变更时 Server 推送通知\n\n### 3.2 Tools（工具）\n\nTools 是 **可执行的操作**，允许 AI 模型**修改状态或产生副作用**。这是 MCP 区别于纯数据协议的关键能力。\n\n| 特性 | 说明 |\n|------|------|\n| **模型可见** | Tool 的 name、description、inputSchema 直接暴露给 LLM 作为 function calling 的候选 |\n| **用户确认** | 执行前 Host 可以向用户请求确认（安全机制） |\n| **有副作用** | 可以创建文件、发送消息、修改数据库等 |\n\n**Tool 定义示例**：\n\n```json\n{\n  \"name\": \"create_issue\",\n  \"description\": \"在 GitHub 仓库中创建一个 Issue\",\n  \"inputSchema\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"owner\": { \"type\": \"string\", \"description\": \"仓库所有者\" },\n      \"repo\": { \"type\": \"string\", \"description\": \"仓库名\" },\n      \"title\": { \"type\": \"string\", \"description\": \"Issue 标题\" },\n      \"body\": { \"type\": \"string\", \"description\": \"Issue 描述（Markdown）\" }\n    },\n    \"required\": [\"owner\", \"repo\", \"title\"]\n  }\n}\n```\n\n**工具相关的方法**：\n- `tools/list` — 列出所有可用工具及其 inputSchema\n- `tools/call` — 调用指定工具，传入参数，获取执行结果\n\n**Tool 的执行流**：\n\n```\n用户提问 \"帮我给项目创建一个 Issue\"\n        │\n        ▼\nHost 将 Tool 列表（含 inputSchema）发送给 LLM\n        │\n        ▼\nLLM 决定调用 create_issue(owner=\"foo\", repo=\"bar\", title=\"...\")\n        │\n        ▼\nHost 通过 MCP Client 调用 Server: tools/call\n        │\n        ▼\nMCP Server 执行创建，返回结果 { \"issue_url\": \"https://...\" }\n        │\n        ▼\nHost 将结果返回 LLM，LLM 向用户汇报\n```\n\n### 3.3 Prompts（提示模板）\n\nPrompts 是**可复用的提示词模板**，由 Server 预定义，支持参数化。\n\n**用途**：\n- 标准化常见交互的提示词格式\n- 让 AI 以特定角色或风格回复\n- 提供上下文增强模板（如「分析这个代码库」+ 注入文件列表）\n\n**Prompt 定义示例**：\n\n```json\n{\n  \"name\": \"code_review\",\n  \"description\": \"对指定文件进行代码审查\",\n  \"arguments\": [\n    {\n      \"name\": \"file_path\",\n      \"description\": \"要审查的文件路径\",\n      \"required\": true\n    },\n    {\n      \"name\": \"language\",\n      \"description\": \"编程语言\",\n      \"required\": false\n    }\n  ]\n}\n```\n\n当用户选择这个 Prompt 时，Server 返回具体的提示词内容（可能是多轮消息），然后由 LLM 处理。\n\n**提示相关方法**：\n- `prompts/list` — 列出所有可用提示模板\n- `prompts/get` — 获取指定提示的详细信息\n\n---\n\n## 4. 协议细节\n\n### 4.1 传输层（Transport）\n\nMCP 支持两种传输方式：\n\n| 传输方式 | 适用场景 | 特点 |\n|---------|---------|------|\n| **stdio** | 本地进程通信 | 简单可靠，Server 作为子进程启动 |\n| **SSE (Server-Sent Events)** | 远程通信 | 基于 HTTP，支持认证，Server 独立部署 |\n\n**stdio 模式**：\n\n```bash\n# 启动 MCP Server（以 filesystem server 为例）\nnpx -y @modelcontextprotocol/server-filesystem /path/to/allowed/dir\n```\n\nHost 启动 Server 子进程，通过 stdin 发送 JSON-RPC 请求，stdout 接收响应。\n\n**SSE 模式**：\n\n```\nPOST /sse HTTP/1.1              ← Client 建立 SSE 连接（接收 Server → Client 消息）\nHost: mcp-server.example.com\n\nPOST /messages HTTP/1.1         ← Client 发送 Client → Server 消息\nContent-Type: application/json\n\n{\"jsonrpc\":\"2.0\",\"method\":\"tools/call\",...}\n```\n\nSSE 模式需要先建立事件流通道，再通过独立的 HTTP endpoint 发送消息。适合 Server 独立部署的远程场景。\n\n### 4.2 消息格式\n\n与 LSP 完全相同，使用 JSON-RPC 2.0。支持四种消息类型：\n\n```json\n// Request\n{ \"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/call\", \"params\": { ... } }\n\n// Response\n{ \"jsonrpc\": \"2.0\", \"id\": 1, \"result\": { ... } }\n\n// Notification\n{ \"jsonrpc\": \"2.0\", \"method\": \"notifications/resources/updated\", \"params\": { ... } }\n\n// Error\n{ \"jsonrpc\": \"2.0\", \"id\": 1, \"error\": { \"code\": -32000, \"message\": \"...\" } }\n```\n\n### 4.3 生命周期\n\n与 LSP 几乎一致：\n\n```\n初始化 → 运行 → 关闭\n```\n\n1. **初始化阶段**：\n\n```\nClient ──── initialize ──────────► Server  (能力声明)\nClient ◄──── InitializeResult ──── Server  (服务端能力 + 协议版本)\nClient ──── initialized (notif) ──► Server  (握手完成)\n```\n\n2. **运行阶段**：正常的资源读取、工具调用、提示获取\n3. **关闭阶段**：`shutdown` 请求 + `exit` 通知\n\n### 4.4 能力协商（Capability Negotiation）\n\nMCP 的 `initialize` 阶段与 LSP 一样，双方声明能力。\n\n**ServerCapabilities**：\n\n```json\n{\n  \"resources\": {\n    \"subscribe\": true,        // 支持资源变更订阅\n    \"listChanged\": true       // 支持资源列表变更通知\n  },\n  \"tools\": {\n    \"listChanged\": true       // 支持工具列表变更通知\n  },\n  \"prompts\": {\n    \"listChanged\": true       // 支持提示列表变更通知\n  }\n}\n```\n\n**ClientCapabilities**：\n\n```json\n{\n  \"roots\": {\n    \"listChanged\": true       // 支持根目录列表变更\n  },\n  \"sampling\": {}              // 支持 LLM 采样（让 Server 请求 Client 调用 LLM）\n}\n```\n\n---\n\n## 5. 高级特性\n\n### 5.1 Sampling（反向 LLM 调用）\n\n这是一个强大但容易被忽略的特性：**MCP Server 可以请求 MCP Client 帮它调用 LLM**。\n\n```\n                    通常方向\n  MCP Client ──────────────────────► MCP Server\n            (发送请求)\n\n                    Sampling 方向\n  MCP Client ◄────────────────────── MCP Server\n            (Server 请求 Client 调用 LLM)\n```\n\n**使用场景**：\n- Server 需要「智能处理」：如 Server 获取了大量数据，需要 LLM 来总结\n- Server 作为 Agent 的中间层：先获取数据，让 LLM 分析，再决定下一步\n\n**方法**：`sampling/createMessage`\n\n### 5.2 Roots（根目录）\n\nServer 可以请求 Host 提供「项目根目录」信息，了解哪些文件对用户重要。\n\n```\nServer  ──── roots/list ────────► Client\nClient  ◄─── [{uri: \"file:///project\"}, ...] ──── Server\n```\n\n### 5.3 通知（Notifications）\n\nServer 可以主动推送通知：\n\n| 通知 | 说明 |\n|------|------|\n| `notifications/resources/updated` | 资源内容变更 |\n| `notifications/resources/list_changed` | 资源列表变更 |\n| `notifications/tools/list_changed` | 工具列表变更 |\n| `notifications/prompts/list_changed` | 提示列表变更 |\n\n这让 Server 可以动态地变化可用的资源和工具，无需重启。\n\n### 5.4 Progress（进度报告）\n\n长时间操作（如大文件读取）可以通过 `notifications/progress` 推送进度：\n\n```json\n{\n  \"method\": \"notifications/progress\",\n  \"params\": {\n    \"progressToken\": \"abc123\",\n    \"progress\": 50,\n    \"total\": 100\n  }\n}\n```\n\n---\n\n## 6. MCP 与 Tool Calling / Function Calling 的关系\n\n这是最容易混淆的概念，需要清晰区分：\n\n| 维度 | MCP | OpenAI Function Calling |\n|------|-----|------------------------|\n| **层级** | 协议层（传输 + 发现 + 执行） | API 层（LLM 输出格式） |\n| **谁定义工具** | MCP Server（动态发现） | 开发者手动定义 |\n| **工具发现** | `tools/list` 动态获取 | 每次请求手动传入 tools 参数 |\n| **工具执行** | MCP Client → MCP Server 链路 | 开发者自己实现函数调用逻辑 |\n| **通用性** | 跨模型、跨平台 | 仅限支持该格式的模型 |\n| **认证/安全** | 协议内建支持（OAuth 等） | 开发者自建 |\n\n**两者是互补关系**，不是取代：\n\n```\n┌──────────────────────────────────────────────────┐\n│                 AI 应用 (Host)                     │\n│                                                   │\n│   ① MCP Client 从 Server 获取 Tool 列表            │\n│   ② 将 Tool 转为 LLM 能理解的 function calling 格式 │\n│   ③ LLM 返回 function call                        │\n│   ④ MCP Client 通过 tools/call 执行                │\n└──────────────────────────────────────────────────┘\n```\n\n也就是说，**MCP 负责工具的发现和执行，Function Calling 负责让 LLM 选择和调用工具**。\n\n---\n\n## 7. MCP SDK\n\n### 7.1 Python SDK\n\n官方提供 `mcp` Python 包：\n\n```bash\npip install mcp\n```\n\n**创建 MCP Server**：\n\n```python\nfrom mcp.server import Server, NotificationOptions\nfrom mcp.server.models import InitializationCapabilities\nfrom mcp.server.stdio import stdio_server\nimport mcp.types as types\n\n# 创建 Server 实例\nserver = Server(\"my-server\")\n\n@server.list_tools()\nasync def handle_list_tools() -> list[types.Tool]:\n    return [\n        types.Tool(\n            name=\"get_weather\",\n            description=\"获取指定城市的天气\",\n            inputSchema={\n                \"type\": \"object\",\n                \"properties\": {\n                    \"city\": {\"type\": \"string\", \"description\": \"城市名\"}\n                },\n                \"required\": [\"city\"]\n            }\n        )\n    ]\n\n@server.call_tool()\nasync def handle_call_tool(\n    name: str, arguments: dict\n) -> list[types.TextContent | types.ImageContent | types.EmbeddedResource]:\n    if name == \"get_weather\":\n        city = arguments[\"city\"]\n        # 调用真正的天气 API\n        weather = f\"{city} 今天晴天，25°C\"\n        return [types.TextContent(type=\"text\", text=weather)]\n    raise ValueError(f\"Unknown tool: {name}\")\n\nasync def main():\n    async with stdio_server() as (read_stream, write_stream):\n        await server.run(\n            read_stream,\n            write_stream,\n            InitializationCapabilities(\n                sampling={},  # 不需要 sampling\n            ),\n        )\n\nif __name__ == \"__main__\":\n    import asyncio\n    asyncio.run(main())\n```\n\n**关键装饰器**：\n| 装饰器 | 用途 |\n|--------|------|\n| `@server.list_resources()` | 列出资源 |\n| `@server.read_resource()` | 读取资源 |\n| `@server.list_tools()` | 列出工具 |\n| `@server.call_tool()` | 执行工具 |\n| `@server.list_prompts()` | 列出提示 |\n| `@server.get_prompt()` | 获取提示详情 |\n\n### 7.2 TypeScript SDK\n\n```bash\nnpm install @modelcontextprotocol/sdk\n```\n\n```typescript\nimport { Server } from \"@modelcontextprotocol/sdk/server/index.js\";\nimport { StdioServerTransport } from \"@modelcontextprotocol/sdk/server/stdio.js\";\n\nconst server = new Server(\n  { name: \"my-server\", version: \"1.0.0\" },\n  { capabilities: { tools: {} } }\n);\n\nserver.setRequestHandler(\"tools/list\", async () => ({\n  tools: [{\n    name: \"get_weather\",\n    description: \"获取指定城市的天气\",\n    inputSchema: {\n      type: \"object\",\n      properties: {\n        city: { type: \"string\", description: \"城市名\" }\n      },\n      required: [\"city\"]\n    }\n  }]\n}));\n\nconst transport = new StdioServerTransport();\nawait server.connect(transport);\n```\n\n---\n\n## 8. 主流 MCP Server 实现\n\n### 8.1 官方提供\n\n| Server | 功能 |\n|--------|------|\n| **@modelcontextprotocol/server-filesystem** | 安全的文件系统读写 |\n| **@modelcontextprotocol/server-github** | GitHub API（Issue、PR、仓库操作） |\n| **@modelcontextprotocol/server-postgres** | PostgreSQL 数据库只读查询 |\n| **@modelcontextprotocol/server-sqlite** | SQLite 数据库操作 |\n| **@modelcontextprotocol/server-git** | Git 仓库操作 |\n| **@modelcontextprotocol/server-brave-search** | Brave 搜索引擎 |\n| **@modelcontextprotocol/server-google-maps** | Google Maps API |\n| **@modelcontextprotocol/server-memory** | 知识图谱形式的持久化记忆 |\n| **@modelcontextprotocol/server-slack** | Slack 消息和频道管理 |\n| **@modelcontextprotocol/server-puppeteer** | 浏览器自动化（截图、爬取、交互） |\n| **@modelcontextprotocol/server-sequential-thinking** | 多步骤推理辅助 |\n| **@modelcontextprotocol/server-everart** | AI 图像生成 |\n| **@modelcontextprotocol/server-fetch** | HTTP 请求工具 |\n\n### 8.2 社区生态\n\n社区贡献了大量的 MCP Server，覆盖各种数据源和服务集成。典型场景：\n\n- 数据库：MySQL、MongoDB、Redis、Elasticsearch\n- 云服务：AWS、GCP、Azure\n- API 集成：Notion、Airtable、Linear、Jira\n- 开发工具：Docker、Kubernetes、Terraform\n- AI 工具：LangChain、LlamaIndex\n\n---\n\n## 9. Claude Desktop 中的 MCP 配置示例\n\nClaude Desktop 是 MCP 最广泛使用的 Host 应用。配置方式：\n\n```json\n{\n  \"mcpServers\": {\n    \"filesystem\": {\n      \"command\": \"npx\",\n      \"args\": [\n        \"-y\",\n        \"@modelcontextprotocol/server-filesystem\",\n        \"/Users/me/Documents\",\n        \"/Users/me/Projects\"\n      ]\n    },\n    \"github\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@modelcontextprotocol/server-github\"],\n      \"env\": {\n        \"GITHUB_PERSONAL_ACCESS_TOKEN\": \"ghp_xxxxxxxxxxxx\"\n      }\n    },\n    \"postgres\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@modelcontextprotocol/server-postgres\"],\n      \"env\": {\n        \"DATABASE_URL\": \"postgresql://user:pass@localhost:5432/mydb\"\n      }\n    }\n  }\n}\n```\n\n配置后，Claude Desktop 启动时会自动拉起这些 MCP Server，AI 就能直接读取文件、操作 GitHub、查询数据库。\n\n---\n\n## 10. MCP 与 AI Agent 工程\n\n### 10.1 MCP 作为 Agent 的工具基础设施\n\n对于 AI Agent 工程，MCP 的重要价值在于：\n\n- **标准化工具接口**：所有 Agent 用同样的方式连接工具和数据源，不必为每个 Agent 重新集成\n- **动态工具发现**：Agent 启动时通过 `tools/list` 获取可用工具，无需硬编码\n- **安全隔离**：工具运行在独立的 Server 进程中，权限可精细控制\n- **跨平台复用**：一个 MCP Server 可以连接 Claude Desktop、Cursor、自建 Agent 等多个 Host\n\n### 10.2 典型的 Agent + MCP 架构\n\n```\n┌──────────────────────────────────────┐\n│         Agent Host                   │\n│  ┌────────────────────────────┐     │\n│  │      Agent Runtime          │     │\n│  │  • 任务规划                 │     │\n│  │  • LLM 推理                 │     │\n│  │  • 工具选择与调用            │     │\n│  │  • 记忆管理                 │     │\n│  └───────────┬────────────────┘     │\n│              │                       │\n│  ┌───────────┴────────────────┐     │\n│  │      MCP Client 层           │     │\n│  │  • 管理多个 MCP 连接         │     │\n│  │  • 工具格式转换              │     │\n│  │  • 错误处理与重试            │     │\n│  └───────┬───┬───┬────────────┘     │\n└──────────┼───┼───┼──────────────────┘\n           │   │   │\n    ┌──────┘   │   └──────┐\n    ▼          ▼          ▼\n┌───────┐ ┌───────┐ ┌──────────┐\n│ 文件   │ │ 数据库 │ │ 第三方API │\n│ Server │ │ Server │ │ Server   │\n└───────┘ └───────┘ └──────────┘\n```\n\n### 10.3 与 Pydantic AI 的关系\n\nPydantic AI 是 Python 生态中流行的 Agent 框架。它可以：\n\n- 使用 MCP Server 暴露的工具，通过 `tools/call` 调用\n- 将 MCP Tool 的 `inputSchema` 映射到 Pydantic 模型进行参数校验\n- 通过类型安全的方式编排多个 MCP Server 的工具\n\n### 10.4 MCP 在 WorkBuddy 中的应用\n\nWorkBuddy 内部使用 MCP 作为连接器基础设施。用户可以安装 MCP Server 来扩展能力（如微信支付、知识库查询等）。配置示例：\n\n```json\n{\n  \"mcpServers\": {\n    \"weixinpay\": {\n      \"command\": \"...\",\n      \"args\": [\"...\"]\n    }\n  }\n}\n```\n\n---\n\n## 11. MCP 的局限性与挑战\n\n| 挑战 | 说明 |\n|------|------|\n| **版本早期** | MCP 规范仍在快速迭代中，API 可能 breaking change |\n| **SSE 传输限制** | SSE 模式在复杂网络环境下稳定性不如 stdio |\n| **认证体系** | 虽然规范中有 OAuth 支持，但实现还不够完整 |\n| **工具冲突** | 多个 Server 暴露同名工具时缺少命名空间机制 |\n| **可观测性** | 缺少标准的日志和监控接口 |\n| **安全审计** | 工具调用链的可追溯性有待加强 |\n| **LLM 适配** | 不同 LLM 对 function calling 格式的支持差异需要 Host 适配 |\n\n---\n\n## 12. 与 LSP 的完整对比\n\n| 维度 | LSP | MCP |\n|------|-----|-----|\n| **发布时间** | 2016 年 | 2024 年 |\n| **提出者** | 微软 | Anthropic |\n| **服务对象** | 人类开发者（通过编辑器） | AI 模型（通过 AI 应用） |\n| **Server 提供** | 代码智能（补全、诊断、跳转） | 上下文 + 工具（资源、工具、提示） |\n| **数据方向** | 主要是 Server → Client | 双向：数据读取 + 工具执行 |\n| **副作用** | 极少（格式化是唯一边界操作） | 工具执行可以产生任意副作用 |\n| **传输方式** | stdio, TCP, Pipe | stdio, SSE (HTTP) |\n| **能力协商** | ✅ | ✅ |\n| **动态发现** | 静态（初始化时确定） | 动态（Resource/Tool 可以运行时变更） |\n| **安全机制** | 无需（本地进程） | 需要（用户确认、权限控制） |\n| **协议规范稳定性** | 非常稳定（3.17 是当前主要版本） | 快速迭代中 |\n| **生态成熟度** | 极其成熟，几乎覆盖所有语言 | 快速增长中 |\n\n---\n\n## 13. 实践建议\n\n### 13.1 学习路径\n\n1. **先用起来**：在 Claude Desktop 中配置一个 MCP Server（如 filesystem），感受 AI 如何通过 MCP 访问本地文件\n2. **理解协议**：阅读规范文档，理解 Resources / Tools / Prompts 的设计意图\n3. **手写一个 Server**：用 Python SDK 写一个简单的天气查询或数据库查询 Server\n4. **集成到 Agent**：在自建的 Agent 项目中集成 MCP Client，连接多个 Server\n\n### 13.2 快速体验\n\n```bash\n# 安装 Claude Desktop 后，在配置文件中添加：\n# ~/Library/Application Support/Claude/claude_desktop_config.json\n\n{\n  \"mcpServers\": {\n    \"filesystem\": {\n      \"command\": \"npx\",\n      \"args\": [\n        \"-y\",\n        \"@modelcontextprotocol/server-filesystem\",\n        \"/Users/me/Desktop\"\n      ]\n    }\n  }\n}\n\n# 重启 Claude Desktop，然后说：\n# \"列出我桌面上的所有文件\"\n```\n\n### 13.3 自己写一个 Python MCP Server 的完整示例\n\n```python\n# weather_server.py\nimport asyncio\nimport json\nimport httpx\nfrom mcp.server import Server\nfrom mcp.server.stdio import stdio_server\nfrom mcp.server.models import InitializationCapabilities\nimport mcp.types as types\n\nserver = Server(\"weather-server\")\n\n@server.list_tools()\nasync def list_tools() -> list[types.Tool]:\n    return [\n        types.Tool(\n            name=\"get_current_weather\",\n            description=\"获取指定城市的当前天气信息\",\n            inputSchema={\n                \"type\": \"object\",\n                \"properties\": {\n                    \"city\": {\n                        \"type\": \"string\",\n                        \"description\": \"城市名称，如 'Beijing'、'Shanghai'\"\n                    }\n                },\n                \"required\": [\"city\"]\n            }\n        )\n    ]\n\n@server.call_tool()\nasync def call_tool(name: str, arguments: dict) -> list[types.TextContent]:\n    if name == \"get_current_weather\":\n        city = arguments[\"city\"]\n        # 这里可以调用真实的天气 API\n        # async with httpx.AsyncClient() as client:\n        #     resp = await client.get(f\"https://api.weather.com/...\")\n        weather_info = f\"{city} 当前天气：晴，温度 22°C，湿度 45%\"\n        return [types.TextContent(type=\"text\", text=weather_info)]\n    raise ValueError(f\"Unknown tool: {name}\")\n\nasync def main():\n    async with stdio_server() as (read, write):\n        await server.run(\n            read, write,\n            InitializationCapabilities(sampling={})\n        )\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n```\n\n运行：`python weather_server.py`（配合 Claude Desktop 或其他 MCP Host 使用）\n\n---\n\n## 14. 总结\n\n| 维度 | 要点 |\n|------|------|\n| **解决什么问题** | AI 应用与数据源的集成碎片化（M×N 问题） |\n| **核心理念** | 「LLM 时代的 LSP」——标准协议连接 AI 与外部世界 |\n| **架构** | Host → MCP Client → MCP Server（三角模型） |\n| **核心原语** | Resources（只读数据）、Tools（可执行操作）、Prompts（提示模板） |\n| **通信方式** | JSON-RPC 2.0，stdio 或 SSE 传输 |\n| **与 Function Calling 关系** | MCP 负责工具发现与执行，Function Calling 负责 LLM 选择工具 |\n| **与 LSP 关系** | 直接继承设计思想，适应 LLM 场景 |\n| **生态现状** | 快速增长，Anthropic 主导，社区活跃 |\n\n---\n\n> **延伸阅读**：\n> - MCP 官方规范：https://spec.modelcontextprotocol.io/\n> - MCP 官网：https://modelcontextprotocol.io/\n> - 官方 GitHub 仓库：https://github.com/modelcontextprotocol\n> - Python SDK 文档：https://github.com/modelcontextprotocol/python-sdk\n> - TypeScript SDK 文档：https://github.com/modelcontextprotocol/typescript-sdk\n> - MCP Server 列表：https://github.com/modelcontextprotocol/servers\n> - LSP 与 MCP 的关系可以参考本项目中的：`Language Server Protocol 详解.md`"}, {"id": 23, "room": "tongdian", "date": "2026-06-16", "title": "PyCharm 远程开发方式详解", "tags": [], "from": "PyCharm 远程开发方式详解", "summary": "1. 概述 PyCharm 是 JetBrains 出品的 Python IDE，提供了多种远程开发方式，适用于不同的场景。远程开发的核心价值在于： - 代码在远程：源码存储在服务器/容器中，本地不需要完整的环境 - 运行在远程：Python 解释器、依赖包、GPU…", "content": "## 1. 概述\n\nPyCharm 是 JetBrains 出品的 Python IDE，提供了多种远程开发方式，适用于不同的场景。远程开发的核心价值在于：\n\n- **代码在远程**：源码存储在服务器/容器中，本地不需要完整的环境\n- **运行在远程**：Python 解释器、依赖包、GPU 等资源都在远端\n- **编辑在本地**：享受本地 IDE 的流畅交互体验\n\nPyCharm 支持以下几种远程开发方式，本文将逐一详解：\n\n```\n方式                              适用场景\n─────────────────────────────────────────────────────\n① SSH 远程解释器              │  有远程服务器，想用服务器的 Python 环境\n② Docker / Docker Compose     │  使用容器化的开发环境\n③ WSL 解释器                 │  Windows 上使用 WSL 中的 Python\n④ JetBrains Gateway           │  服务器端运行 IDE 后端，本地用瘦客户端\n⑤ Code With Me               │  多人协作，共享 IDE 会话\n⑥ Vagrant                    │  使用 Vagrant 管理的虚拟机\n⑦ 手动部署（Deployment）      │  本地编辑 + 自动上传到远程服务器\n```\n\n> **版本要求**：方式①②⑥需要 PyCharm Professional 版。Community 版不支持远程解释器。\n\n---\n\n## 2. 方式一：SSH 远程解释器（最常用）\n\n### 2.1 工作原理\n\n```\n┌──────────────────────┐         SSH 连接        ┌──────────────────────┐\n│    本地 PyCharm       │ ◄─────────────────────► │     远程 Linux 服务器  │\n│                      │                          │                      │\n│  • UI 渲染（本地）     │                          │  • Python 解释器       │\n│  • 代码编辑           │                          │  • 项目文件            │\n│  • 智能补全请求        │                          │  • 依赖包 (pip/conda)  │\n│                      │                          │  • 数据库/GPU 等资源    │\n│  ┌────────────────┐  │                          │                      │\n│  │ SFTP 文件同步   │──┼─────────────────────────►│  • 实际执行代码         │\n│  └────────────────┘  │                          │                      │\n└──────────────────────┘                          └──────────────────────┘\n```\n\n关键点：\n- 代码在本地编辑，通过 SFTP 自动同步到远程服务器的临时目录\n- Python 脚本实际在远程服务器上运行，输出回传到本地显示\n- 代码补全、跳转定义等智能功能通过 SSH 调用远程解释器完成\n\n### 2.2 配置步骤\n\n**前提条件**：\n- 远程服务器开启了 SSH 服务（端口通常是 22）\n- 本地可以通过 SSH 密钥或密码登录服务器\n- PyCharm Professional 版本\n\n**Step 1：配置 SSH 连接**\n\n```\nSettings → Tools → SSH Configurations → 点击 \"+\"\n```\n\n填写以下信息：\n\n| 字段 | 说明 | 示例 |\n|------|------|------|\n| Host | 服务器 IP 或域名 | `192.168.1.100` 或 `myserver.example.com` |\n| Port | SSH 端口 | `22`（默认） |\n| Username | 登录用户名 | `root` 或 `ubuntu` |\n| Authentication type | 认证方式 | `Key pair`（推荐）或 `Password` |\n| Private key file | 私钥路径 | `~/.ssh/id_rsa` |\n\n> **推荐使用密钥认证**，避免每次连接都输入密码。可以用 `ssh-keygen` 生成密钥对，用 `ssh-copy-id user@host` 将公钥上传到服务器。\n\n**Step 2：配置远程解释器**\n\n```\nSettings → Project → Python Interpreter → 齿轮图标 → Add → SSH Interpreter\n```\n\n1. 选择已有的 SSH 配置（或新建）\n2. 指定远程解释器路径，例如：\n   - 系统 Python：`/usr/bin/python3`\n   - Conda 环境：`/home/user/miniconda3/envs/myenv/bin/python`\n   - Virtualenv：`/home/user/venv/bin/python`\n3. 设置本地项目与远程路径的**映射（Mappings）**：\n   - Local path：`/Users/me/myproject`\n   - Remote path：`/home/user/pycharm_projects/myproject`\n\n> **映射路径说明**：PyCharm 会将本地代码通过 SFTP 自动上传到 Remote Path，远程执行时也在这个目录下查找文件。\n\n**Step 3：上传并同步**\n\n配置完成后，PyCharm 会自动将项目文件上传到远程服务器。之后每次保存文件都会自动同步。\n\n可以在 `Tools → Deployment → Options` 中设置同步策略：\n- `Always`：保存时始终自动上传\n- `On explicit save`：仅手动保存时上传（Ctrl+S）\n- `Never`：手动触发上传\n\n### 2.3 使用体验\n\n| 功能 | 本地 | SSH 远程 |\n|------|------|----------|\n| 代码编辑 | 流畅（本地） | 流畅（本地） |\n| 代码补全 | 即时（本地 index） | 稍有延迟（通过网络查询远程解释器） |\n| 运行/调试 | 本地执行 | **远程服务器执行**，输出回传本地 |\n| Terminal | 本地终端 | 可打开远程 SSH 终端 |\n| 依赖安装 | 本地 pip | 需要在远程执行 `pip install` |\n\n### 2.4 常见问题\n\n**Q：代码补全很慢？**\nA：因为 LSP / 代码智能需要查询远程解释器，网络延迟有影响。可以：\n- 使用局域网内的服务器\n- 在远程服务器上开启 SSH 连接复用（`ControlMaster`）\n- 配置 `.ssh/config` 保持长连接：\n\n```\nHost myserver\n    HostName 192.168.1.100\n    User ubuntu\n    IdentityFile ~/.ssh/id_rsa\n    ServerAliveInterval 60\n    ServerAliveCountMax 10\n    ControlMaster auto\n    ControlPath ~/.ssh/sockets/%r@%h:%p\n    ControlPersist 10m\n```\n\n**Q：如何安装远程包？**\nA：在 PyCharm 的 Terminal 中打开远程终端（`Tools → Start SSH Session`），然后直接 `pip install`。或者用 Settings → Python Interpreter 的包管理界面。\n\n**Q：远程路径上出现权限问题？**\nA：确保 SSH 用户对 `/home/user/pycharm_projects/` 有读写权限。可以用 `chmod` 调整。\n\n---\n\n## 3. 方式二：Docker / Docker Compose 解释器\n\n### 3.1 工作原理\n\nPython 解释器运行在 Docker 容器中，而不是宿主机上。\n\n```\n┌──────────────┐                    ┌──────────────────────────┐\n│  PyCharm     │  Docker API / CLI  │  Docker 容器              │\n│  (本地)      │ ◄────────────────► │  ├── Python 解释器         │\n│              │                    │  ├── 项目文件（Volume 挂载）│\n│              │                    │  └── 依赖包               │\n└──────────────┘                    └──────────────────────────┘\n```\n\n### 3.2 配置步骤\n\n**前提**：本地已安装 Docker / Docker Desktop。\n\n**方式 A：单个 Docker 容器**\n\n```\nSettings → Project → Python Interpreter → Add → Docker\n```\n\n1. 选择 Docker server（本地 Docker 或远程 Docker daemon）\n2. 选择 Image（如 `python:3.12`）或 Dockerfile\n3. 设置容器内的 Python 解释器路径（如 `/usr/local/bin/python`）\n4. 配置 Volume 映射：本地项目路径 → 容器内路径\n\n**方式 B：Docker Compose**\n\n```\nSettings → Project → Python Interpreter → Add → Docker Compose\n```\n\n1. 选择 `docker-compose.yml` 文件\n2. 选择 service（如 `web`、`app`）\n3. 环境变量可以从 `.env` 文件或 Compose 配置中读取\n\n```yaml\n# 示例 docker-compose.yml\nversion: '3.8'\nservices:\n  app:\n    image: python:3.12\n    volumes:\n      - .:/app\n    working_dir: /app\n    environment:\n      - PYTHONUNBUFFERED=1\n    command: tail -f /dev/null  # 保持容器运行\n```\n\n### 3.3 适用场景\n\n- 团队统一开发环境，避免「在我机器上能跑」的问题\n- 需要特定系统依赖（如 C 库、系统工具）\n- CI/CD 中使用相同 Docker 镜像，保证环境一致\n- 微服务项目中使用 Docker Compose 编排多服务\n\n---\n\n## 4. 方式三：WSL 解释器（仅 Windows）\n\n### 4.1 工作原理\n\nWindows Subsystem for Linux (WSL) 允许在 Windows 中运行完整的 Linux 内核。PyCharm 可以直接使用 WSL 中的 Python 解释器。\n\n```\n┌─────────────────────────────────────┐\n│         Windows 宿主机               │\n│  ┌──────────┐    ┌───────────────┐  │\n│  │ PyCharm  │───►│ WSL 2 虚拟机   │  │\n│  │ (Windows)│    │ ├─ Python 3.12 │  │\n│  │          │    │ ├─ pip 包      │  │\n│  │          │    │ └─ 项目文件     │  │\n│  └──────────┘    └───────────────┘  │\n└─────────────────────────────────────┘\n```\n\n### 4.2 配置步骤\n\n1. 在 Windows 上安装 WSL 2：`wsl --install`\n2. 在 WSL 中安装 Python：`sudo apt install python3`\n3. PyCharm 中：`Settings → Python Interpreter → Add → WSL`\n4. 选择 WSL 发行版和 Python 路径\n\n### 4.3 优劣\n\n| 优点 | 缺点 |\n|------|------|\n| 享受 Linux 开发体验，同时用 Windows 桌面 | 仅限 Windows |\n| 文件系统性能好（WSL 2 的 9p 文件系统） | WSL 和 Windows 文件系统跨访问有性能损耗 |\n| 不需要额外的虚拟机管理 | 部分网络功能（如 VPN）可能冲突 |\n\n---\n\n## 5. 方式四：JetBrains Gateway（远程开发）\n\n### 5.1 核心概念\n\n这是 JetBrains 最新的远程开发方案，与「SSH 远程解释器」有本质区别：\n\n| 对比维度 | SSH 远程解释器 | JetBrains Gateway |\n|----------|---------------|-------------------|\n| IDE 前端（UI） | 本地运行 | 本地运行（JetBrains Client） |\n| IDE 后端（代码分析） | 本地运行 | **远程服务器上运行** |\n| 代码存储 | 本地上传副本到远程 | 主要存储在远程 |\n| 智能补全延迟 | 依赖网络 | 极低（分析在远程本地完成） |\n| 资源消耗 | 本地需要较强性能 | 本地瘦客户端，远程需要资源 |\n\n### 5.2 架构\n\n```\n┌───────────────────┐                    ┌──────────────────────────┐\n│  本地机器（瘦客户端）│                    │     远程服务器             │\n│                   │   SSH / HTTPS      │                          │\n│  JetBrains Client  │ ◄────────────────► │  IDE Backend (Headless)  │\n│  • 编辑器 UI       │                    │  • 代码索引 & 分析         │\n│  • 键盘输入        │                    │  • 语言服务器 (LSP)        │\n│  • 渲染           │                    │  • 构建、运行、调试         │\n│                   │                    │  • Git 操作               │\n│                   │                    │  • 所有文件 I/O            │\n└───────────────────┘                    └──────────────────────────┘\n```\n\n### 5.3 配置步骤\n\n1. 在本地安装 **JetBrains Gateway**（独立应用，不依赖 PyCharm）\n2. 选择连接方式：\n   - **SSH**：直接连接到已有 SSH 服务器，Gateway 会自动下载并启动 IDE Backend\n   - **JetBrains Space**：连接到 Space 云开发环境\n   - **GitHub Codespaces**：使用 GitHub 的云端开发环境\n3. 选择项目路径并启动\n\n> Gateway 会自动在远程服务器上安装 Thin Client 版本的 PyCharm（或其他 JetBrains IDE）。首次启动需要下载（约 500MB-1GB），之后会缓存。\n\n### 5.4 适用场景\n\n- 远程服务器性能远强于本地（如带 GPU 的深度学习工作站）\n- 代码库巨大（百万行级），本地索引太慢\n- 需要在固定远程环境中开发，多台设备随时接入\n- 安全要求高的场景（代码不离开服务器）\n\n### 5.5 实际案例\n\n```bash\n# 在远程 GPU 服务器上开发深度学习项目\n# 本地只是一台普通笔记本，通过 Gateway 连接到 8×A100 的服务器\n# 所有代码、模型、数据都在服务器上\n# IDE 的代码分析、索引、运行全部在服务器端完成\n# 本地只负责显示 UI，网络只传输 UI 渲染指令\n```\n\n---\n\n## 6. 方式五：Code With Me（协作开发）\n\n### 6.1 工作原理\n\nCode With Me 不是传统意义的「远程开发」，而是**远程协作**：一个人打开项目，其他人通过链接加入，实时共享编辑和调试。\n\n```\n┌──────────────┐                    ┌──────────────┐\n│   Host        │     JetBrains     │   Guest       │\n│  (项目所有者)  │     Relay Server  │  (协作者)      │\n│              │ ◄────────────────► │              │\n│  本地/远程项目 │                    │  看到 Host    │\n│  正常运行     │                    │  的 IDE 视图   │\n└──────────────┘                    └──────────────┘\n```\n\n### 6.2 使用方式\n\n1. 在 PyCharm 中点击右上角的 Code With Me 图标\n2. 选择「Enable Access and Copy Invitation Link」\n3. 将链接发送给协作者\n4. 协作者通过链接加入，可以：\n   - 实时查看你的代码\n   - 跟随你的光标\n   - 独立编辑（权限需要 Host 分配）\n   - 共同调试\n\n### 6.3 适用场景\n\n- 结对编程（Pair Programming）\n- 代码审查（实时讲解）\n- 远程面试\n- 协助同事解决 bug\n\n---\n\n## 7. 方式六：Vagrant\n\n### 7.1 工作原理\n\nVagrant 是一个虚拟机管理工具。PyCharm 可以使用 Vagrant 虚拟机中的 Python 解释器。\n\n```\n┌──────────────┐                    ┌──────────────────┐\n│  PyCharm     │  vagrant ssh       │  Vagrant VM       │\n│  (宿主机)    │ ◄────────────────► │  (VirtualBox等)    │\n│              │                    │  ├── Python       │\n│              │                    │  └── 项目文件       │\n└──────────────┘                    └──────────────────┘\n```\n\n### 7.2 配置\n\n```bash\n# 初始化 Vagrant\nvagrant init ubuntu/jammy64\nvagrant up\n```\n\n在 PyCharm 中：`Settings → Python Interpreter → Add → Vagrant`，选择 Vagrant 实例文件夹和 Python 路径。\n\n> 当前 Vagrant 使用率下降，Docker 和 Gateway 是更主流的选择。\n\n---\n\n## 8. 方式七：手动部署（Deployment）\n\n### 8.1 适用场景\n\n与 SSH 远程解释器不同，手动部署模式下本地和远程使用不同的解释器。适合：\n- 本地开发和测试，定期上传到远程服务器运行\n- 不需要远程解释器的代码智能功能\n- 通过 SFTP/FTP/FTPS 上传\n\n### 8.2 配置\n\n```\nTools → Deployment → Configuration → 点击 \"+\" → SFTP\n```\n\n配置远程服务器信息后，可以：\n- 右键文件/文件夹 → Deployment → Upload to...\n- 设置自动上传（保存时触发）\n- 对比本地和远程文件差异\n- 直接在远程服务器上浏览文件\n\n---\n\n## 9. 方式对比总结\n\n| 方式 | 代码位置 | Python 运行位置 | IDE 后端 | 需要版本 | 适合场景 |\n|------|---------|----------------|---------|---------|---------|\n| SSH 远程解释器 | 本地+远程同步 | 远程 | 本地 | Professional | 有远程服务器，想用远程环境 |\n| Docker | 本地 (Volume) | 容器 | 本地 | Professional | 容器化开发，环境一致 |\n| Docker Compose | 本地 (Volume) | 容器 | 本地 | Professional | 多容器微服务项目 |\n| WSL | 本地/WSL | WSL | 本地 | Professional | Windows 上用 Linux 环境 |\n| JetBrains Gateway | 远程 | 远程 | 远程 | 独立应用 | 远程高性能服务器，大项目 |\n| Code With Me | 共享 | Host 环境 | Host 本地 | 任意 | 结对编程、代码审查 |\n| Vagrant | 本地+VM | VM | 本地 | Professional | 传统 VM 管理 |\n| 手动部署 | 本地 | 各自独立 | 本地 | 任意 | 仅需上传，不需远程运行 |\n\n---\n\n## 10. 选型建议\n\n选择远程开发方式的核心问题是：**你的瓶颈在哪？**\n\n```mermaid\ngraph TD\n    A[需要远程开发] --> B{瓶颈是什么？}\n    B -->|需要特定 Python 环境/包| C[SSH 远程解释器]\n    B -->|需要统一团队环境| D[Docker / Docker Compose]\n    B -->|本地性能不够/代码太大| E[JetBrains Gateway]\n    B -->|多人同时编码| F[Code With Me]\n    B -->|Windows 上需要 Linux| G[WSL]\n```\n\n**推荐路径**：\n1. 新手起步 → SSH 远程解释器（最常用、最简单）\n2. 团队协作 → Docker Compose + SSH 远程解释器\n3. 高性能需求 → JetBrains Gateway\n4. 结对编程 → Code With Me\n\n---\n\n## 11. 常见问题排查\n\n### 11.1 SSH 连接失败\n\n```bash\n# 先在终端中测试 SSH 连接\nssh -v user@host\n\n# 常见原因：\n# - 防火墙阻止了 22 端口\n# - SSH 服务未启动：systemctl status sshd\n# - 密钥权限问题：chmod 600 ~/.ssh/id_rsa\n```\n\n### 11.2 远程解释器找不到包\n\n```bash\n# 确认远程环境中包是否已安装\nssh user@host \"python3 -c 'import numpy; print(numpy.__version__)'\"\n\n# 如果远程解释器使用了虚拟环境，确保路径正确\nssh user@host \"which python3\"\n```\n\n### 11.3 PyCharm 远程卡顿\n\n- 检查 `Tools → Deployment → Options`，关闭不必要的自动上传\n- 使用 SSH 连接复用（见 2.4 节）\n- 如果项目很大，考虑使用 JetBrains Gateway\n- 排除大文件/目录：`Tools → Deployment → Configuration → Excluded Paths`\n\n### 11.4 Gateway 连接后 IDE Backend 启动失败\n\n- 检查远程服务器磁盘空间：`df -h`（IDE Backend 需要至少 2GB）\n- 检查远程服务器内存：`free -h`（建议至少 4GB）\n- 查看远程日志：`~/.cache/JetBrains/RemoteDev/logs/`\n\n---\n\n> **延伸阅读**：\n> - JetBrains 官方文档：https://www.jetbrains.com/help/pycharm/remote-development.html\n> - JetBrains Gateway 文档：https://www.jetbrains.com/remote-development/gateway/\n> - SSH 连接复用参考：`man ssh_config` 中的 ControlMaster 章节"}, {"id": 24, "room": "tongdian", "date": "2026-06-16", "title": "Server-Sent Events (SSE) 详解", "tags": [], "from": "Server-Sent Events 详解", "summary": "1. 背景：HTTP 的「单向请求」局限 1.1 HTTP 的天然短板 HTTP 协议本质上是一个请求-响应模型——客户端发起请求，服务端返回响应，然后连接结束。服务端无法主动向客户端推送数据。 这对实时场景（股票行情、消息通知、AI 流式输出）是致命限制。 1.2…", "content": "## 1. 背景：HTTP 的「单向请求」局限\n\n### 1.1 HTTP 的天然短板\n\nHTTP 协议本质上是一个**请求-响应模型**——客户端发起请求，服务端返回响应，然后连接结束。服务端无法主动向客户端推送数据。\n\n```\n    标准 HTTP：\n    Client ──── Request ────► Server\n    Client ◄── Response ──── Server\n    [连接关闭]\n\n    服务端想主动推送 → 做不到\n```\n\n这对实时场景（股票行情、消息通知、AI 流式输出）是致命限制。\n\n### 1.2 传统解决方案的不足\n\n在 SSE 出现之前，几种方案的局限：\n\n| 方案 | 原理 | 缺点 |\n|------|------|------|\n| **短轮询** | 客户端定时发 HTTP 请求查询 | 大量无效请求，延迟高，浪费带宽 |\n| **长轮询** | 客户端请求后服务端挂起，有数据再返回 | 每次都要重建连接，连接管理复杂 |\n| **WebSocket** | 升级 HTTP 为全双工 TCP 连接 | 协议复杂，不兼容 HTTP/2 多路复用，需要特殊代理支持 |\n| **隐藏 iframe** | 服务端向 iframe 写入 script 标签 | hack 方案，不优雅 |\n\n### 1.3 SSE 的解决方案\n\nSSE 在**标准 HTTP 之上**实现服务端推送，无需升级协议、无需特殊基础设施：\n\n```\n    SSE：\n    Client ──── GET /events (Accept: text/event-stream) ──► Server\n    Client ◄── data: {...}\\n\\n ───────────────────────────── Server\n    Client ◄── data: {...}\\n\\n ───────────────────────────── Server\n    Client ◄── data: {...}\\n\\n ───────────────────────────── Server\n    [连接保持打开，服务端随时推送]\n```\n\n> SSE 的本质：**一个永不结束的 HTTP 响应**。\n\n---\n\n## 2. 核心概念\n\n### 2.1 什么是 SSE\n\n**Server-Sent Events (SSE)** 是 HTML5 规范中的一部分，定义了一种服务端通过 HTTP 连接向客户端**单向**推送事件的标准方式。\n\n| 特性 | 说明 |\n|------|------|\n| **通信方向** | 单向：服务端 → 客户端（客户端通过普通 HTTP 请求发送数据） |\n| **传输协议** | HTTP/1.1 或 HTTP/2 |\n| **数据格式** | 纯文本（`text/event-stream` MIME 类型） |\n| **自动重连** | 浏览器内置 `EventSource` API 自动处理断线重连 |\n| **连接开销** | 极低，就是一个长连接的 HTTP 响应流 |\n\n### 2.2 与 WebSocket 的本质区别\n\n| 维度 | SSE | WebSocket |\n|------|-----|-----------|\n| **协议层** | 标准 HTTP | 独立协议（`ws://` / `wss://`） |\n| **通信方向** | 单向（服务端 → 客户端） | 全双工（双向） |\n| **数据格式** | 纯文本（`text/event-stream`） | 文本或二进制 |\n| **自动重连** | ✅ 浏览器内置 | ❌ 需手动实现 |\n| **断线检测** | ✅ 内置心跳机制 | ❌ 需自行实现 ping/pong |\n| **HTTP/2 兼容** | ✅ 天然兼容多路复用 | ❌ 与 HTTP/2 多路复用冲突 |\n| **代理/防火墙** | ✅ 完全兼容 | ⚠️ 部分代理不支持升级请求 |\n| **实现复杂度** | 极低 | 中等 |\n| **适用场景** | 订阅推送、日志流、AI 流式输出 | 聊天、游戏、协同编辑 |\n\n> **口诀**：需要服务端推数据选 SSE，需要双向高频通信选 WebSocket。大部分 AI Agent 场景（流式输出、状态推送）SSE 完全够用。\n\n---\n\n## 3. 协议细节\n\n### 3.1 HTTP 请求头\n\n客户端发起 SSE 连接时，发送标准 HTTP GET 请求，带特定请求头：\n\n```http\nGET /events HTTP/1.1\nHost: example.com\nAccept: text/event-stream\nCache-Control: no-cache\n```\n\n| 请求头 | 必须 | 说明 |\n|--------|------|------|\n| `Accept: text/event-stream` | ✅ | 告诉服务端客户端需要 SSE 流 |\n| `Cache-Control: no-cache` | 建议 | 禁用缓存代理 |\n\n### 3.2 HTTP 响应头\n\n服务端返回：\n\n```http\nHTTP/1.1 200 OK\nContent-Type: text/event-stream\nCache-Control: no-cache\nConnection: keep-alive\nTransfer-Encoding: chunked    (HTTP/1.1)\n\ndata: {\"message\": \"hello\"}\n\n```\n\n| 响应头 | 必须 | 说明 |\n|--------|------|------|\n| `Content-Type: text/event-stream` | ✅ | 标识 SSE 流 |\n| `Cache-Control: no-cache` | ✅ | 防止代理缓存事件流 |\n| `Connection: keep-alive` | 建议 | 保持连接不关闭 |\n| `Transfer-Encoding: chunked` | HTTP/1.1 默认 | 分块传输编码 |\n\n### 3.3 事件流格式\n\nSSE 的响应体是一种简单的文本格式，由多个**字段**组成，每条消息以两个换行符 `\\n\\n` 分隔：\n\n```\nfield:value\\n\nfield:value\\n\n\\n\n```\n\n**完整字段定义**：\n\n```\nid: 42\\n                        ← 事件 ID（用于断线重连的 Last-Event-ID）\nevent: customEventName\\n        ← 事件类型（默认是 \"message\"）\ndata: {\"key\": \"value\"}\\n        ← 数据内容（可多行）\nretry: 3000\\n                   ← 重连间隔（毫秒）\n\\n                              ← 消息结束标记\n```\n\n> ⚠️ **注意**：\n> - `data:` 字段可以出现多次，实际值是多行拼接的结果\n> - 每行结尾必须是 `\\n`（LF），不能是 `\\r\\n`（CRLF）\n> - 注释行以 `:` 开头，客户端忽略\n\n### 3.4 五种字段详解\n\n| 字段 | 出现次数 | 说明 | 示例 |\n|------|---------|------|------|\n| `data:` | 必须（否则消息为空） | 消息数据。可多行，多行时自动拼接 | `data: hello\\n` |\n| `event:` | 可选 | 自定义事件类型名 | `event: update\\n` |\n| `id:` | 可选 | 事件 ID。重连时通过 `Last-Event-ID` 头发送 | `id: 42\\n` |\n| `retry:` | 可选 | 重连等待时间（毫秒） | `retry: 3000\\n` |\n| `:` | 可选 | 注释行，客户端忽略 | `: heartbeat\\n` |\n\n### 3.5 实际示例\n\n```\n: 这是一个注释，客户端会忽略\\n\n\\n\nevent: user_joined\\n\ndata: {\"username\": \"alice\", \"time\": \"2026-06-16T08:00:00Z\"}\\n\n\\n\nevent: message\\n\nid: 1001\\n\ndata: {\"from\": \"alice\", \"text\": \"Hello!\"}\\n\n\\n\nid: 1002\\n\ndata: {\"from\": \"bob\", \"text\": \"Hi Alice!\"}\\n\n\\n\ndata: 没有 event 字段，默认触发 \"message\" 事件\\n\n\\n\n```\n\n对应的客户端 JavaScript：\n\n```javascript\nconst source = new EventSource('/events');\n\n// 默认 \"message\" 事件\nsource.onmessage = (event) => {\n  console.log('收到消息:', event.data);\n  // event.lastEventId → \"1002\"\n  // event.type → \"message\"\n};\n\n// \"user_joined\" 自定义事件\nsource.addEventListener('user_joined', (event) => {\n  const data = JSON.parse(event.data);\n  console.log(`${data.username} 加入了房间`);\n});\n```\n\n---\n\n## 4. 浏览器 API：EventSource\n\n### 4.1 基本用法\n\n```javascript\n// 建立连接\nconst source = new EventSource('/events');\n\n// 连接成功\nsource.onopen = () => {\n  console.log('SSE 连接已建立');\n};\n\n// 接收消息（默认事件类型）\nsource.onmessage = (event) => {\n  console.log('数据:', event.data);\n  console.log('事件ID:', event.lastEventId);\n};\n\n// 错误处理\nsource.onerror = (event) => {\n  if (source.readyState === EventSource.CLOSED) {\n    console.log('连接已关闭');\n  } else {\n    console.log('连接错误，将自动重连...');\n  }\n};\n\n// 监听自定义事件\nsource.addEventListener('customEvent', (event) => {\n  const data = JSON.parse(event.data);\n  // 处理自定义事件\n});\n\n// 手动关闭\nsource.close();\n```\n\n### 4.2 readyState 状态\n\n| 状态 | 值 | 说明 |\n|------|-----|------|\n| `EventSource.CONNECTING` | 0 | 正在连接或重连中 |\n| `EventSource.OPEN` | 1 | 连接已建立 |\n| `EventSource.CLOSED` | 2 | 连接已关闭 |\n\n### 4.3 自动重连机制\n\nSSE 最优雅的特性之一：\n\n```\nClient                                          Server\n  │                                               │\n  │──── GET /events ─────────────────────────────►│\n  │◄─── data: msg1 ───────                        │\n  │◄─── data: msg2 ───────                        │\n  │                    [连接意外断开]                │\n  │                                               │\n  │──── GET /events ─────────────────────────────►│  (自动重连)\n  │    Last-Event-ID: 1002                        │  (带上最后收到的事件ID)\n  │◄─── data: msg3 (从 msg2 之后开始)               │\n```\n\n- 浏览器自动执行重连，无需代码\n- 通过 `Last-Event-ID` 头告知服务端断点位置\n- 重连间隔由服务端的 `retry:` 字段控制，默认约 3 秒\n\n---\n\n## 5. 服务端实现\n\n### 5.1 Python (FastAPI)\n\n```python\nfrom fastapi import FastAPI, Request\nfrom fastapi.responses import StreamingResponse\nimport asyncio\nimport json\n\napp = FastAPI()\n\n@app.get(\"/events\")\nasync def sse_endpoint(request: Request):\n    async def event_stream():\n        counter = 0\n        while True:\n            # 检查客户端是否断开\n            if await request.is_disconnected():\n                break\n\n            counter += 1\n            data = json.dumps({\"count\": counter, \"time\": str(asyncio.get_event_loop().time())})\n\n            # SSE 格式输出\n            yield f\"id: {counter}\\n\"\n            yield f\"event: update\\n\"\n            yield f\"data: {data}\\n\\n\"\n\n            await asyncio.sleep(1)\n\n    return StreamingResponse(\n        event_stream(),\n        media_type=\"text/event-stream\",\n        headers={\n            \"Cache-Control\": \"no-cache\",\n            \"Connection\": \"keep-alive\",\n            \"X-Accel-Buffering\": \"no\",  # 禁用 nginx 缓冲\n        }\n    )\n```\n\n### 5.2 Python (Flask)\n\n```python\nfrom flask import Flask, Response\nimport time\nimport json\n\napp = Flask(__name__)\n\n@app.route('/events')\ndef sse_endpoint():\n    def event_stream():\n        counter = 0\n        while True:\n            counter += 1\n            data = json.dumps({\"count\": counter})\n            yield f\"data: {data}\\n\\n\"\n            time.sleep(1)\n\n    return Response(\n        event_stream(),\n        mimetype=\"text/event-stream\",\n        headers={\n            \"Cache-Control\": \"no-cache\",\n            \"X-Accel-Buffering\": \"no\",\n        }\n    )\n```\n\n### 5.3 Node.js (Express)\n\n```javascript\nconst express = require('express');\nconst app = express();\n\napp.get('/events', (req, res) => {\n  res.writeHead(200, {\n    'Content-Type': 'text/event-stream',\n    'Cache-Control': 'no-cache',\n    'Connection': 'keep-alive',\n    'X-Accel-Buffering': 'no',\n  });\n\n  let counter = 0;\n  const interval = setInterval(() => {\n    counter++;\n    const data = JSON.stringify({ count: counter, time: Date.now() });\n    res.write(`id: ${counter}\\n`);\n    res.write(`data: ${data}\\n\\n`);\n  }, 1000);\n\n  // 客户端断开时清理\n  req.on('close', () => {\n    clearInterval(interval);\n    res.end();\n  });\n});\n\napp.listen(3000);\n```\n\n### 5.4 Go\n\n```go\nfunc sseHandler(w http.ResponseWriter, r *http.Request) {\n    flusher, ok := w.(http.Flusher)\n    if !ok {\n        http.Error(w, \"Streaming not supported\", http.StatusInternalServerError)\n        return\n    }\n\n    w.Header().Set(\"Content-Type\", \"text/event-stream\")\n    w.Header().Set(\"Cache-Control\", \"no-cache\")\n    w.Header().Set(\"Connection\", \"keep-alive\")\n\n    counter := 0\n    for {\n        counter++\n        data := fmt.Sprintf(`{\"count\": %d, \"time\": \"%s\"}`, counter, time.Now().Format(time.RFC3339))\n        fmt.Fprintf(w, \"id: %d\\n\", counter)\n        fmt.Fprintf(w, \"data: %s\\n\\n\", data)\n        flusher.Flush()\n\n        time.Sleep(1 * time.Second)\n    }\n}\n```\n\n---\n\n## 6. AI/Agent 场景中的 SSE\n\n### 6.1 LLM 流式输出\n\nSSE 是实现 LLM 流式输出的最常见方式：\n\n```\n用户: \"写一首诗\"                  \n      │                                        \n      ▼                                        \nClient ── POST /chat ─────────────► AI Server  \nClient ◄── data: {\"delta\":\"春\"} ─── AI Server  \nClient ◄── data: {\"delta\":\"眠\"} ─── AI Server  \nClient ◄── data: {\"delta\":\"不\"} ─── AI Server  \nClient ◄── data: {\"delta\":\"觉\"} ─── AI Server  \n      ...                                      \nClient ◄── data: [DONE] ──────────── AI Server  \n```\n\n**OpenAI 兼容的 SSE 流式格式**：\n\n```\ndata: {\"id\":\"chatcmpl-xxx\",\"object\":\"chat.completion.chunk\",\"choices\":[{\"delta\":{\"content\":\"春\"}}]}\n\ndata: {\"id\":\"chatcmpl-xxx\",\"object\":\"chat.completion.chunk\",\"choices\":[{\"delta\":{\"content\":\"眠\"}}]}\n\ndata: [DONE]\n\n```\n\n### 6.2 MCP 中的 SSE 传输\n\nMCP 使用 SSE 作为**远程传输方式**之一（另一种是 stdio）：\n\n```\n┌──────────────┐                           ┌──────────────┐\n│ MCP Client   │                           │ MCP Server   │\n│ (AI 应用)     │                           │ (远程)        │\n│              │                           │              │\n│              │── GET /sse ──────────────►│ 建立 SSE 通道  │\n│              │  Accept: text/event-stream│ (Server→Client)│\n│              │                           │              │\n│              │── POST /message ─────────►│ 发送请求       │\n│              │  {jsonrpc: \"2.0\", ...}    │ (Client→Server)│\n│              │                           │              │\n│              │◄─ data: {jsonrpc: 2.0} ──│ 通过 SSE 响应   │\n│              │                           │ (Server→Client)│\n└──────────────┘                           └──────────────┘\n```\n\n**MCP SSE 的关键设计**：\n- SSE 通道用于 **Server → Client** 的消息（响应、通知）\n- 独立的 HTTP POST 端点用于 **Client → Server** 的请求\n- 每条 SSE 消息承载一个完整的 JSON-RPC 消息\n\n### 6.3 Agent 状态推送\n\nAgent 执行任务时，通过 SSE 向客户端推送实时状态：\n\n```\nevent: agent_plan\ndata: {\"steps\": [\"分析需求\", \"搜索代码\", \"生成修改\", \"运行测试\"]}\n\nevent: agent_status\ndata: {\"step\": \"搜索代码\", \"status\": \"in_progress\", \"progress\": 25}\n\nevent: agent_message\ndata: {\"role\": \"agent\", \"content\": \"正在搜索相关的函数定义...\"}\n\nevent: tool_call\ndata: {\"tool\": \"search_code\", \"args\": {\"pattern\": \"def handle\"}}\n\nevent: agent_status\ndata: {\"step\": \"搜索代码\", \"status\": \"completed\", \"progress\": 50}\n\nevent: agent_status\ndata: {\"step\": \"生成修改\", \"status\": \"in_progress\", \"progress\": 50}\n```\n\n---\n\n## 7. 生产环境注意事项\n\n### 7.1 连接限制\n\nHTTP/1.1 浏览器对同一域名的并发连接有限制（通常 6 个）。一个 SSE 连接占用一个，所以：\n\n- **尽量使用 HTTP/2**：HTTP/2 支持多路复用，单连接可以承载多个 SSE 流\n- **合并 SSE 端点**：一个 SSE 连接推送多种事件，而不是每种事件一个连接\n\n### 7.2 代理和缓冲\n\n```nginx\n# Nginx 配置：关闭 SSE 响应的缓冲\nlocation /events {\n    proxy_pass http://backend;\n    proxy_set_header Connection '';\n    proxy_http_version 1.1;\n    proxy_buffering off;          # 关键：关闭缓冲\n    proxy_cache off;              # 关键：关闭缓存\n    chunked_transfer_encoding on;\n}\n```\n\n> `X-Accel-Buffering: no` 响应头告诉 Nginx 不要缓冲这个响应。\n\n### 7.3 连接保活\n\n```nginx\n# 增加超时时间\nproxy_read_timeout 86400s;    # 24 小时\nproxy_send_timeout 86400s;\n```\n\n服务端可以定期发送注释作为心跳：\n\n```\ndata: {\"type\": \"heartbeat\"}\\n\\n\n```\n\n### 7.4 断线恢复\n\n服务端通过 `id:` 记录事件序列号，重连时：\n\n```python\nlast_event_id = request.headers.get(\"Last-Event-ID\")\nif last_event_id:\n    # 从 last_event_id + 1 开始重放事件\n    start_from = int(last_event_id) + 1\nelse:\n    start_from = 0\n```\n\n### 7.5 安全性\n\n- 和普通 HTTP 一样使用 HTTPS（`https://`）\n- 支持 Cookie 认证（同源）和 Token 认证（`Authorization` 头）\n- 注意 CORS 配置（跨域 SSE 需要服务端配合）\n\n---\n\n## 8. SSE 与其他技术对比\n\n### 8.1 完整决策矩阵\n\n| 场景 | 推荐方案 | 原因 |\n|------|---------|------|\n| 服务端推送（AI 流式输出、通知、日志） | **SSE** | 简单、兼容性好、自动重连 |\n| 双向高频通信（聊天、游戏、协作） | **WebSocket** | 全双工、低延迟 |\n| 简单状态查询（幂等、低频） | **短轮询** | 实现最简单 |\n| 低频查询但要低延迟 | **长轮询** | HTTP-only 环境可用 |\n| 实时视频/音频 | **WebRTC** | 专为此设计 |\n| IoT 设备推送 | **MQTT** | 轻量级、适合弱网 |\n\n### 8.2 常见误用\n\n| 误用 | 应该用 |\n|------|--------|\n| 用 WebSocket 做单向推送（只是服务端推 AI 输出） | SSE 更简单、更兼容 |\n| 用 SSE 做双向通信（客户端频繁发数据） | WebSocket 更高效 |\n| 用短轮询模拟实时推送 | SSE 省带宽、低延迟 |\n\n---\n\n## 9. 总结\n\n| 维度 | 要点 |\n|------|------|\n| **本质** | 基于 HTTP 的服务端单向推送技术 |\n| **协议层** | 标准 HTTP/1.1 或 HTTP/2，无需升级 |\n| **数据格式** | `text/event-stream`，纯文本，`data:` + `event:` + `id:` + `retry:` |\n| **关键优势** | 自动重连、断点续传、HTTP/2 兼容、代理友好 |\n| **实现复杂度** | 极低（比 WebSocket 简单得多） |\n| **AI 场景** | LLM 流式输出（OpenAI 格式）、MCP 远程传输、Agent 状态推送 |\n| **核心局限** | 单向——服务端推客户端，不能客户端频繁推服务端 |\n\n> **一句话总结**：SSE 就是「永不关闭的 HTTP 响应」——用最简单的协议，解决最常见的服务端推送问题。\n\n---\n\n> **延伸阅读**：\n> - MDN EventSource 文档：https://developer.mozilla.org/en-US/docs/Web/API/EventSource\n> - HTML 标准 SSE 章节：https://html.spec.whatwg.org/multipage/server-sent-events.html\n> - MCP SSE 传输规范：https://spec.modelcontextprotocol.io/specification/2025-03-26/basic/transports/\n> - 本项目相关文档：`Model Context Protocol 详解.md`（第 4.1 节 SSE 传输）"}, {"id": 25, "room": "tongdian", "date": "2026-06-16", "title": "Streamable HTTP 详解（MCP 新一代传输协议）", "tags": [], "from": "Streamable HTTP 详解", "summary": "1. 背景：HTTP+SSE 的时代局限 1.1 MCP 初代远程传输 在 MCP 协议 2024-11-05 版本中，远程通信使用 HTTP + SSE 方案： 这个设计有三个致命缺陷：  后果 | ------|  SSE 断开后无法续传，上下文全部丢失 | …", "content": "## 1. 背景：HTTP+SSE 的时代局限\n\n### 1.1 MCP 初代远程传输\n\n在 MCP 协议 2024-11-05 版本中，远程通信使用 **HTTP + SSE** 方案：\n\n```\n┌──────────────┐                    ┌──────────────┐\n│ MCP Client   │                    │ MCP Server   │\n│              │                    │              │\n│              │── GET /sse ───────►│ ① 建立 SSE 通道\n│              │  Accept: text/...  │   (Server→Client)\n│              │                    │              │\n│              │── POST /messages ─►│ ② 发送请求\n│              │  body: JSON-RPC    │   (Client→Server)\n│              │                    │              │\n│              │◄─ SSE: data ──────│ ③ 服务端响应\n│              │                    │   (通过 SSE 通道)\n└──────────────┘                    └──────────────┘\n```\n\n这个设计有**三个致命缺陷**：\n\n| 缺陷 | 后果 |\n|------|------|\n| **连接不可恢复** | SSE 断开后无法续传，上下文全部丢失 |\n| **强制长连接** | 服务器必须维持高可用长连接，资源压力大 |\n| **双端点耦合** | `/sse` 和 `/messages` 两个端点耦合，架构复杂 |\n\n### 1.2 Streamable HTTP 的诞生\n\n2025 年 3 月 26 日，MCP 协议发布关键更新：**用 Streamable HTTP 替代 HTTP+SSE 作为远程传输方式**。\n\n> Streamable HTTP 并非全新发明的协议，而是对 HTTP 的**巧妙运用**——用单个端点，按需在「普通 JSON 响应」和「SSE 流式响应」之间灵活切换。\n\n---\n\n## 2. 核心设计\n\n### 2.1 单一端点 + 按需流式\n\n```\n旧方案：HTTP+SSE                      新方案：Streamable HTTP\n─────────────────                    ────────────────────────\n/sse          (GET, 接收推送)        /mcp  (POST/GET 统一端点)\n/messages     (POST, 发送消息)             │\n      两个端点                               │ 按需选择：\n                                            ├─ 简单请求 → JSON 响应\n                                            └─ 复杂请求 → SSE 流式响应\n```\n\n**核心理念**：不是「总是流式」，而是「需要时才流式」。服务器根据请求复杂度自主决定响应方式。\n\n### 2.2 三种服务器模式\n\nStreamable HTTP 支持三种服务器部署模式，灵活度远超前代：\n\n| 模式 | 说明 | 适用场景 |\n|------|------|---------|\n| **无状态服务器** | 每次请求独立，不维持任何状态 | 简单工具服务（如天气查询、计算器） |\n| **支持流式输出的无状态服务器** | 无状态，但复杂请求可升级为 SSE 流 | 需要进度反馈的工具（如长时间计算） |\n| **有状态服务器** | 维持会话上下文，通过 Session ID 绑定 | 多轮对话、Agent 编排等复杂场景 |\n\n---\n\n## 3. 协议细节\n\n### 3.1 端点设计\n\n| 规则 | 说明 |\n|------|------|\n| **端点数量** | 单一 HTTP 端点（称为 **MCP 端点**），如 `https://example.com/mcp` |\n| **支持方法** | POST（客户端→服务端）和 GET（服务端→客户端） |\n| **安全要求** | 必须验证 `Origin` 头（防 DNS 重绑定攻击）|\n| **本地绑定** | 本地运行时应仅绑定 `127.0.0.1` |\n| **认证** | 应对所有连接实施适当认证 |\n\n### 3.2 POST 请求（Client → Server）\n\n客户端发送 JSON-RPC 消息到服务器：\n\n```http\nPOST /mcp HTTP/1.1\nHost: example.com\nContent-Type: application/json\nAccept: application/json, text/event-stream\nMCP-Protocol-Version: 2025-11-25\nMCP-Session-Id: abc123def456\n\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"tools/call\",\n  \"params\": { ... }\n}\n```\n\n**POST 请求头要求**：\n\n| 头 | 必须 | 说明 |\n|----|------|------|\n| `Accept` | ✅ | 必须同时包含 `application/json` 和 `text/event-stream` |\n| `Content-Type` | ✅ | `application/json` |\n| `MCP-Protocol-Version` | ✅ | 协商后的协议版本 |\n| `MCP-Session-Id` | 有状态时必须 | 服务器分配的会话 ID |\n\n**服务器根据请求类型决定响应方式**：\n\n```\n输入的 JSON-RPC 消息类型：\n\n  通知(Notification) 或 响应(Response)\n  │\n  └─► 返回 HTTP 202 Accepted（无响应体）\n\n  请求(Request)\n  │\n  ├─► 简单请求 → Content-Type: application/json（单个 JSON 响应）\n  │\n  └─► 复杂请求 → Content-Type: text/event-stream（SSE 流式响应）\n```\n\n### 3.3 GET 请求（Server → Client 监听）\n\n客户端可以通过 GET 请求建立从服务器接收消息的通道：\n\n```http\nGET /mcp HTTP/1.1\nHost: example.com\nAccept: text/event-stream\nMCP-Protocol-Version: 2025-11-25\nMCP-Session-Id: abc123def456\n```\n\n服务器响应 `Content-Type: text/event-stream`，通过 SSE 主动向客户端推送：\n- JSON-RPC **请求**（服务器请求客户端执行操作）\n- JSON-RPC **通知**（服务器告知客户端状态变更）\n- **但不能**发送 JSON-RPC 响应（除非是恢复流）\n\n### 3.4 SSE 流行为规则\n\nStreamable HTTP 中的 SSE 流遵循以下精细规则：\n\n```\n① 初始事件\n   Server ──► \"id: 1\\ndata: \\n\\n\"  (空 data，仅分配事件 ID，供断线恢复用)\n\n② 消息推送\n   Server ──► \"id: 2\\ndata: {通知/请求}\\n\\n\"\n   Server ──► \"id: 3\\ndata: {通知/请求}\\n\\n\"\n\n③ 连接关闭 ≠ 流终止\n   Server 可以在发送带 ID 的事件后关闭 HTTP 连接\n   客户端应当通过重连来「轮询」SSE 流\n\n④ retry 字段\n   Server 关闭连接前可发送: \"retry: 3000\\n\\n\"\n   客户端必须等待指定毫秒数后重连\n\n⑤ 最终响应\n   SSE 流应当最终包含与 POST 请求对应的 JSON-RPC 响应\n   发送响应后 Server 应当终止 SSE 流\n\n⑥ 断连 ≠ 取消\n   SSE 断连不解释为客户端取消请求\n   取消必须显式发送 CancelledNotification\n```\n\n### 3.5 会话管理\n\n服务器通过 `MCP-Session-Id` 头管理会话：\n\n```\n初始化阶段：\nClient ──── POST /mcp ────────────► Server\n          { \"method\": \"initialize\", ... }\n\nClient ◄──── HTTP 200 ───────────── Server\n           MCP-Session-Id: sess_abc123\n           { \"result\": { ... } }\n\n后续所有请求均携带会话 ID：\nClient ──── POST /mcp ────────────► Server\n           MCP-Session-Id: sess_abc123\n           { \"method\": \"tools/list\", ... }\n```\n\n| 规则 | 说明 |\n|------|------|\n| **分配** | 服务器在 `InitializeResult` 响应头中返回 `MCP-Session-Id` |\n| **ID 要求** | 全局唯一、加密安全（UUID、JWT 或加密哈希） |\n| **字符限制** | 仅可见 ASCII（0x21-0x7E） |\n| **客户端携带** | 所有后续请求必须携带 |\n| **会话终止** | 服务器可以随时终止，之后返回 HTTP 404 |\n| **客户端重建** | 收到 404 时重新初始化 |\n| **显式终止** | 客户端可以发送 `DELETE /mcp` 带着会话 ID 终止 |\n\n### 3.6 流可恢复性\n\n这是 Streamable HTTP 相比旧方案的**最大改进**：\n\n```\n正常通信：\nServer ──── id: 42 ───► Client\nServer ──── id: 43 ───► Client\nServer ──── id: 44 ───► Client\n           [连接意外断开]\n\n客户端自动重连：\nClient ──── GET /mcp ─────────────► Server\n           Last-Event-ID: 43       (告知最后收到的事件)\n\nServer 从 id=44 开始重放：\nServer ──── id: 44 ───► Client\nServer ──── id: 45 ───► Client\n```\n\n| 规则 | 说明 |\n|------|------|\n| **事件 ID 分配** | 可选，ID 在会话内全局唯一 |\n| **客户端重连** | 发送 GET 请求，携带 `Last-Event-ID` 头 |\n| **服务器重放** | 可选重放断连后的消息，但不能重放其他流的消息 |\n| **恢复方式** | 始终通过 GET 请求进行（无论原始流是 POST 还是 GET 启动的） |\n\n### 3.7 多连接与消息分发\n\n- 客户端可以同时维持**多个 SSE 流连接**\n- 服务器必须将每条消息**仅在一个连接流上发送**，不可广播\n- 消息丢失风险通过流可恢复性缓解\n\n---\n\n## 4. 与 HTTP+SSE 的对比\n\n### 4.1 架构对比\n\n```\n旧方案 (HTTP+SSE)：                    新方案 (Streamable HTTP)：\n\n┌──────────┐        ┌──────────┐        ┌──────────┐        ┌──────────┐\n│ Client   │        │ Server   │        │ Client   │        │ Server   │\n│          │──GET──►│ /sse     │        │          │        │          │\n│          │◄─SSE──│          │        │          │──POST─►│          │\n│          │        │          │        │          │◄─JSON──│ /mcp     │\n│          │──POST─►│ /msg     │        │          │  或     │ (单端点)  │\n│          │        │          │        │          │◄─SSE───│          │\n└──────────┘        └──────────┘        │          │──GET──►│          │\n                                         │          │◄─SSE───│          │\n         双端点耦合                               └──────────┘        └──────────┘\n\n                                                        单一端点按需响应\n```\n\n### 4.2 能力矩阵\n\n| 维度 | HTTP+SSE (2024-11-05) | Streamable HTTP (2025-03-26+) |\n|------|----------------------|-------------------------------|\n| 端点数量 | 2 个（`/sse` + `/messages`） | **1 个**（MCP 端点） |\n| 无状态支持 | ❌ 不支持 | ✅ 完全支持 |\n| 会话管理 | 无标准化机制 | `MCP-Session-Id` 标准头 |\n| 协议版本 | 无版本头 | `MCP-Protocol-Version` 头 |\n| 流恢复 | ❌ 断开即丢失 | ✅ `Last-Event-ID` 续传 |\n| 按需流式 | ❌ 始终流式 | ✅ 服务器自主选择 JSON 或 SSE |\n| 连接管理 | 强制长连接 | **可选**长连接（Server 可主动关闭） |\n| retry 控制 | 无标准化 | 标准化 `retry` 字段 |\n| 显式取消 | 无 | `CancelledNotification` |\n| 多连接 | 不支持 | ✅ 支持多个 SSE 流 |\n| 基础设施兼容 | ⚠️ 需特殊配置 | ✅ 「只是 HTTP」 |\n\n---\n\n## 5. 为什么不用 WebSocket？\n\n官方团队详细评估了 WebSocket，最终决定暂时不采用：\n\n| 原因 | 说明 |\n|------|------|\n| **RPC 场景不匹配** | 无状态 RPC 风格的服务每次调用都建立 WebSocket 太重 |\n| **浏览器请求头限制** | WebSocket 连接无法附加 `Authorization` 等自定义请求头 |\n| **升级限制** | 只有 GET 能升级为 WebSocket，POST 需要两步升级 |\n| **兼容性负担** | 引入 WebSocket 会大幅增加客户端/服务端兼容性组合 |\n| **SSE 可模拟** | 浏览器中 SSE 可用第三方库完整模拟，WebSocket 不能 |\n\n> 官方保持开放态度：如果实践中 SSE 不够用，未来可能重新评估 WebSocket。同时不阻止社区自行扩展。\n\n---\n\n## 6. 迁移指南\n\n### 6.1 服务器端迁移\n\n**渐进式方案**（推荐）：\n\n```\n1. 保留旧端点 /sse 和 /messages（向后兼容旧客户端）\n2. 新增 MCP 端点 /mcp（支持 Streamable HTTP）\n3. 新旧端点并存运行\n4. 逐步淘汰旧端点\n```\n\n### 6.2 客户端兼容探测\n\n客户端需要自动识别服务器支持的传输类型：\n\n```\n步骤 1：尝试 Streamable HTTP\n  Client ──── POST /mcp ──────────► Server\n            { \"method\": \"initialize\" }\n            Accept: application/json, text/event-stream\n\n  若成功 → 服务器支持 Streamable HTTP，使用新传输\n\n  若失败 (400/404/405) →\n\n步骤 2：降级到旧 HTTP+SSE\n  Client ──── GET /sse ───────────► Server\n            Accept: text/event-stream\n\n  若收到 endpoint 事件 →
